schema: jm-recipe/v1
id: dgx-spark-8x/glm-5.3-nvfp4-tp8
title: Full GLM-5.3 (744B, RadixArk NVFP4) on 8x DGX Spark, vLLM TP8 over 200G RoCE + MTP, 512K context
summary: >-
  GhettoRak's daily GLM-5.3 lane. RadixArk's ModelOpt NVFP4 build (routed experts W4A4 group-16; attention, shared experts,
  layers 0-1 and the MTP layer kept bf16; 432.9 GiB) served tensor-parallel 8 across eight DGX Spark GB10 nodes on one
  CRS804. 524,288-token context on a 720,384-token KV pool, single-stream decode 25.8-35.7 tok/s with MTP k=3 (ahead of the FP8 sibling on all three
  prompts), 4-stream aggregate 61.7 tok/s (+54% vs FP8), ~1.2-1.4K tok/s prefill, needles pass at 35K/70K/140K/280K/514K. Trades fidelity for room: third-party
  KLD 0.0511 vs BF16 against 0.0223 for the official FP8 (sibling recipe dgx-spark-8x/glm-5.3-fp8-tp8).
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-10-16'
tags:
- glm-5.3
- nvfp4
- modelopt
- vllm
- dgx-spark
- gb10
- tp8
- roce
- mtp
- long-context
model:
  name: GLM-5.3
  params: 744B (MoE, glm_moe_dsa, 78 layers)
  repo: https://huggingface.co/RadixArk/GLM-5.3-NVFP4
  revision: 6e389189d564d9d3e4ea7fa284fe91f136d8ae2a
  quantization: >-
    NVFP4 (ModelOpt 0.47.0.dev, group 16) on routed experts; 231 ignore entries keep self_attn, shared experts, mlp.gate,
    layers 0-1, embed/lm_head and the MTP layer (model.layers.78*) in bf16; checkpoint kv_cache_scheme fp8 (serve-time
    fp8_ds_mla used here). 47 safetensors, 464,823,042,096 bytes; all 49 LFS files sha256-matched to the Hub on all eight nodes.
    Third-party QFS teacher-forced KLD vs GLM-5.3 BF16: 0.0511 (malaiwah/quant-fidelity-suite, comparator 312a2551db89; stored
    weights reconstructed, not executed through these kernels).
  draft:
    repo: https://huggingface.co/RadixArk/GLM-5.3-NVFP4 (in-checkpoint MTP layer, bf16)
    revision: 6e389189d564d9d3e4ea7fa284fe91f136d8ae2a
    method: mtp, num_speculative_tokens 3 (fixed; swept k=1/3/4/5-adaptive on 2026-10-16)
hardware:
  profile: hardware/dgx-spark-8x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 8
  observed:
    gpu: NVIDIA GB10 x8
    driver: '595.84'
    cuda: '13.2'
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.4 LTS (DGX OS 7.2.3)
    kernel: 6.17.0-1031-nvidia
    snapshot: results/2026-10-16-nvfp4-radixark-tp8/system.json
  required_settings:
  - Same fabric, kernel and memory settings as the FP8 sibling (see hardware/dgx-spark-8x.yaml and recipes/dgx-spark-8x/glm-5.3-fp8-tp8).
  - gpu-memory-utilization 0.80, not higher. 0xMagnus measured a global OOM on the head at 0.86 during FP4 autotune; at 0.80 the head keeps ~8.6-8.9 GB host memory free while serving here.
runtime:
  engine: vLLM
  engine_version: 0.11.2.dev280+gilded.gnosis.v18 (ciprianveg gb10-vllm v19-vision; local-inference-lab fork with B12X sparse-MLA kernels for SM121)
  container:
    image: ghcr.io/ciprianveg/gb10-glm-5.2:v19-vision
    digest: sha256:7ac0031cfefc83e2d3fb127faf0c4a58ba25c8a33e2e5690c3e3760d51097898
    base_image: >-
      registry manifest digest above; loaded Id on overlay2 hosts sha256:ba79eedf36272341fe7fa30f00f3b9aeaf25a4d18faa4257a63f6cf0bd13c564
      (launcher refuses anything else). Same image as the FP8 sibling. NCCL 2.30.4 preloaded by the image.
  key_libraries:
    nccl: 2.30.4 (image LD_PRELOAD)
    flashinfer: image build (trtllm fused_moe FP4 GEMMs autotuned at boot, ~104 s)
launch:
  script: scripts/cluster.sh
  command: SPARK_HOSTS="spark1 spark2 spark3 spark4 spark5 spark6 spark7 spark8" bash scripts/cluster.sh push && SPARK_HOSTS="..." bash scripts/cluster.sh up
  health: BASE_URL=http://<head>:8890/v1 GLM53_API_KEY=... python3 scripts/gates.py
  warmup: One discarded request per prompt class before measuring.
  notable_flags:
  - Per-node launcher scripts/launch-nvfp4-tp8.sh <rank>; workers 7..1 then head 0; mp executor, --nnodes 8 --node-rank N.
  - Identical to the FP8 sibling except - model path, --gpu-memory-utilization 0.80, --max-model-len 524288, VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR set (0xMagnus reports it is a no-op at TP>1 on this build), and --speculative-config method mtp num_speculative_tokens 3 (SPEC_K, default 3; 0xMagnus shipped 1) with no quantization field (bf16 MTP layer). SPEC_DEPTHS / ADAPT_WIN expose the adaptive controller (tested, not better).
  - --attention-backend B12X_MLA_SPARSE --kv-cache-dtype fp8_ds_mla, DSA index_topk_pattern hf-override, --max-num-seqs 4 --max-num-batched-tokens 4096, decode-aware prefill, cudagraph FULL requested, engine falls back to FULL_AND_PIECEWISE (B12X non-compressed indexer), --disable-custom-all-reduce, --model-loader-extra-config enable_multithread_load true num_threads 8, reasoning_effort low default.
  - Launcher SHA-256 b924b8233408199389d24066cd4da1ed96fd3bc44becdc74bd72c34d9214769a (2026-10-16, k=3 default).
