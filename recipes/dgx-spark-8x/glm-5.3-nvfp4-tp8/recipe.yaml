limits:
- "Fidelity: NVFP4 is measurably further from BF16 than the official FP8 (QFS 0.0511 vs 0.0223, stored weights). Pick the FP8 sibling when token fidelity matters more than context or concurrency."
- "MTP depth matters more than the weight format here. At k=1 (the upstream default) NVFP4 was 7-12% slower than FP8 single-stream, because RadixArk keeps attention and shared experts in bf16 and reads more bytes per token than the official FP8 (8.16 vs 6.20 GiB/rank for one token). At k=3 each step verifies ~2.9 tokens, past the ~3-token point where NVFP4 reads fewer bytes, and it leads FP8 on all three prompts. k=4 gained 3.5% on code but lost on prose and C4; k=5 adaptive kept collapsing depth (2.2-2.4 accepted). Prompt sensitivity: technical explanation gains least (+8%)."
- "reasoning_effort high at 1,500 max tokens hit the length limit with a partial answer (1,417 content chars, finish length); at 16,000 it finished in 2,716 tokens (stop). FP8 at 1,500 returned empty content. The template honours only low and high."
- "Context: 524,288 configured; needle PASS at 513,814 tokens (413.9 s) with the head at 8.5 GB host free. One needle per length, depth 0.5 only; this is retrieval at depth, not long-context reasoning. 1M needs nvfp4_ds_mla KV or DCP, neither tested here (0xMagnus: DCP fails on the DSA indexer page-size unifier)."
- "Boot 17.5 min cold (torch.compile cache cold for this model; ~10 min of it is the head's single-file-at-a-time weight load even with 8 threads)."
- "Decode is latency/weight-read bound on this image; VLLM_ENABLE_ROCE_ALLREDUCE does not exist in v19 (see FP8 sibling limits)."
rollback:
  script: scripts/cluster.sh
  summary: "SPARK_HOSTS=... scripts/cluster.sh down. To go back to the FP8 sibling: NAME=glm53_fp8_tp8 LAUNCHER=launch-fp8-tp8.sh cluster.sh up (weights for both stay on every node; ~1.2 TB per node)."
