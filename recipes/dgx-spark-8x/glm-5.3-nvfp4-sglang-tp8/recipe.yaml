limits:
- "Unified-memory trap: without SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION=0.01 every config above ~100K tokens of prompt hangs the TP group (NV_ERR_NO_MEMORY, scheduler watchdog). 0.03 measured no different from 0.01; the budget is not a decode lever (spec-verify stays under the chunking threshold)."
- "Chunked prefill must be 4096 at 512K. 8192 and 16384 hang on the first 35K prompt (arms s3, s4) even with the budget bounded; cause not isolated beyond the same NV_ERR_NO_MEMORY signature."
- "Prefill is ~half the vLLM sibling's at 514K (640 vs 1,241 tok/s): prefill-max-requests 1 + chunk 4096 serialize it. 131K prefill is ~1.1K tok/s on both."
- "4 draft steps trade explanation speed (23.7 vs 25.1 at 3 steps) for code (36.2 vs 35.7) and the fastest agent chain. SG_SPEC=3,1,4 is the balanced alternative; SG_SPEC=2,1,3 is the throughput alternative (64.0 C4 at 131K, 31.8 code)."
- "1M context is out on SGLang for this model: fp8 DSA KV is 53,940 B/token, 1,048,576 tokens need 52.68 GiB/rank and post-weight free is 52.3-52.6 GiB. 768K booted (774,400 pool at fraction 0.88, no spec) and died on the first 470K prompt. The vLLM sibling with nvfp4_ds_mla KV holds the 754K result."
- "Refused on SM121 in v0.5.22: EAGLE topk>1 (DSA backend), MoE backends flashinfer_cutedsl and triton (exit at load), FlashInfer autotune (deadlock). Shared-experts fusion and SGLANG_FLASHINFER_MOE_FUSED_FINALIZE boot fine and measure no change."
- "Context: one needle per length at depth 0.5; retrieval, not long-context reasoning. Rails (prefill-max-requests 1, max-queued-requests 8, SGLANG_REQ_WAITING_TIMEOUT=30) were exercised by the 4-stream bench, not by an overload test; an over-budget request path has not been forced."
- "Hermes bench numbers include the CLI harness (~1.5 s per turn) and a ~7K-token system prompt; they are agent-shaped wall-clock, not engine throughput, and n=3."
rollback:
  script: scripts/cluster.sh
  summary: "NAME=glm53_sglang_tp8 LAUNCHER=launch-sglang-tp8.sh scripts/cluster.sh down. vLLM sibling: NAME=glm53_nvfp4_tp8 LAUNCHER=launch-nvfp4-tp8.sh cluster.sh up (same weights on every node; the vLLM image must be present - it was once deleted by hand and re-copied over the fabric)."
