    health: { how: "scripts/gates.py: keyless 401, glm-5.3-nvfp4-sglang / 524288, exact-reply smoke ROUTE_OK, get_weather tool call + tool-result round", last_pass_utc: "2026-10-17T20:40:00Z", run_id: 2026-10-17-sglang-recipe-campaign }
