schema: jm-recipe/v1
id: dgx-spark-8x/glm-5.3-nvfp4-sglang-tp8
title: Full GLM-5.3 (744B, RadixArk NVFP4) on 8x DGX Spark, SGLang v0.5.22 TP8 over 200G RoCE + EAGLE/NextN, 512K context
summary: >-
  GhettoRak's SGLang lane for full GLM-5.3: RadixArk's ModelOpt NVFP4 build served tensor-parallel 8 across eight DGX Spark
  GB10 nodes on one CRS804 with stock SGLang v0.5.22 (lmsysorg/sglang:v0.5.22-cu130). 524,288-token context on a
  654,336-token fp8 KV pool, 4 request slots, single-stream decode 23.7-36.2 tok/s with in-checkpoint NextN as a 4-step EAGLE
  drafter (code faster than the vLLM sibling, explanation slower), 4-stream aggregate 59.5 tok/s, needles pass at 35K/131K/514K,
  and a 20-step Hermes tool chain in 31.7 s (vLLM sibling 45.8 s). Needs one env var (SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION=0.01)
  or long prompts hang the group on unified memory; chunked prefill must stay at 4096. Sibling vLLM recipe dgx-spark-8x/glm-5.3-nvfp4-tp8.
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-10-17'
tags:
