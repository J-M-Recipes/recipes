model:
  name: GLM-5.3
  params: 744B (MoE, glm_moe_dsa / GlmMoeDsaForCausalLM, 78 layers)
  repo: https://huggingface.co/RadixArk/GLM-5.3-NVFP4
  revision: 6e389189d564d9d3e4ea7fa284fe91f136d8ae2a
  quantization: >-
    Same checkpoint as the vLLM sibling: NVFP4 (ModelOpt, group 16) on routed experts; attention, shared experts, mlp.gate,
    layers 0-1, embed/lm_head and the NextN/MTP layer bf16. 47 safetensors, 464,823,042,096 bytes; 49/49 LFS files
    sha256-matched to the Hub on all eight nodes (2026-10-16). KV served as fp8_e4m3 (SGLang's DSA pool accepts only fp8_e4m3
    or bf16; no 4-bit KV path). Third-party QFS stored-weight KLD vs BF16 0.0511 (not executed through these kernels).
  draft:
    repo: https://huggingface.co/RadixArk/GLM-5.3-NVFP4 (in-checkpoint NextN layer, bf16; SGLang NEXTN resolves to EAGLE)
    revision: 6e389189d564d9d3e4ea7fa284fe91f136d8ae2a
    method: EAGLE, speculative-num-steps 4, eagle-topk 1, num-draft-tokens 5 (swept 2/3/4/5 steps; topk>1 is rejected by the DSA backend)
hardware:
  profile: hardware/dgx-spark-8x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 8
  observed:
    gpu: NVIDIA GB10 x8
    driver: '595.84'
    cuda: '13.0 (container) on 13.2 host'
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.4 LTS (DGX OS 7.2.3)
    kernel: 6.17.0-1031-nvidia
    snapshot: ../glm-5.3-nvfp4-tp8/results/2026-10-16-nvfp4-radixark-tp8/system.json
  required_settings:
  - Same fabric, kernel and memory settings as the vLLM siblings (hardware/dgx-spark-8x.yaml). GPU clocks capped at 2200 MHz on all eight (nvidia-smi -lgc 0,2200 as a systemd unit) since 2026-10-16; an uncapped ~514K prefill drew ~1.74 kW and tripped a 1,440 W strip. Capped long prefill 1,350-1,425 W; decode unchanged.
  - SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION=0.01. The DSA indexer's fp32 logits scratch is budgeted from memory the planner thinks is free; on unified memory that is the host's working set. With the default 0.2, host free memory ratchets ~80 KB per prompt token and the group dies with NV_ERR_NO_MEMORY at ~100-140K tokens regardless of mem-fraction (five probes, 2026-10-17). Reported on sglang #36941.
  - --chunked-prefill-size 4096. 8192 and 16384 hang on the first 35K-token prompt even with the budget bounded (arms s3, s4).
  - --disable-flashinfer-autotune. The all-rank autotune forward deadlocks on this cluster (two ranks never return); a longer dist timeout does not help.
runtime:
  engine: SGLang
  engine_version: 0.5.22 (torch 2.14.1+cu130, flashinfer 0.7.1, NCCL as shipped in the image)
  container:
    image: lmsysorg/sglang:v0.5.22-cu130
    digest: sha256:e3a4f06001a29542fc4a8638536d9ffc5eb9c9942b08603c09b19a56eae4a1ae
    base_image: >-
      stock upstream image, no overlay, no patches. Tag v0.5.22 = baa9befa (2026-10-15). 120 main commits after it touch nothing
      SM121-specific; FlashInfer 0.7.2 (#44591) lands with open #42368 against flash_mla_sm120.py, so a nightly is a risk not a win.
  key_libraries:
    flashinfer: 0.7.1 (image; flashinfer_sparse_mla decode, flashinfer_cutlass FP4 MoE - the only MoE backend that loads on SM121; cutedsl and triton exit at load)
    torch: 2.14.1+cu130
launch:
  script: scripts/cluster.sh
  command: see results/2026-10-17-sglang-recipe-campaign/launch-command.txt (SG_* env -> scripts/launch-sglang-tp8.sh per rank; NAME=glm53_sglang_tp8 LAUNCHER=launch-sglang-tp8.sh SPARK_HOSTS="..." bash scripts/cluster.sh up)
  health: BASE_URL=http://<head>:8891/v1 GLM53_API_KEY=... python3 scripts/gates.py
  warmup: One discarded request per prompt class before measuring; Hermes bench runs one discarded turn.
  notable_flags:
  - Per-node launcher scripts/launch-sglang-tp8.sh <rank>; --nnodes 8 --node-rank N --tp 8 --dist-init-addr <head>:50000; NCCL over both RoCE PFs (NCCL_IB_HCA=rocep1s0f0,roceP2p1s0f0, GID 3, RoCE v2, NCCL_CROSS_NIC=1, NVLS off, CUMEM off).
  - --context-length 524288 --mem-fraction-static 0.80 --max-running-requests 4 --chunked-prefill-size 4096 --max-prefill-tokens 4096 --prefill-max-requests 1 --max-queued-requests 8 --kv-cache-dtype fp8_e4m3 --cuda-graph-max-bs-decode 4 --disable-flashinfer-autotune --disable-shared-experts-fusion (SG_SEF=1 turns fusion on; measured no effect).
  - --speculative-algorithm EAGLE --speculative-num-steps 4 --speculative-eagle-topk 1 --speculative-num-draft-tokens 5 (SG_SPEC=4,1,5).
  - env SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION=0.01 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False NCCL_BUFFSIZE=16777216 NCCL_MAX_NCHANNELS=4 NCCL_MIN_NCHANNELS=4 SGLANG_REQ_WAITING_TIMEOUT=30. The NCCL pin (copied from the vLLM sibling launcher) is the biggest single lever found - +8% prose decode and +15% KV pool (654K vs 569K) on the same fraction.
  - VARIANT solo 2-slot (arm s10) - SG_MAXRUN=2, no SG_EXTRA rails, same speed, KV pool 654,272; use when the lane is single-user only.
  - VARIANT throughput 131K (campaign 2026-10-16/17) - SG_SPEC=2,1,3 at 131K / 4 slots gave the best 4-stream aggregate of the night (64.0 tok/s) at the cost of code decode (31.8); not the published default.
  - Launcher SHA-256 66b721bb8cd65cbd3a95bcd11ede6d069f24c075eccb6e0e90c9565096f5a73a (2026-10-17, SG_SEF switch added).
