schema: jm-recipe/v1
id: dgx-spark-8x/glm-5.3-fp8-tp8
title: Full GLM-5.3 (744B, official zai-org FP8) on 8x DGX Spark, vLLM TP8 over 200G RoCE + MTP
summary: >-
  The unquantized-trained GLM-5.3 checkpoint (official FP8, 703.7 GiB) served tensor-parallel 8 across eight DGX Spark GB10
  nodes on one MikroTik CRS804, with the in-checkpoint MTP head (adaptive depth 2/4/5). 131K context (KV pool 150-182K tokens
  per boot), single-stream decode 23-30 tok/s on realistic prompts (temp 0, reasoning low), 4-stream aggregate 40-42 tok/s,
  ~1.2K tok/s prefill at 70K, needles pass at 35K and 70K. Boot 13 min with 8-thread loading (27.5 min stock). No
  re-quantization; every weight file sha256-matched to the Hub on every node.
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-10-16'
tags:
- glm-5.3
- fp8
- vllm
- dgx-spark
- gb10
- tp8
- roce
- mtp
model:
  name: GLM-5.3
  params: 744B (MoE, glm_moe_dsa, 78 layers)
  repo: https://huggingface.co/zai-org/GLM-5.3
  revision: ba32f8c19c8738e2c57c71798c601d477a7bf844
  quantization: >-
    FP8 as shipped by Z.ai (e4m3, 128x128 block scales, activation_scheme dynamic); 141 safetensors, 755,632,050,320 bytes;
    all 143 LFS files sha256-matched to the Hub on all eight nodes (results/2026-10-16-fp8-tp8-baseline-mtload/raw/weight-fanout-verify.log).
    Weight shards are sha256-identical to revision e0b07fd2; ba32f8c1 changed chat_template.jinja (tool-result validation) and eval yamls only.
  draft:
    repo: https://huggingface.co/zai-org/GLM-5.3 (in-checkpoint MTP layer)
    revision: ba32f8c19c8738e2c57c71798c601d477a7bf844
    method: mtp, num_speculative_tokens 5, VLLM_ADAPTIVE_SPEC_DEPTHS=2,4,5
hardware:
  profile: hardware/dgx-spark-8x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 8
  observed:
    gpu: NVIDIA GB10 x8
    driver: '595.84'
    cuda: '13.2'
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.4 LTS (DGX OS 7.2.3)
    kernel: 6.17.0-1031-nvidia
    snapshot: results/2026-10-16-fp8-tp8-baseline-mtload/system.json
  required_settings:
  - Kernel 6.17.0-1031/1032 on every node, apt-held. 7.0.0-1019 breaks NCCL RoCE memory registration once ~90 GB is CUDA-resident, which is this recipe's load.
  - Both PCIe functions of the cabled QSFP cage on separate /24s (10.0.0.N and 10.0.1.N), MTU 9000, and both in NCCL_IB_HCA. 8-node all_reduce must reach >= 20 GB/s busbw at 1 GiB before booting (scripts/run_bench.sh).
  - vm.swappiness=10 and an unconditional page-cache drop every 60 s for the whole boot (scripts/bootflush.sh). Host free memory sits at ~7-8 GB per node once serving.
  - Full checkpoint on local NVMe on every node (each rank reads all 704 GiB at load). Stage it once and fan out over the fabric; never pull from the Hub on a serving rank.
runtime:
  engine: vLLM
  engine_version: 0.11.2.dev280+gilded.gnosis.v18 (ciprianveg gb10-vllm v19-vision; local-inference-lab fork with B12X sparse-MLA kernels for SM121)
  container:
    image: ghcr.io/ciprianveg/gb10-glm-5.2:v19-vision
    digest: sha256:7ac0031cfefc83e2d3fb127faf0c4a58ba25c8a33e2e5690c3e3760d51097898
    base_image: >-
      registry manifest digest above; on overlay2 Docker hosts the loaded image Id is sha256:ba79eedf36272341fe7fa30f00f3b9aeaf25a4d18faa4257a63f6cf0bd13c564
      (launcher refuses any other Id). Image ENV preloads NCCL 2.30.4 (/opt/libnccl-local-inference.so.2.30.4); torch-bundled NCCL is 2.29.7.
  key_libraries:
    nccl: 2.30.4 (image LD_PRELOAD)
    torch: 2.x cu13.2 (image)
launch:
  script: scripts/cluster.sh
  command: SPARK_HOSTS="spark1 spark2 spark3 spark4 spark5 spark6 spark7 spark8" bash scripts/cluster.sh push && SPARK_HOSTS="..." bash scripts/cluster.sh up
  health: BASE_URL=http://<head>:8890/v1 GLM53_API_KEY=... python3 scripts/gates.py (keyless 401, /v1/models, exact-reply smoke, tool call + tool-result round)
  warmup: One discarded request per prompt class before measuring; first request after boot pays nothing visible beyond ~4 s TTFT.
  notable_flags:
  - Per-node launcher scripts/launch-fp8-tp8.sh <rank>, workers 7..1 first then head 0. mp executor with --nnodes 8 --node-rank N (no Ray), --master-addr = head fabric IP.
  - --tensor-parallel-size 8 --pipeline-parallel-size 1 --decode-context-parallel-size 1 --attention-backend B12X_MLA_SPARSE --kv-cache-dtype fp8_ds_mla, DSA index_topk_pattern hf-override (FFFSSS...).
  - --gpu-memory-utilization 0.86 --max-model-len 131072 --max-num-seqs 4 --max-num-batched-tokens 4096 --enable-chunked-prefill --enable-prefix-caching --async-scheduling, decode-aware prefill (decode budget 1024, idle 16384, 1 long prefill per step).
  - --speculative-config method mtp, model = the checkpoint, quantization fp8, num_speculative_tokens 5, draft_attention_backend B12X_MLA_SPARSE, probabilistic draft sampling, adaptive window 32; env VLLM_ADAPTIVE_SPEC_DEPTHS=2,4,5.
  - --compilation-config cudagraph_mode FULL, max_cudagraph_capture_size 30 (engine truncates to 24), --disable-custom-all-reduce.
  - --model-loader-extra-config enable_multithread_load true, num_threads 8 (boot-time only; head weight load 956.6 s -> 566.9 s).
  - --default-chat-template-kwargs reasoning_effort low. The template honours only low and high; anything else (off, medium, max, absent) becomes max.
  - NCCL env NCCL_IB_HCA=rocep1s0f0,roceP2p1s0f0, GID index probed (3), RoCE v2, AF_INET, CROSS_NIC 1, NVLS off, CUMEM off, BUFFSIZE 16M, 4 channels. No NCCL_IB_ADDR_RANGE (the second PCIe function lives on 10.0.1.0/24).
  - Bearer key via VLLM_API_KEY on the head only; port 8890.
  - Launcher SHA-256 dfeb155ad6318300aa0e07d725cf995605e318e0bd5a8eb65d4a79a03e3c7600 (2026-10-16).
