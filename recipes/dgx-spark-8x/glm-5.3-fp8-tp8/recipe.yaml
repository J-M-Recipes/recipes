verification:
  gates:
    schema: { how: "scripts/check_recipe.py passes", last_pass_utc: "2026-10-16T19:40:00Z", run_id: 2026-10-16-fp8-tp8-baseline-mtload }
    digest: { how: "every node's loaded image Id = sha256:ba79eedf... (launcher refuses otherwise); every node's checkpoint: 143/143 LFS files sha256 == Hub LFS sha256 at the pinned revision", last_pass_utc: "2026-10-16T17:41:56Z", run_id: 2026-10-16-fp8-tp8-baseline-mtload }
    health: { how: "scripts/gates.py: keyless /v1/models 401, keyed 200 with glm-5.3-fp8 / 131072, exact-reply smoke, get_weather tool call with correct args, tool-result round finishes stop with the result used", last_pass_utc: "2026-10-16T19:13:00Z", run_id: 2026-10-16-fp8-tp8-baseline-mtload }
    quality: { how: "PENDING. Weights are byte-identical to the official checkpoint and MTP is target-verified, so the model function is the reference by construction; a teacher-forced logprob check of MTP-on vs MTP-off on this stack has not been run. Needles 35K/70K pass; tool calling 1/1 two-round.", run_id: 2026-10-16-fp8-tp8-baseline-mtload }
    performance: { how: "scripts/bench.py C1 medians within 5% of 29.9 / 23.1 / 26.9 (code / explain / prose)", last_pass_utc: "2026-10-16T19:12:15Z", run_id: 2026-10-16-fp8-tp8-baseline-mtload }
limits:
- "Context: KV pool is 149,824-181,632 tokens depending on the boot (8.8-10.9 GiB/rank at gmu 0.86; ~10-20% boot-to-boot variance, also seen by 0xMagnus). max-model-len 131072 keeps one full request inside the low reading. 1M is not reachable: weights + MTP head take 90.96 GiB/rank. Retrieval measured to 70K only; 128K untested (head node has ~6.8 GB host headroom while serving)."
- "reasoning_effort high with a small budget returns NO answer: 1,500 max_tokens spent entirely on thinking (finish length, empty content). Reproduced on the official FP8 here, so it is not an abliteration artifact (0xMagnus reported it on the uncensored build). Use low, or budget >= 16K tokens for high. Reasoning comes back in message.reasoning."
- "Decode is not limited by the fabric's bandwidth but by per-token latency and per-rank weight reads. Light Foundry's VLLM_ENABLE_ROCE_ALLREDUCE (their 28.5 -> 38 tok/s on Int4-Int8Mix) does not exist in this image. A small-message all_reduce probe (bf16, 8 ranks, NCCL_ALGO=Tree PROTO=LL) measured 81 us at 12 KB, 90 us at 36 KB; ESTIMATE: ~2 all-reduces per layer x 78 layers = ~156 per target step = ~13-14 ms of an ~80-150 ms step (step time inferred from tok/s and acceptance length, not profiled). The default and Ring arms of that probe did not complete (rendezvous timed out; run abandoned), so no algorithm comparison is claimed and NCCL_ALGO is left at default."
- "The adaptive MTP controller settles at depth 2 on prose (mean acceptance length 2.0-2.3) and 4-5 on code (4.1-4.9). No fixed-k arm was measured."
- "Boot time is CPU-bound on the head: one loader thread at 100% while the NVMe idles (each rank reads all 704 GiB to keep 88). 8 threads cut the head load 956.6 -> 566.9 s; workers finish in ~7 min either way. sharded_state pre-sharding is the next lever and is untested on this fork with FP8 + MTP."
- "The head node is the long pole and the tightest on host memory (~6.8-8 GB free serving vs ~8 GB on workers at gmu 0.86). Do not raise gmu."
- "Power: ~1.5 kW for the rack at stock clocks under prefill. Size circuits accordingly (see hardware profile)."
- "Single seat in practice: max-num-seqs 4, C4 aggregate 40-42 tok/s at 11.5-14 tok/s per user."
rollback:
  script: scripts/cluster.sh
  summary: "SPARK_HOSTS=... scripts/cluster.sh down removes the container on all 8 ranks (head first, then 7..1). Nothing else on the nodes is modified by this recipe beyond the page-cache flusher, which exits on its own after 50 min."
