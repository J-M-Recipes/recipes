limits:
- "Round 2 found no lever. Six boots, one change each vs knapcio's v2.4 block, KEEP bar +2% on any headline metric with no regression > 2%: nothing cleared it. C1 and C6 moved within a +-3% noise band (C1 agg 78.7-83.7, C6 249.9-261.6). The published config is the authors' block plus one robustness override."
- "HAZARD - SKIP_PREPARE. Any env that un-sets SKIP_PREPARE=1 makes boot.py snapshot_download its hard-coded REVISION fb2764a5... INTO MODEL_DIR. On 2026-10-19 (~20:27 CDT boot) this overwrote shards on spark1; the copy was restored from spark5 (21:08-21:21) and re-verified 48/48. scripts/launch-sglang-tp4.sh aborts unless the rendered env has SKIP_PREPARE=1 and HF_REVISION=1bae0e10."
- "state-tp4/launch.json records revision fb2764a5cf321eaa5070ca8f9e892818f477c16d. That is boot.py's hard-coded constant, not the mounted checkpoint; MODEL_DIR (1017, 1bae0e10) is what is mounted at /models/DeepSeek-V4.1-Flash."
- "B0ctl's 93K window (2026-10-19 20:04-20:21 CDT) read 3,145 single / 3,304 median while the same config read 5.0K (B0) and 6.1-6.2K in four later boots. A deliberate cross-pod A/B (2026-10-20 05:00-05:07) was NEGATIVE (B 6,219 -> 6,242 with lane C prefilling; C 5,993 -> 6,009), so it is not fabric contention. Unexplained outlier."
- "300K first-touch: run 1 of the 300K needle is 2.2-3.5K tok/s on every arm; runs 2-3 reach 4.0-4.9K on B0, B1a, B1b and B2, but stay 2.5-2.7K on B0ctl (outlier window) and 3.0-3.1K on B3 (prefill-decode-interval 4). Report run 1 separately; do not average it in."
- "NV_ERR_NO_MEMORY bursts in dmesg during B0's needle window (head, 271 events per the ladder notes) did not recur as a burst in later arms (dmesg counts only rotated). The 1 GiB indexer budget lifts the head MemAvailable floor 11.8 -> 14.9 GiB; that is why it is the serving default."
- "KV pool varies by boot (4.52M-5.93M tokens) independent of the arm - knapcio's documented fast-loader variance. Only B2's +9% (swa-prefix-tails 64) is attributable."
- "Decode trails the vLLM sibling: per-stream C1 96 vs 104, C6 253-262 vs 289. 300K prefill trails too (runs 2-3 4.0-4.9K vs 5.4K). 93K prefill is level (6.2K vs 6.0K)."
- "Per-class DSpark acceptance not measured on this lane: SGLang serves no /metrics in this launch, and the shared spec_by_cat.py reads vLLM counters. Pending."
- "Fidelity is thin: no teacher-forced comparison, no public bench run by us, tool-call gate not recorded (gates.py died at /metrics). qeval 71/75 is a content score, not a model-fidelity gate."
- "Boot is slow next to the sibling: ~6.4 min warm (5.6-6.75 across round 2), ~8 min cold JIT, vs ~1.5 min warm for vLLM."
- "Local image: dsv41-4x-spark:canary-roce is built on each node from the knapcio tree; the digest is a docker image ID, not a registry digest. The lane dir is a copy, not a clone; the exact knapcio commit is not recorded (content consistent with 27616bec)."
rollback:
  script: scripts/launch-sglang-tp4.sh
  summary: "SPARK_HOSTS=... bash scripts/launch-sglang-tp4.sh stop (= knapcio ./start-tp4.sh stop; if a worker container survives, docker stop dsv41-worker on that node by name). Sparks 1-4 previously served Lane A (TensorFold EXL3), kept stopped with its containers; restore with its relaunch script (not published here). The vLLM sibling dgx-spark-4x/deepseek-v4.1-flash-vllm-tp4-sparknet serves the same checkpoint on Sparks 5-8."
