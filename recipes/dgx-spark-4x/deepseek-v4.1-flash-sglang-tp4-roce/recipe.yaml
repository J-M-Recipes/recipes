model:
  name: DeepSeek-V4.1-Flash-1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active, 40 layers) + 196B Engram   # model card; same checkpoint as the GB300 recipe
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  quantization: >-
    As shipped, nothing re-quantized: routed experts MXFP4 (FP4 + UE8M0 block scales), attention/dense/Engram FP8
    (block 32x32). 48 safetensors, 510,296,708,312 bytes; 48/48 shard sha256 == Hub LFS oid at this revision
    (results/2026-10-19-sglang-ladder-r2/raw/weights/hub-lfs-compare.txt). One copy on spark1, shared to ranks 1-3 over
    NFSv4 on the fabric (NFS_SHARE=1). That copy was restored from spark5 on 2026-10-19 21:08-21:21 after a boot without
    SKIP_PREPARE overwrote shards (see limits) and re-checked 48/48. Engram served from NVMe-packed per-rank shards
    (OFFLOAD_MODE=nvme) with a 4 GiB row cache. config.json byte-identical to the GB300 recipe's copy.
  draft:
    repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017 (in-checkpoint DSpark/MTP head, 3 nextn layers)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
    method: DSpark block 5 (SGLang --speculative-algorithm DSPARK --speculative-dspark-block-size 5), folded sampling, fp8 draft head, adaptive verify cap conf:0.1, block verification for sampled rows; target-verified (lossless at T=0)
hardware:
  profile: hardware/dgx-spark-4x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 4
  observed:
    gpu: NVIDIA GB10 x4
    driver: '595.84'
    cuda: 13.0 (container, torch 2.13.0+cu130) on 13.2 host
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.4 LTS (DGX OS 7.2.3)
    kernel: 6.17.0-1031-nvidia
    snapshot: results/2026-10-19-sglang-ladder-r2/system.json
  required_settings:
  - Sparks 1-4 of the CRS804 rack (fabric 10.0.0.1-4 / 10.0.1.1-4, MTU 9000, lossy RoCEv2, both CX-7 PCI domains in NCCL_IB_HCA and B12X_ROCE_HCA, GID 3). Head spark1, API :8888. Lane C (vLLM) runs on Sparks 5-8 through the same switch; a 2026-10-20 A/B showed no cross-pod prefill contention.
  - GPU clocks capped 2200 MHz on all nodes (nvidia-smi -lgc 0,2200 systemd unit); clocks.gr under load 2190.
  - Before every boot drop_caches + compact_memory and gate MemAvailable (the round-2 chain gated at >= 100 GiB and read 118 GiB on all four). THP read madvise on all four nodes on 2026-10-20; the chain did not set it.
  - SKIP_PREPARE=1 in the env, always (see limits). The launcher in scripts/ refuses to start without it.
runtime:
  engine: SGLang
  engine_version: dsv4.1 branch at f80c91a4b (2026-09-16) inside lmsysorg/sglang:dev-dsv41 (package metadata still reads 0.0.0.dev1+gda64c5cbb, the base image's commit); torch 2.13.0+cu130, flashinfer 0.6.18, NCCL 2.30.7
  engine_commit: f80c91a4b
  container:
    image: dsv41-4x-spark:canary-roce
    digest: sha256:609343dd905f07999d9a60fa6fdc9801d83cb9a4b07a3c62d49d0531f63e4782
    dockerfile: results/2026-10-19-sglang-ladder-r2/Dockerfile.canary-roce
    dockerfile_sha256: dbd1cfbfb3d4f17c9d278a7b74dcb623ca5cf0109ba0a8192788ddfdc88e0c8c
    base_image: >-
      Local build on each node, not pullable; digest is the docker image ID (identical on spark1-4, created
      2026-10-18T10:45 CDT). Base lmsysorg/sglang:dev-dsv41 (image ID sha256:381b27ff..., 2026-09-11) with its python tree
      replaced by the SGLang dsv4.1 branch at f80c91a4b + rhys101's SG17 RoCEnante overlay (TP4-adapted) + b12x (SG17
      rev) + b12x_next (b12x main a7d7d29b) + knapcio adapters, from knapcio/DeepSeek-V4.1-Flash-4x-DGX-Spark-TP4 v2.4
      (CHANGELOG 2026-10-12; merge 37c85527). Our lane dir is a non-git copy; its content is consistent with
      27616beca58690ea3120ad687e721c1c7e735412 (lacks the 2026-10-17 ring commits) but the exact commit was not recorded.
  key_libraries:
    torch: 2.13.0+cu130
    flashinfer: 0.6.18 (MXFP4 MoE runner flashinfer_mxfp4 + fp8 GEMM flashinfer_cutlass; routed MoE on b12x_next at EP1)
    nccl: 2.30.7 (prefill/large collectives; decode all-reduce/all-gather <= 2 MiB on RoCEnante)
    b12x_next: a7d7d29b
launch:
  script: scripts/launch-sglang-tp4.sh
  command: SPARK_HOSTS="spark1 spark2 spark3 spark4" STACK_DIR=$HOME/dsv41-4x-spark bash scripts/launch-sglang-tp4.sh serve  (renders scripts/env.tp4.recipe to $STACK_DIR/.env.tp4 and execs knapcio's ./start-tp4.sh serve; exact engine argv in results/2026-10-19-sglang-ladder-r2/launch-command.txt)
  health: "curl -fs http://<head>:8888/v1/models ; engine log must show 'RoCEnante ready: world=4 hcas=rocep1s0f0,roceP2p1s0f0 gid_index=3 max_size=2097152', 'max_total_num_tokens=' between 4.5M and 5.9M, and 'The server is fired up'; then BASE_URL=http://<head>:8888 python3 scripts/gates.py <outdir>"
  warmup: boot.py runs its own smoke (state-tp4/smoke.json, '42') and warm-up; the battery discards nothing else. First 300K-class prompt after a boot is 25-40% slow (first-touch) - discard it.
  notable_flags:
  - TP 4, EP 1 (every rank holds a 576-wide slice of all 384 experts; routed MoE on b12x_next), --attention-backend dsv4, --moe-runner-backend flashinfer_mxfp4, --fp8-gemm-backend flashinfer_cutlass, --enable-decoder-swa-bounded-replay.
  - --context-length 1048576 --max-running-requests 16 --cuda-graph-max-bs-decode 16 --max-total-tokens 8000000 --mem-fraction-static 0.78 (head 0.78) --chunked-prefill-size 8192 --swa-prefix-tails 128 --prefill-decode-interval 2 --min-free-slots-delay 1 --sleep-on-idle --enable-cache-report.
  - --speculative-algorithm DSPARK --speculative-dspark-block-size 5; env SGLANG_DSPARK_FOLDED_SAMPLING=2 DSV41_DRAFT_TAU=0.7 DSV41_DRAFT_HEAD_FP8=1 DSV41_BLOCK_VERIFY=1 DSV41_VERIFY_CAP=conf:0.1 DSV41_CERT_HEAD=1.
  - Transport SGLANG_ROCE_ALLREDUCE=1 SGLANG_ROCE_MAX_SIZE=2097152 DSV41_ROCE_GATHER=2097152 B12X_ROCE_HCA=rocep1s0f0,roceP2p1s0f0; NCCL_IB_HCA both PFs, NCCL_IB_GID_INDEX=3, NCCL_BUFFSIZE=1048576 NCCL_LL128_BUFFSIZE=262144 NCCL_PROTO=^LL128 NCCL_MAX_NCHANNELS=8.
  - The one override over knapcio v2.4 (arm B1a) - EXTRA_CONTAINER_ENV += DSV41_INDEXER_LOGITS_BUDGET_BYTES=1073741824 (adapter default 2 GiB). Head MemAvailable floor 11.5-11.8 -> 14.9 GiB over the battery; speed within noise.
  - VARIANT B2 capacity - --swa-prefix-tails 64 instead of 128 gave the largest KV pool of the round (5,927,424) at unchanged speed; costs knapcio's 388K-session revisit cache. Offered, not default.
  - Rendered env of the measured boot results/2026-10-19-sglang-ladder-r2/raw/B1a/B1a.rendered-env.txt; scripts/env.tp4.recipe sha256 40bcea6fe3f9f23aa4e5e865b066524cb755664b2f91eb65ea91f16a63f91e83; start-tp4.sh ada373a3..., boot.py 7fccb3cb... (knapcio v2.4 tree).
