schema: jm-recipe/v1
id: dgx-spark-4x/deepseek-v4.1-flash-sglang-tp4-roce
title: DeepSeek-V4.1-Flash-1017 on 4x DGX Spark, SGLang dsv4.1 TP4 over 200G RoCE (knapcio v2.4 + RoCEnante), DSpark k=5, 1M context
summary: >-
  GhettoRak's SGLang lane (Lane B) for DeepSeek-V4.1-Flash-1017, native weights (MXFP4 experts, FP8 dense, 48/48 shards
  sha256 == Hub), served TP4 across Sparks 1-4 on one CRS804 with knapcio's v2.4 production stack (SGLang dsv4.1 branch
  f80c91a4b + rhys101's RoCEnante one-shot all-reduce + knapcio adapters, EP1, Engram from NVMe) and one documented
  override (indexer logits budget 1 GiB). 1,048,576-token context, 16 slots, KV pool 5.2-5.4M tokens. Round 2 (six
  one-change boots, 2026-10-19/20) found no lever: C1 96 tok/s per stream on the 8-class mix (coding 134, prose 74),
  C6 253 aggregate, 93K cold prefill 6.2K tok/s, 300K needles 4.0-4.7K after a slow first touch, and the lowest
  short-chat TTFT behind a long prefill (1.8 s). Sibling vLLM lane dgx-spark-4x/deepseek-v4.1-flash-vllm-tp4-sparknet
  wins decode and long prefill; this lane wins mixed traffic and stays closest to upstream SGLang.
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-10-20'
tags:
- deepseek-v4.1-flash
- mxfp4
- sglang
- dgx-spark
- gb10
