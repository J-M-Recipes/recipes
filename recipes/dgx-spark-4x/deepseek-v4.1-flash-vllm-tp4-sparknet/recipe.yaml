    health: { how: "scripts/gates.py on the promoted boot: /v1/models id, exact-word smoke LANE_C_OK, get_weather tool call + tool-result round, 0 preemptions - FUNCTIONAL_GATES PASS", last_pass_utc: "2026-11-17T02:31:51Z", run_id: 2026-11-16-r7-candidate60 }
