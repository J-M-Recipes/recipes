model:
  name: DeepSeek-V4.1-Flash-1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram (model card)
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  quantization: >-
    as shipped - routed experts MXFP4, attention / dense / Engram FP8; nothing re-quantized. 48 safetensors shards,
    510,296,708,312 bytes, identical size on all four nodes. spark5 copy hf-downloaded 2026-10-18; its 48 shard sha256
    equal the Hub LFS etags, and the same bytes rsync'd to spark1 passed sha256sum -c 48/48 on 2026-10-19
    (results/2026-10-19-vllm-ladder-r2/raw/weights/). Not re-hashed during the 2026-11-16 r7 boots; the mount is the same
    canonical path on every node.
  draft:
    repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017 (in-checkpoint DSpark/MTP draft)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
    method: DSpark (MTP), num_speculative_tokens 5, draft TP4, greedy draft sampling, block rejection sampling, adaptive verification row cost 0.035; c60 widens the CUDA-graph capture to 203 rows for copy drafts (boot log), which is what overlays/so-bitmask guards
hardware:
  profile: hardware/dgx-spark-4x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 4
  observed:
    gpu: NVIDIA GB10 x4 (spark5-8)
    driver: '580.178.04'
    cuda: '13.0'
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 123.2
    os: Ubuntu 24.04.5 LTS (DGX OS 7.2.3, OTA 7.6.0 per /etc/dgx-release)
    kernel: 7.0.0-1025-nvidia
    snapshot: results/2026-11-16-r7-candidate60/system.json
  required_settings:
  - Switch fabric, not Owen's ring - both CX-7 PCI domains' f0 ports on separate /24s (rocep1s0f0 10.0.0.N, roceP2p1s0f0 10.0.1.N), NCCL_IB_HCA both PFs, NCCL_IB_MERGE_NICS 0, NCCL_CROSS_NIC 0, GID index 3, sparknet transport oneshot-switched (renders SPARKNET_ROCE_TOPOLOGY=direct).
  - Kernel 7.0.0-1025-nvidia (all four nodes, 2026-11-16) with 4 KiB pages and no memory-saver (Owen's profile declares 7.0 / 64 KiB / memory-saver, but his own c60 tp4-switched receipts booted 7.0.0-1024-nvidia with 4096-byte pages and no memory saver); KV fixed at --kv-cache-memory-bytes 11274289152 per rank (10.5 GiB).
  - Before every boot on all four nodes - sync, drop_caches 3, compact_memory 1; the launcher refuses below 100 GiB MemAvailable (observed 119.2-119.4 GiB pre-boot). GPU clocks capped 2200 MHz (nvidia-smi -lgc 0,2200); clocks.gr under load 2190 on all four.
  - Rendering needs Owen's checkout at fcc97650 on the render host, plus this recipe's switched node map in its config/ and the arm files in its experiments/2026-11-16-c60-prefill/arms/ (scripts/c60cfg/).
runtime:
  engine: vLLM (fork)
  engine_version: 0.29.1rc1.dev187+gaf1c01499 as reported (base nightly's string, unchanged from r6x); serving tree = local-inference-lab/vllm karmic-kraken-beta @ afcaac3594acdea245d9543dbbea2376104470ba + spark-ds41f candidate-60 patch series (image label local.spark-ds41f.vllm.tree=afcaac35)
  engine_commit: afcaac3594acdea245d9543dbbea2376104470ba
  container:
    image: spark-ds41f:candidate-60 (local build on each node; not pullable)
    digest: sha256:2f2bf6e1091b500f2a62f170746134a4fdc57e68fc8893f7d8122e8fc5b3ddf2
    base_image: >-
      Built by spark-ds41f's docker/Dockerfile at fcc97650 from pinned sources; the image reports the same
      0.29.1rc1.dev187+gaf1c01499 string as r6x because the base nightly is unchanged. Image Id above is the local image
      Id, identical on spark5-8 on every 2026-11-16 r7 boot; a rebuild elsewhere will not reproduce it. Image labels:
      vllm.tree afcaac3594ac, nccl 6af10aa7, tilelang 741806c7, tile_kernels cb2fa41c, sparknet e06f6a06; no b12x label
      (loader removed in this build).
  key_libraries:
    sparknet: 0.5.0 @ 1fd6a1fb, tree e06f6a06, vendored in the c60 image - 0.5.0 plus the single-slot transfer cap (large prefill chunks stay on PyNCCL). Not on PyPI; do NOT mount the r6x 0.5.0 overlay (tag ed6af327) on this image, it predates that patch.
    nccl: v2.30.7-1 + spark-ds41f patches (image tree 6af10aa7)
    tilelang: 0.1.15 + patches (image tree 741806c7)
    tile_kernels: deepseek-ai/TileKernels 2.0.0 + patches (image tree cb2fa41c)
    b12x: removed from this build - --load-format is direct and the b12x env/plugin block is gone
  patches:
    - path: overlays/so-bitmask/vllm/v1/structured_output/__init__.py
      sha256: d286743334c81755c3ee3bc8d33eb3bf85760a9833085289154474ca6fbe165e
      purpose: "spark-ds41f#1194 guard (Zee-B33's three-line fix, applied verbatim): grammar_bitmask sizes its per-request bitmask from max(num_speculative_tokens, num_verification_tokens). c60 lets copy drafts verify up to num_verification_tokens rows (boot log: copy drafts widen the CUDA-graph capture range from 192 to 203 rows) while the bitmask was sized from k=5 alone. Replaces /opt/spark-ds41f/candidate/vllm/vllm/v1/structured_output/__init__.py. We did not reproduce the crash ourselves on r6x or stock c60; scripts/so_probe.py is the guard probe (64/64 in every arm, including the unfixed r6x control)."
    - path: overlays/dsml-c60/vllm/parser/deepseek_v41.py
      sha256: 8a8b293708eb15b763ed6fd4c6f52e85bff830e254f3029b69a194951d0c35c6
      purpose: "2026-11-16. Structural-DSML tool-parser overlay re-ported onto candidate 60 (credit: Hector Isaza's TensorFold patch 0052, MiaAI-Lab PR #49 / issue #14, reported by ecohash-co; our own code, not theirs). A DSML closer inside a tool-argument value is kept as text unless whitespace + a new parameter head or the end of the call's arguments follows; c60's token-provenance rule alone does not cover our checkpoint, whose quoted closer arrives as the genuine DSML token 128825. Replaces /opt/spark-ds41f/candidate/vllm/vllm/parser/deepseek_v41.py (stock sha256 844e4700). Kill switch VLLM_DSV41_STRUCTURAL_DSML=0 == stock. In-image gate: 25 cases, ALL GATES PASS (results/2026-11-16-r7-candidate60/image-gate-run.log)."
launch:
  script: scripts/launch-r7-c60.sh
  command: SPARK_HOSTS="spark5 spark6 spark7 spark8" bash scripts/launch-r7-c60.sh up
  health: BASE_URL=http://<head>:8002/v1 python3 scripts/gates.py <outdir>
  warmup: none; the bench's first request per category is measured. Warm boot (AOT/JIT caches under ~/spark-ds41f/cache populated by the first boot) reaches HTTP ready in 135 s on 2026-11-16; the first c60 boot on an empty cache took 1392 s (~23 min of JIT).
  notable_flags:
  - Per-node command is rendered by Owen's own bin/spark (--cluster-config <arm> render <node>) from a spark-ds41f checkout at fcc97650; scripts/launch-r7-c60.sh only names the container, adds --restart=no, adds the two overlay mounts and rewrites the cache path. Ranks 3,2,1 then 0; wait for /v1/models. STOCK=1 renders the same arm with no overlay mounts (arm A3b's shape).
  - --tensor-parallel-size 4 --nnodes 4 --distributed-executor-backend mp --load-format direct --block-size 256 --enable-prefix-caching --enable-prompt-tokens-details --enable-chunked-prefill --max-num-batched-tokens 8192 --long-prefill-token-threshold 3856 --prefix-cache-retention-interval 8192 --max-model-len 1048576 --max-num-seqs 32 --max-parallel-prefills 1 --gpu-memory-utilization 0.82 --kv-cache-memory-bytes 11274289152.
  - --prefill-yield short --prefill-yield-limit-s 10 --no-scheduler-reserve-full-isl --async-scheduling --jit-monitor-mode off --max-cudagraph-capture-size 192 (c60 widens the actual capture to 203 rows for copy drafts).
  - --attention-backend TILELANG --linear-backend tilelang --moe-backend tilelang; --compilation-config cudagraph_mode FULL_AND_PIECEWISE with capture sizes 1-192; --no-enable-flashinfer-autotune.
  - --engram-config table_memory disk, disk_resident_scales false, projection_tp true.
  - --speculative-config method dspark, num_speculative_tokens 5, draft_tensor_parallel_size 4, attention_backend TILELANG, draft_sample_method greedy, rejection_sample_method block, enable_adaptive_verification true, adaptive_verification_row_cost 0.035.
  - --default-chat-template-kwargs thinking false; --generation-config vllm with override temperature 1.0 top_p 1.0 (server default sampling; the bench forces T=0); --reasoning-parser and --tool-call-parser deepseek_v41 with auto tool choice; --limit-mm-per-prompt image 16; keyless on port 8002.
  - "Shape tp4-switch-4k (ours): 32 seats, 8192 batched tokens, threshold 3856, KV 10.5 GiB, our switched node map, NCCL_IB_MERGE_NICS 0, NCCL_CROSS_NIC 0, late admission at layer 20. Owen's tp4-switched runs 16 seats / 16384 / 16288 / layer 30."
  - Two read-only overlay mounts (overlays/so-bitmask, overlays/dsml-c60) over /opt/spark-ds41f/candidate/vllm/vllm/...; the r6x overlays (late-admission, sparknet-0.5.0, dsml-structural) must NOT be mounted on this image - see overlays/README.md.
