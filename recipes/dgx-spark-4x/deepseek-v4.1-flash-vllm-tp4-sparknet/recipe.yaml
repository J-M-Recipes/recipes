schema: jm-recipe/v1
id: dgx-spark-4x/deepseek-v4.1-flash-vllm-tp4-sparknet
title: DeepSeek-V4.1-Flash-1017 (native MXFP4/FP8) on 4x DGX Spark, vLLM fork (spark-ds41f candidate 60) TP4 over sparknet RoCE, 1M context
summary: >-
  Lane C of the split GhettoRak rack: DeepSeek-V4.1-Flash-1017 as shipped, served tensor-parallel 4 on Sparks 5-8 by
  Christopher Owen's spark-ds41f candidate 60 (Local Inference Lab vLLM karmic-kraken-beta fork + TileLang kernels +
  sparknet 0.5.0 one-shot RoCE collectives, vLLM tree afcaac35, local image 2f2bf6e1091b) on our switch / 4 KiB-page
  shape tp4-switch-4k, with prefill yield short, late admission at layer 20, 32 seats, KV 10.5 GiB/rank and two mounted
  overlays (so-bitmask for spark-ds41f#1194, dsml-c60 for structural DSML closers). 1,048,576-token context, 12.03M-token
  KV pool, DSpark k=5. Promoted 2026-11-16 against a same-night r6x control on the same four nodes: C1 123.18 tok/s per
  stream (+19.2%), C16 545.67 aggregate (+15.7%), cold prefill 8,554 / 8,726 / 8,554 / 7,849 tok/s at 32K/131K/300K/1M
  (+56 to +104%), short turn behind a cold 413K prefill 0.704 s (control 1.012 s), warm-cache turn 2.048 s, 1M needle 3/3,
  qeval 71/75 (same misses as control), greedy 40/40 identical on-boot, under load and across boots. Sibling SGLang lane
  on Sparks 1-4: dgx-spark-4x/deepseek-v4.1-flash-sglang-tp4-roce.
