limits:
- "Tuning found nothing. Round 2 (2026-10-20 01:14-02:12 UTC), one change per boot against a same-window control, keep bar +2% on any headline metric with no regression over 2%: C7ced (Owen's CED non-final-row skip overlay) +0.9% 93K, +1.6% 300K, +4.1% 131K single shot, outputs bit-identical - REVERT; Owen measured +10.6-11.1% on TP3, so the gain is shape-dependent. C8pp2 (--max-parallel-prefills 2) C4 -8.3%, C6 -10.8%, TTFT not improved - REVERT (C8pp2b not run). C9nvfp4 (NVFP4 draft head + Markov) C1 +1.7%, C6 -2.8% - REVERT. Round 1 (2026-10-19, nine arms, per the published post; receipts left on spark5, not mirrored) - NIC merge/cross-NIC, NCCL channels 4 to 8, NCCL buffers 4 to 16 MiB, KV 8.6 / 9.2 GiB, max-num-batched-tokens 16384, row cost 0.05 / 0.02 - all within about 2% or worse; a single-rail diagnostic cost 14% of 93K prefill."
- "Cold JIT: the first boot on an empty $DS41F_DIR/cache took 351 s and read 7.7% lower 93K prefill than the same config rebooted warm (Round 1). Benchmark warm boots only; the 89-101 s figure assumes a populated cache."
- "Mixed traffic, measured two ways. A guest turn over an already-cached 68K prefix (the shape the lane actually sees) is 2.147 s median on the adopted config, down from about 3.14 s. A short turn arriving behind a 413K COLD prefill is 1.196 s with late admission at layer 20 versus 1.885 s without, so the queue-jump works on this lane; the older ~3.0 s figure was measured behind a cold 93K prefill with parallel-prefills 1 and a 8096 chunk threshold, a different shape."
- "Seats, and why prefill reads lower than the 2026-10-20 publication: the lane now runs 32 seats with long-prefill-token-threshold 3856 (was 16 seats / 8096), because it serves guests rather than a single stream. That is what moves 93K cold prefill from 5,998 to 5,338 tok/s. It is a deliberate trade, not drift. Halving the threshold again to 1928 buys 4,668 tok/s (further -13%) and 1.50 s warm-cache turns; declined 2026-10-23 to keep cold-prefill throughput."
- "Late admission at layer 20 costs contested C8 TTFT. A single-wave C8 TTFT read 0.463 s against 0.359-0.364 s on three control boots. That is not dismissed as noise and it is not a proven regression either - only C1 paired results survive boot-to-boot comparison on this rig (an A/A C6 comparison excludes zero by -1.19%). C4 and above need the interleaved harness before anyone quotes them."
- "The overlays are unmounted copies of upstream work. If Owen lands late admission or sparknet 0.6.0 upstream, this recipe's overlays are behind by construction; SHA256SUMS plus overlays/README.md record exactly which commits they came from."
- "Sparknet 0.5.0 must be mounted on all four ranks. A partial rollout fails at collective setup rather than degrading, which is loud but worth knowing before a rolling restart."
- "1M context is configured and the KV pool holds 6.23 full-length sequences, but the deepest needle run is 300,000 tokens (3/3 PASS). One needle per length; retrieval, not long-context reasoning."
- "Not stock vLLM and not pullable - a local build of a fork of a pre-release vLLM nightly, ~2h16m per node. The image Id will not match anyone else's build; pin by the six tree labels and the deployment commit."
- "Our shape is unqualified upstream: Owen qualifies r6x on a switchless four-node ring, kernel 7.0, 64 KiB pages, memory-saver. tp4-switch-4k runs over a switch on 6.17 / 4 KiB pages with an 8 GiB KV budget per rank; Owen's topology checker refuses oneshot-direct on four nodes."
- "Hygiene: the R2 runner dropped caches and compacted memory before each boot but did not set THP to never; THP is madvise on spark5-8 (checked 2026-10-20). NV_ERR_NO_MEMORY counts in dmesg did not rise in any arm."
- "Cross-pod contention is not a factor at single-stream long-prefill load: C 93K 5,993 quiet vs 6,009 while the SGLang pod on Sparks 1-4 prefilled back-to-back (2026-10-20 05:00-05:07 CDT). Not tested - both pods under concurrent multi-stream load."
- "Quality is verified against the SERVING CONTROL, not against DeepSeek's original as a different engine would see it. The teacher-forced gate compares the adopted config to the 8 GiB control container on the same box: delta 0.0 everywhere. That proves the config change is lossless relative to what this lane already served. It does not prove the lane matches the model card, and no public benchmark has been run by us."
