limits:
- "CANDIDATE, NOT A RELEASE. candidate 60 is a patch series on the karmic-kraken-beta fork published 2026-11-16; Owen's qualified artifact is the 1107 release. Pin the vLLM tree label afcaac35 and the local image Id, and re-run the gates before adopting anything newer. It can move under this recipe."
- "LOCAL BUILD, NOT PULLABLE. The image is built on each node from a spark-ds41f checkout at fcc97650; no registry digest exists to fall back on. A rebuild elsewhere will not reproduce the image Id; the tree label is the identity."
- "BOOT COST. 1392 s (~23 min) on an empty JIT/AOT cache, 135 s warm. All published numbers are warm boots. A c61-overlay boot recompiles and read 211 s."
- "c61 NOT ADOPTED. The 2026-11-16 c61 decode overlay (6 mounted files) read C1 123.71 vs 122.72 (+0.81%) against its same-pool twin - inside the C1 spread of every boot in this campaign - and C16 528.50 vs 541.56 (-2.41%), mixed-short 0.848 vs 0.727, 131K prefill -0.68%. Its own README gates the effect on num_reqs == 1. Not worth six mounted files."
- "PREFILL YIELD IS THE ONE SCHEDULING CHANGE, AND IT COSTS NOTHING MEASURABLE HERE. With yield off (arm A2) the same engine read C1 123.18 and C16 551.22 but a short turn behind a cold 413K prefill 1.511 s (+49.3% vs control) and a warm-cache turn 2.343 s (+13.6%) - both outside the mixed-traffic gate. A2 was declined for that reason alone."
- "DSML LIVE PROBE PASSES ON STOCK c60 TOO. The live case is one quoted DSML closer, which c60's token-provenance rule already keeps; r7-a3b mounted no DSML overlay and read ALL_PASS. Our dsml-c60 overlay's value is the 6 synthetic genuine-atom cases the live probe does not build - the in-image 25-case gate is the evidence for it, not the probe."
- "so-bitmask IS INSURANCE. spark-ds41f#1194 was not reproduced here: scripts/so_probe.py read 64/64 on r6x (no copy drafts) and on every c60 arm, all of which carried the fix; stock c60 without it was never probed. The crashes in the issue are other people's rigs (mjcryptocloud, 4-node 4 KiB; hxfhd, TP3)."
- "NO TEACHER-FORCED GATE THIS ROUND, AND NO ACCEPTANCE MEASUREMENT. The r6x per-token baselines do not transfer to a different engine build, so non-inferiority needs a fresh reference boot. The historical r6x acceptance (0.7151 accepted/drafted, 3.334 tokens per verify step, 2026-10-23) was not re-measured; the C1 headline carries no acceptance_len."
- "qeval DOES NOT DISCRIMINATE. 71/75 on every lane and arm, same four misses (code_interval_intersect, json_count, json_escape, math_m9) - inherited from the model, not from this config."
- "1M IS CONFIGURED, ONE SEQUENCE IS TESTED. The 1M needle passes 3/3, but that is retrieval on one stream. The KV line implies 11.48 concurrent 1M sequences; nobody has run that, and 32 seats at 1M is 368,896 tokens each."
- "C16 IS A +-2% ROW ON THIS RIG and mixed_warm has a 1.5-3.0 s tail. Do not read 1% deltas out of either; only C1 is tight enough (+-0.2% within a boot) for that."
- "HARDWARE BLOCK IS A 2026-10-19 SNAPSHOT carried forward. results/2026-11-16-r7-candidate60/system.json is a placeholder for the r7 collection; no r7 receipt collected one."
- "THE SHAPE IS UNQUALIFIED UPSTREAM. tp4-switch-4k is ours: 32 seats, 8192 batched tokens, threshold 3856, KV 10.5 GiB, our node map, MERGE_NICS 0 / CROSS_NIC 0. Owen tests 16 seats / 16384 / 16288 / layer 30 on tp4-switched. Owen's profile also declares 7.0 kernel + 64 KiB pages + memory-saver while his own c60 receipts booted 4 KiB without it."
- "OVERLAYS ARE COPIES, SO THEY AGE. If #1194 is fixed upstream or the structural rule lands, these files are behind by construction; SHA256SUMS and overlays/README.md pin what they came from. The r6x overlays (late-admission, sparknet-0.5.0, dsml-structural) must not be mounted on a c60 image - their /opt/spark3/... targets do not exist there and Docker would silently create directories."
- "HYGIENE AS RUN: caches dropped and memory compacted before every boot; THP is madvise on Sparks 5-8, not never."
