model:
  name: DeepSeek-V4.1-Flash-1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram (model card)
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  quantization: >-
    as shipped - routed experts MXFP4, attention / dense / Engram FP8; nothing re-quantized. 48 safetensors shards,
    510,296,708,312 bytes, identical size on all four nodes. spark5 copy hf-downloaded 2026-10-18; its 48 shard sha256
    equal the Hub LFS etags, and the same bytes rsync'd to spark1 passed sha256sum -c 48/48 on 2026-10-19
    (results/2026-10-19-vllm-ladder-r2/raw/weights/). Sparks 6-8 size-verified, not re-hashed in place.
  draft:
    repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017 (in-checkpoint DSpark/MTP draft)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
    method: DSpark (MTP), num_speculative_tokens 5, draft TP4, greedy draft sampling, block rejection sampling, adaptive verification row cost 0.035 (r6x rule of the inputs, nothing timed at boot)
hardware:
  profile: hardware/dgx-spark-4x.yaml
  nominal:
    unified_memory_gb_per_node: 128
    nodes: 4
  observed:
    gpu: NVIDIA GB10 x4 (spark5-8)
    driver: '595.84'
    cuda: '13.2'
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.5 LTS (DGX OS 7.2.3, OTA 7.6.0 per /etc/dgx-release)
    kernel: 6.17.0-1031-nvidia
    snapshot: results/2026-10-19-vllm-ladder-r2/system.json
  required_settings:
  - Switch fabric, not Owen's ring - both CX-7 PCI domains' f0 ports on separate /24s (rocep1s0f0 10.0.0.N, roceP2p1s0f0 10.0.1.N), NCCL_IB_HCA both PFs, NCCL_IB_MERGE_NICS 0, NCCL_CROSS_NIC 0, GID index 3, sparknet transport oneshot-direct (SPARKNET_ROCE_TOPOLOGY=direct).
  - Kernel 6.17.0-1031 with 4 KiB pages and no memory-saver (Owen qualifies r6x on 7.0 / 64 KiB / memory-saver); KV fixed at --kv-cache-memory-bytes 11274289152 per rank (10.5 GiB; 8,580,566-token pool) - adopted 2026-10-22, same as Owen's ring shape.
  - Before every boot on all four nodes - sync, drop_caches 3, compact_memory 1; launcher refuses below 100 GiB MemAvailable (observed 114.8-117.6 GiB). GPU clocks capped 2200 MHz (nvidia-smi -lgc 0,2200); clocks.gr under load 2190 on all four.
runtime:
  engine: vLLM (fork)
  engine_version: 0.29.1rc1.dev187+gaf1c01499 as reported (base nightly's string); serving tree = local-inference-lab/vllm integration/karmic-kraken-beta @ 19f2c20ed4d6 + spark-ds41f r6x patch chain (tree label 4d6851c8)
  engine_commit: 19f2c20ed4d64ae22bd009ceacadd85e2a81e354
  container:
    image: vllm-ds41f-kkref:19f2c20ed4d6-r6x (local build on each node; not pullable)
    digest: sha256:c1c93733e852722507c1ba4a0601ff691f88064d3a56f79da5732c27aa2302cb
    base_image: >-
      docker.io/vllm/vllm-openai@sha256:3cf14c52765a0f0c2f09035e05fa79e1e4b2f9788b64afa90fa41c1ff12d29cf
      (nightly-af1c01499b28). Image Id above is the local image Id, identical on spark5-8; a rebuild elsewhere will not
      reproduce it. Deployment repo christopherowen/spark-ds41f @ fc3ee36d659ed882ed2a9458f1d5502882441c51 (Promote r6x
      for TP4, #407); Dockerfile = that repo's docker/Dockerfile at fc3ee36d, sha256
      b486011291428f3170c004eb65751415c364fe43641c91625ef142c55dcad3ac (clean tree on spark5; not vendored here). Six pinned trees match the config's expected_labels (results/.../image.txt). Build ~2h16m per node.
  key_libraries:
    sparknet: 0.3.0 @ 3bc8d10104a5012244a0424d7dfc1107a72eafab vendored in the image; the serving lane mounts 0.5.0 (tag ed6af327, 2026-10-22) over /usr/local/lib/python3.12/dist-packages/sparknet from overlays/sparknet-0.5.0/. Not on PyPI - never pip-installable.
    nccl: v2.30.7-1 @ 73cf1122 + spark-ds41f patches (tree 6af10aa7)
    tilelang: 0.1.15 @ b95ee4ff + patches (tree 222b895d)
    tile_kernels: deepseek-ai/TileKernels 2.0.0 @ 66258df6 + patches (tree cb2fa41c)
    b12x: local-inference-lab/b12x karmic-kraken-beta @ 236ddff0 + patches (tree 1a647a31; b12x loader)
launch:
  script: scripts/cluster.sh
  command: SPARK_HOSTS="spark5 spark6 spark7 spark8" bash scripts/cluster.sh push && SPARK_HOSTS="spark5 spark6 spark7 spark8" bash scripts/cluster.sh up
  health: BASE_URL=http://<head>:8002/v1 python3 scripts/gates.py <outdir>
  warmup: none; the bench's first request per category is measured. Warm boot (AOT/JIT caches under $DS41F_DIR/cache populated by the first boot) reaches HTTP ready in 89-101 s.
  notable_flags:
  - Per-node launcher scripts/launch-vllm-tp4.sh <rank>, generated from the live head command by scripts/render_launcher.py; ranks 3,2,1 then 0; workers add --headless. Reproduces the live spark6 args exactly.
  - --tensor-parallel-size 4 --nnodes 4 --distributed-executor-backend mp --load-format b12x --block-size 256 --enable-prefix-caching --enable-chunked-prefill --max-num-batched-tokens 8192 --long-prefill-token-threshold 3856 --prefix-cache-retention-interval 8192 --max-model-len 1048576 --max-num-seqs 32 --max-parallel-prefills 1 --gpu-memory-utilization 0.82 --kv-cache-memory-bytes 11274289152 (8,580,566 tokens).
  - Two read-only overlay mounts from overlays/ - four late-admission files over $VLLM_TREE/vllm/ and sparknet 0.5.0 over the vendored package, plus --env VLLM_LATE_ADMISSION_LAYER=20. Leaving that variable unset is off; the model has 40 decoder layers and any value >= 40 fails at boot.
  - --attention-backend TILELANG --linear-backend tilelang --moe-backend tilelang, VLLM_DS41_KERNEL_BACKEND=tilelang; --compilation-config cudagraph_mode FULL_AND_PIECEWISE with capture sizes 1-192; --async-scheduling; --no-enable-flashinfer-autotune; B12X_AUTOTUNE=0.
  - --engram-config table_memory disk, disk_resident_scales false, projection_tp true.
  - --speculative-config method dspark, num_speculative_tokens 5, draft_tensor_parallel_size 4, draft_sample_method greedy, rejection_sample_method block, enable_adaptive_verification true, adaptive_verification_row_cost 0.035.
  - --default-chat-template-kwargs thinking false; --generation-config vllm with override temperature 1.0 top_p 1.0 (server default sampling; the bench forces T=0); --reasoning-parser and --tool-call-parser deepseek_v41 with auto tool choice; keyless on port 8002.
  - Shape tp4-switch-4k (git-ignored local shape in spark-ds41f config/cluster.laneC.local.json, published in results/.../raw/ds41f-local-config/) - sparknet oneshot-ring4 to oneshot-direct, NCCL_IB_HCA both f0 PFs, MERGE_NICS 0, CROSS_NIC 0, socket ifname enp1s0f0np0, KV 8 GiB; 4 channels and 4 MiB NCCL buffers inherited from Owen's tp4-ring; NCCL_SWITCHLESS_BIDIRECTIONAL removed (laneC-c0). Owen's topology checker refuses oneshot-direct on four nodes, so the rendered docker run is launched directly.
