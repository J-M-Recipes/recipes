schema: jm-recipe/v1
id: dgx-spark-4x/deepseek-v4.1-flash-vllm-tp4-sparknet
title: DeepSeek-V4.1-Flash-1017 (native MXFP4/FP8) on 4x DGX Spark, vLLM fork (spark-ds41f r6x) TP4 over sparknet RoCE, 1M context
summary: >-
  Lane C of the split GhettoRak rack: DeepSeek-V4.1-Flash-1017 as shipped, served tensor-parallel 4 on Sparks 5-8 by
  Christopher Owen's spark-ds41f r6x build (Local Inference Lab vLLM karmic-kraken-beta fork + TileLang kernels + sparknet
  one-shot RoCE collectives, local image c1c93733e852) on our switch / 4 KiB-page shape tp4-switch-4k. 1,048,576-token
  context, 6.54M-token KV pool, DSpark k=5. C1 104.3 tok/s per stream on the 8-category v1 mix, C6 289 tok/s aggregate,
  6.0K tok/s cold prefill at 93K, 300K needles at 5.5K tok/s, warm boot ~90 s. A nine-arm one-change-per-boot ladder found
  nothing that cleared +2%; this is Owen's config as shipped plus our shape. Sibling SGLang lane on Sparks 1-4:
  dgx-spark-4x/deepseek-v4.1-flash-sglang-tp4-roce.
  Adopted 2026-10-23: KV 10.5 GiB/rank (8.58M-token pool, +31%), 32 seats, late admission at layer 20 (Owen's 0222
  overlay, mounted) and sparknet 0.5.0 (mounted over the image's 0.3.0). C1 105.21 tok/s per stream / 93.89 aggregate,
  C4 233.16, C6 291.75, warm-cache turn 2.147 s (from 3.14 s), 93K cold prefill 5,338. Teacher-forced quality gate PASS
  (5,485 positions, |dlogp| = 0.0).
