    digest:      { how: "local image ID matches the digest above after a rebuild from Dockerfile.tf5.16.1 (sha256 8cee99bd...); pip freeze identical to the tested build; base pulled by digest. Model dir is the pinned revision, 204,475,659,764 bytes / 42 files byte-verified against the Hub listing (2026-09-21)", last_pass_utc: "2026-09-24", run_id: 2026-09-24-tf5161-vision }
    health:      { how: "/health 200 after boot; vision_gate.py PASS (361 image tokens, reads HELLO); all shapes warmed", last_pass_utc: "2026-09-24T22:39:10Z", run_id: 2026-09-24-tf5161-vision }
