    workload: C1, history essay, 512 output tokens, answer-only (reasoning_effort low), DFlash2 block 7, 1M ctx, nightly 8874c51a
    aggregation: median of 3 (spread 0.6%)
    provenance: { run_id: 2026-09-15-effort-drafter-nightly, method: scripts/c1_methods.py EFFORT=low, raw: throughput.csv }
  - name: single-stream decode (recipe method), max-effort thinking counted
