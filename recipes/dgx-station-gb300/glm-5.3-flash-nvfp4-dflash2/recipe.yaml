    workload: C1, history essay, 512 output tokens, answer-only (reasoning_effort low), DFlash2 block 7, 1M ctx, lmsysorg/sglang:v0.5.20-cu130; same window pinned-nightly control 193.3
    aggregation: median of 3
    provenance: { run_id: 2026-09-21-v0520-rebase, method: scripts/c1_methods.py EFFORT=low, raw: receipts/newdf/c1-low.txt }
