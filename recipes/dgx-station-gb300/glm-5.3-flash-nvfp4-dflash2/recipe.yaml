schema: jm-recipe/v1
id: dgx-station-gb300/glm-5.3-flash-nvfp4-dflash2
title: GLM-5.3-Flash NVFP4 + DFlash2 speculative decoding on one DGX Station GB300
summary: >
  GLM-5.3-Flash (320B MoE, 18B active) in NVIDIA's first-party NVFP4 served by released-track SGLang with the
  DFlash2 block-diffusion draft (block 7), 1M context. Interactive: ~202 tok/s single-stream answer-only (~265 with max-effort thinking counted), ~730 agg at C8.
  Same weights in plain autoregressive mode serve 48 users at 50 tok/s each and 128 users at 34 tok/s each
  (4,025 agg) on one GPU. Quality gate is teacher-forced logprob divergence vs the FP8 original, not eyeballing.
status: verified
owners: [jmeadlock, milo]
updated: "2026-09-21"
tags: [glm-5.3-flash, nvfp4, sglang, dflash2, speculative-decoding, single-gpu, interactive, high-concurrency, 1m-context]

model:
  name: GLM-5.3-Flash
  params: 320B total / 18B active (MoE, 288 experts, 8 active; hybrid KDA + DSA + MLA attention)
  repo: https://huggingface.co/nvidia/GLM-5.3-Flash-NVFP4
  revision: 09b04e5e74bca08ca8549fc736d4cdd8624bfde3
  quantization: "NVFP4 (NVIDIA ModelOpt, first-party; 204,475,659,764 bytes). Routed experts FP4; attention, shared experts, router, embeddings, lm_head unquantized (132 excluded modules). mean |dlogp| 0.136 vs zai-org/GLM-5.3-Flash FP8 on 5,120 teacher-forced tokens; argmax differs 15.6%. LibertAIDAI/GLM-5.3-Flash-NVFP4 (previous revision of this recipe): 0.147 / 15.9%. nvidia closer on 27/40 prompts, bootstrap 95% CI on the gap [0.004, 0.017]. Most divergence is shared NVFP4 bias: both quants pick the same non-FP8 token 10.3% of the time. Previous revision of this recipe used LibertAIDAI/GLM-5.3-Flash-NVFP4 @ aa28e1f54130286c95fee10d0705c74ce8743734 (run 2026-09-01); speed identical within noise (235.5 vs 238.1 C1); kept as control."
  draft:
    repo: https://huggingface.co/incoai/GLM-5.3-Flash-DFlash2
    revision: 7d74cdd881ed7e32c31175984a67823127b66cfe
    method: DFlash2 block diffusion draft; served with --speculative-dflash-block-size 7 (block 8 minus the target token)

hardware:
  profile: hardware/dgx-station-gb300.yaml
  nominal: { gpu_memory_gb: 288, host_memory_gb: 496 }
  observed:
    gpu: NVIDIA GB300
    driver: "595.84"
    cuda: "13.2"
    gpu_memory_visible_gib: 250.7
    host_memory_gib: 494.5
    os: Ubuntu 24.04.4 LTS
    kernel: 6.17.0-1031-nvidia-64k
    snapshot: results/2026-09-01-flash-dflash2/system.json
  required_settings:
    - "Do NOT set CUDA_VISIBLE_DEVICES: DGX OS's docker config already hides the display GPU; setting it makes the container see 0 GPUs"

runtime:
  engine: SGLang
  engine_version: "0.5.20 (tagged release 2026-09-18; first release listing GLM-5.3-Flash supported — #36507, #38621; carries #37818 DFlash/KDA checkpoint fix. Prior pin: main nightly 0.0.0.dev1+g00143e9c2, 2026-09-11)"
  engine_commit: 94602c9c
  container:
    image: lmsysorg/sglang:v0.5.20-cu130
    digest: sha256:06e4f2ed21afde4ff513cda65070124e727ba23ccaeff7712b8c40e1097d611f
    base_image: "tagged release image, no source build (rebased 2026-09-21 from nightly-dev-cu13-20260911-00143e9c @ sha256:f159f796afdd2bcfa924f4fa09564c82c7d54fc24b1ecae2e308213b8592cb0b, results/2026-09-21-v0520-rebase). The nightly replaced the frozen glm53-nvfp4-sglang:gb300-v2 @ sha256:f710fd42cf749cbc6c3e1799244b5bdefd3b8f34d978aa810a9c1f97f86b143a (scripts/build-image.sh) from run 2026-09-01; nightly reproduces its numbers (g0 vs g1 in throughput.csv)"
  key_libraries:
    torch: 2.13.0+cu130
    transformers: 5.12.1
    triton: 3.7.1

launch:
  script: scripts/launch-glmf.sh
  command: "TAG=daily IMAGE=lmsysorg/sglang:v0.5.20-cu130 MODEL=/path/to/GLM-5.3-Flash-NVFP4 DRAFT=/path/to/GLM-5.3-Flash-DFlash2 SPEC=dflash KV=fp8_e4m3 MEM=0.85 CTX=1048576 MAXBS=16 EXTRA='--max-mamba-cache-size 48 --speculative-dflash-block-size 7' bash scripts/launch-glmf.sh"
  health: "curl -fs http://localhost:30001/health; then warm every batch shape you will serve (python3 -c 'import flash_bench as fb; fb.knee(reps=0)' from scripts/). First hit of each new batch shape after boot is kernel autotune, not serving."
  warmup: "python3 -c 'import flash_bench as fb; fb.knee(reps=0)' from scripts/ — warms C1..C32 once each; exact launch line in results/2026-09-11-nvidia-nvfp4-b7-1M/launch-command.txt"
  notable_flags:
    - "VARIANT interactive_daily: as above: DFlash2 block 7, 48 mamba slots (9 running), 1M ctx, 576K-token KV pool. C1 ~202 answer-only, C8 ~730."
    - "VARIANT interactive_more_kv: drop --max-mamba-cache-size (default 38 slots, 7 running): 682K KV pool, C8 drops to ~490."
    - "VARIANT batch_48_users: SPEC=none KV=fp8_e4m3 MEM=0.90 CTX=131072 MAXBS=128 EXTRA='--max-mamba-cache-size 640 --mamba-ssm-dtype bfloat16 --linear-attn-decode-backend triton' : 128 running, 201K KV pool, C48 2,214 agg / 50 per user, C128 4,025 / 34. bf16 SSM state is an accuracy-affecting change per SGLang docs; not KL-gated here."
    - "VARIANT batch_fp32_state: SPEC=none MEM=0.90 MAXBS=128 EXTRA='--mamba-full-memory-ratio 3.0' : 254 slots / 50 running, 1.79M KV pool, C32 1,648 / 55 per user, C48 1,681 / 48."
    - "ENV TORCHINDUCTOR_COMPILE_THREADS=1 — without it AR-mode CUDA graph capture dies with inductor 'Could not find an active GPU backend'"
    - "--quantization modelopt_fp4"
    - "--speculative-algorithm DFLASH --speculative-draft-model-path /draft --speculative-draft-attention-backend fa4 --speculative-dflash-block-size 7"
    - "--tool-call-parser glm47 --reasoning-parser glm45  (REQUIRED for any agent/tool use)"
    - "--cuda-graph-max-bs-decode N  (renamed from --cuda-graph-max-bs on the frozen image)"
    - "--max-mamba-cache-size N : the concurrency knob. SGLang reserves 5 KDA state slots per running request under the default extra_buffer radix strategy; max_running_requests = slots/5. Each fp32 slot costs ~0.14 GB state + ~0.03 GB per draft token of intermediate state, all taken from the KV pool."
    - "--kv-cache-dtype fp8_e4m3 : only the DSA indexer pool is fp8 on this model; the MLA KV stays bf16 (sgl-project/sglang#36830, index_kpool=4). Do not describe this recipe as FP8 KV."

