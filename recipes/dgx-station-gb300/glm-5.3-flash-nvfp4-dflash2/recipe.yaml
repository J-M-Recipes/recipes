verification:
  gates:
    schema:      { how: "scripts/check_recipe.py passes", last_pass_utc: "2026-09-11T17:30:00Z", run_id: 2026-09-11-nvidia-nvfp4-b7-1M }
    digest:      { how: "docker image inspect reports the digest above; model dir is the pinned revision, 204,475,659,764 bytes / 42 files byte-verified against the Hub listing (re-inspected on the v0.5.20 rebase, 2026-09-21)", last_pass_utc: "2026-09-21", run_id: 2026-09-21-v0520-rebase }
    health:      { how: "/health 200 after boot; all shapes warmed", last_pass_utc: "2026-09-11T16:47:00Z", run_id: 2026-09-11-nvidia-nvfp4-b7-1M }
    quality:     { how: "teacher-forced |dlogp| vs zai-org FP8 original on 40 prompts x 128 greedy tokens: nvidia 0.136 (argmax differs 15.6%) vs LibertAI 0.147 (15.9%); instrument self-consistency 0.00000. Rebase window 2026-09-21: TF bit-identical across four boots (max delta 0.0 over 2,857 tokens), greedy 20/20 vs the DFlash reference, tools 10/10 x4 + Hermes 10/10. Plus 10/10 parsed tool calls (scripts/tool_harness.py) and a real Hermes agent harness 10/10 tool turns. CORRECTED 2026-09-21: DFlash2 is target-verified, not byte-identical to AR.", last_pass_utc: "2026-09-21", run_id: 2026-09-21-v0520-rebase, notes: "replaces the output-judged gate of run 2026-09-01" }
    performance: { how: "C1 recipe-method (EFFORT=low) median-of-3 within 3% of 202.7 after warmup; C48 AR within 5% of 2,214", last_pass_utc: "2026-09-16T02:06:00Z", run_id: 2026-09-15-effort-drafter-nightly }

limits:
  - "CORRECTION to run 2026-09-01: 'DFlash2 loses to AR at C16+' was wrong. The cause was SGLang's default KDA state budget capping max_running_requests at 7; verification cost was not the issue. With slots raised, DFlash2 beats AR per running request through at least C24 (1,482 vs ~1,350 agg). What DFlash2 actually loses is memory: each slot carries 7 draft-token intermediate states in fp32 (bf16 SSM crashes the DFlash2 verify kernel on this image), so 120 slots cost 41 GB and leave a 134K KV pool. AR with bf16 state fits 640 slots in 43 GB. Pick DFlash2 for <=24 users, AR for more."
  - "NVFP4 costs ~16% token-level disagreement with the FP8 original regardless of who quantized it. nvidia's mixed-precision recipe is measurably closer than LibertAI's, by ~0.3 pp argmax agreement. If token fidelity matters more than speed, serve the FP8 original with offload; that is a different recipe."
  - "Concurrency is capped by KDA state slots, not compute: 5 slots per running request under the default radix strategy. Raise --max-mamba-cache-size (or --mamba-full-memory-ratio); the bytes come out of the KV pool one-for-one. --mamba-radix-cache-strategy no_buffer (3 slots/req) requires page_size 1 and is incompatible with this model's DSA page size."
  - "First hit of every batch shape after a restart is kernel autotune (13 s TTFT at C16 observed). Warm every shape you will serve; the first pass at a new shape is not a measurement."
  - "Do not enable HiCache on this model for agent traffic: host-tier load-back corrupts generation and drops tool calls (sgl-project/sglang#38031)."
  - "The MLA KV cache is bf16 even with --kv-cache-dtype fp8_e4m3 (sgl-project/sglang#36830). Only the DSA indexer pool is fp8."
  - "Native MTP drafter is in the checkpoint but SGLang's GLM-5.3 NextN path is broken (#37548, #36829). SGLang's cookbook MTP numbers for this model are measured with SGLANG_SIMULATE_ACC_LEN=3."
  - "Draft acceptance is 0.17 on prose and 0.62 on math (answer-only); a prose-heavy workload sees ~150 tok/s C1, not 202. Report the prompt AND reasoning_effort with every C1 number — enable_thinking is not a template variable for this model."
  - "REBASED 2026-09-21 to v0.5.20-cu130 (results/2026-09-21-v0520-rebase): four boots one window, pinned nightly vs v0.5.20, AR and DFlash2 each. Teacher-forced logprobs on the w2-a text are bit-identical across all four servers (max delta 0.0 over 2,857 tokens); greedy 20x200 vs the DFlash reference 20/20 on both DFlash boots; tools 10/10 x4; C1 history/code/shell 193/276/155 -> 202/288/162 tok/s (+4-5%); C8 ~700 both. The #37818 KDA-checkpoint bug is NOT demonstrable with 8x2500-token greedy runs: DFlash-vs-AR diverges within the first 30-360 characters on BOTH images at identical offsets (verify-path argmax tie-breaking, not a checkpoint miss), and old-vs-new DFlash diverges only where old-vs-new AR also does (~1,500-2,500 tokens in, image numerics). Fix adopted on trust of the upstream regression test plus no-regression here."
  - "CORRECTED 2026-09-21: DFlash2 is target-verified but NOT byte-identical to autoregressive decoding on this model. Same image, same weights, T=0: DFlash vs AR agree 1/20 on 200-token prompts and 0/8 on 2,500-token prompts, first divergence typically inside the first 100 tokens, while teacher-forced logprobs of either text are identical (delta 0.0). The earlier greedy gate compared DFlash boots against a DFlash reference (w2-a), which is why it read 20/20. Claim to make: every emitted token is accepted by the full model; claim NOT to make: byte-identical to AR."
  - "UPSTREAM 2026-09-20 (research/upstream-watch-2026-09-20.md): the pinned image nightly-dev-cu13-20260911-00143e9c predates sgl-project/sglang#37818 (merged 2026-09-12, fixes #37817): DFlash could miss a KDA/Mamba linear-attention state checkpoint when accepted verify tokens cross a tracking boundary, leaving full-attention KV and linear state at different positions. That is this exact configuration (GLM-5.3-Flash KDA layers + DFlash2). It would present as divergence on long generations only; the teacher-forced gate here was run on the pinned image with short references and would not see it. Fix ships in the tagged release v0.5.20 (2026-09-18, v0.5.20-cu130 digest sha256:b27fce60bc5494c118c4910702812bcfa8cee67abcdd1ff8b0902f21647552f4; 220 commits after the pin). Rebase is a scheduled-window item with the TF gate re-run on >=2K-token generations. The DFlash2 draft repo also moved twice after the pinned 7d74cdd8 ('Checkpoint update' dc77ff1c 2026-08-28, bf582e4e 2026-08-31): a newer draft is a separate acceptance axis with its own gate, not a drop-in. TESTED 2026-09-21 PM (results/2026-09-21-v0520-rebase/receipts/bf58df): bf582e4e on the same v0.5.20 + DFlash2 b7 launch - greedy 20/20 identical to the 7d74cdd8 draft, accept len 3.42 / rate 0.40 vs 3.37 / 0.39, C1 246 vs 248, C8 692 vs 699, tools 10/10 x2, TF repeat-identical. No change; pin stays on 7d74cdd8."

rollback:
  script: scripts/swap-model.sh
  summary: "docker rm -f glm53-flash and relaunch the previous checkpoint dir with the same image and flags; ~5 min wall including warmup."

