    items:
      "mixed C1 aggregate": "194.1 here · 208.9 sidecar (held-out prompts)"
      "mixed C4 aggregate": "431.0 here · 560.4 sidecar"
      "pick this when": "you have only the GB300, or traffic shifts in ways no fixed map covers"

