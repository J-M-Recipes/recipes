title: "DeepSeek-V4.1-Flash · 1× DGX Station GB300 · adaptive expert residency"
subtitle: "The v23 recipe, but the 295 HBM experts per layer follow live traffic: one relaxed atomic per routed token in a kernel that already runs, swaps between steps. Off-domain decode doubles; nothing else changes."
version: "v26ar.1 = v23 launch + hook v26ar.1 (counter + guarded swaps) · measured 2026-10-23 on two boots · NOT promoted"
status: experimental
run_id: 2026-10-23-ar-adaptive-residency (AR0–AR3)
handles: "github.com/J-M-Recipes/recipes · al-engr.com/gb300-adaptive-expert-residency.html · planner idea: vLLM #56177 (01554)"

model:
  type: MoE
  type_detail: "384 routed experts + Engram; 295 hot per layer in HBM, re-chosen live; 89 cold in Grace over C2C"
  total_params: 552B
  active_params: "8B prefill / 16B decode"
  checkpoint_gb: 510.3
  weights_short: "as shipped · MXFP4 experts / FP8 attn+Engram · nothing re-quantized"
  engine_extra: "day-0 image deepseekv41-flash-0909 · v23 launch flags unchanged · hook v26ar.1 (_skc counting split + e4_adaptive drain/swap)"
  memory: "206.6 GiB hot experts in HBM + 62.3 GiB cold in pinned Grace · + one 17.9 MiB staging row + 61 KB counters · KV 2,495,694 tok (unchanged)"

hero:
  c1:      { value: 194.1, unit: tok/s, class: "mixed JP/DE + agent", label: "Decode · C1 aggregate, mixed traffic", note: "frozen v23 map 133.1 → 194.1 (+46%) · JP/DE essays 90.0 → 189.4 / 189.8 (+111%, two boots) · agent English 195.7 → 218.5 / 219.3 (+12%) · cold share of expert picks 17–28% → < 1%" }
  c16:     { value: 431.0, unit: tok/s, label: "Decode · C4 aggregate, mixed traffic", note: "frozen map 236.6 → 431.0 (+82%) · agent requests 66 → 122 tok/s each (cold reads stop stalling the whole batch) · C8/C16 not measured on this variant" }
  prefill: { value: 0.46, unit: s, label: "TTFT · 7.8K-token unique prompt", note: "0.47 / 0.46 s · 31.3K prompt 1.38–1.50 s (21–23K tok/s) · prefill is not counted and not changed by the hook" }

