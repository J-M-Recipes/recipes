limits:
  - "Many-seat latency on this lane was a SCHEDULER problem, not prefill (2026-09-18). At --max-num-seqs 16 the 35-seat fund harness read warm agent-turn p95 8.5 s at C16 and p50 27 s at C24 while KV usage peaked at 16%; idle cold prefill is 22-23K tok/s from 26K to 207K tokens on v15/v17/v18 alike. Fix = --max-num-seqs 24 (v17/v18). The V1 scheduler in this build serves running requests FCFS with --long-prefill-token-threshold as a per-request per-step chunk cap; lowering it to 2048 (v16) let more prefills share a step but cost idle prefill -47% and C16 prose p10 -29% — do not. max_num_partial_prefills / max_long_partial_prefills do not exist in this build."
  - "--cudagraph-capture-sizes takes TOKEN counts. With DSpark k=1 at >=5 seqs a decode step is 2x seqs tokens; v17b's list 1 2 4 8 12 16 24 left every batch above 12 seqs uncaptured (C16 prose 9.6 tok/s per stream vs 21.8 captured) while looking healthy on TTFT. Default graphs for 24 seqs cost 2.33+1.78 GiB (KV 1.79M, v17); the v18 list 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128 costs 1.30+1.10 GiB (KV 2.50M) with knee within noise of default. Cost of the 24-slot profiles vs v15 (16 slots): knee C8 -6% (698 -> 655, two same-afternoon controls; unexplained, new autotune hash suspected), C16 flat, C1 +12%. Per-seat prose p10 at 16 streams is ~16 tok/s on every profile: a long-context and tool lane, not a 16-seat decode lane."
  - "Decode is C2C-bandwidth + kernel bound, not HBM bound. CORRECTED 2026-09-12: the v11 claim that offload 60 does not fit at 1M was measured at util 0.94; at util 0.97 it fits (KV 4.89 GiB) and gives +12% C1 in a same-window comparison. Measured fetch tax: k=0 step 11.1 ms vs 7.1 ms all-HBM (catid 2×Station PP2, rev dba1be0a) ≈ 4 ms ≈ 36% of the step. Slope ≈ 0.76 tok/s per GiB of experts moved Grace→HBM."
  - "Trade in v12: KV pool is 4.89 GiB = 2.33M tokens = 2.2 concurrent full-1M requests (v11: 4.5). For an agent lane that is fine; if you need >2 concurrent 1M contexts, run v11 flags (OFFGB=70 UTIL=0.94) and accept 82 tok/s."
  - "Expert selection is highly skewed (decode top-73% of experts take 98.7% of selections) but DOMAIN-specific (agent vs prose expert ranks correlate at 0.15). A usage-chosen cold set for the offloaded 24% of experts would take ~2.7% of traffic instead of 24% — but only for the workload it was profiled on. CORRECTED 2026-09-17: usage-aware placement is now v15 (static rowmap-static-v1 from 34.4M decode selections; own-cold 1.55% on the profiled mix). Still domain-specific. CORRECTED 2026-09-17: held-out math +41%; held-out JP/DE −1.5% (wash). Positional offload remains the workload-neutral fallback (v14)."
  - "The 82 tok/s number is prose. Agent text (shell, code, tool JSON) runs 130-150 tok/s because DSpark accepts 64-91% there vs 30% on prose. Quote the number for YOUR workload; do not quote 150 as 'the' speed."
  - "Every new engine-config hash starts an empty FlashInfer autotune dir → 74-min MoE retune. Seed autotune_configs.json into the new hash dir BEFORE the tuner reads it (~60 s after 'Graph capturing finished') or pass a kernel-config that disables autotune. v12 hash: 9ac7b387 (v11: 08c89d94). Seeding a different-shape config does not skip the tune; only an exact hash hit does."
  - "Hermes/OpenAI clients: the V4.1 chat template rejects reasoning_effort=medium (HTTP 400). Use low|high|xhigh|max or an int 1-100."
  - "replay.py (real-transcript replay) has ±17 tok/s run-to-run spread at temperature 0 (batched MoE + speculative decode are not bit-deterministic). It is a smoke test. Decide on knee.sh."
  - "Tested and NOT adopted (2026-09-11 overnight): THP enabled=always, pinned and unpinned (AnonHugePages stayed 2.5 GB both times — the 354 GB of weights sit in Shmem, and shmem_enabled=never was not changed), VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY=1 (-66 GB host RAM but knee C1 -7%), --language-model-only (+1.1 GiB KV, not enough for offload 65), VLLM_USE_RUST_FRONTEND=1 (no decode gain, 8k TTFT 0.37→0.52 s). See research/failure-ledger.md."
  - "~110 GB of host shmem beyond the accounted pinned buffers is unexplained. Host sits at ~450/494 GB under load; there is no room for a second large model."
  - "SGLang day-0 on this hardware bound at 3.3 tok/s (whole-layer expert copies). This recipe is vLLM-specific."
  - "Residency axis CLOSED (2026-09-12, three spikes in results/…/spikes): GPU reads Grace either via ATS (cudaHostAlloc/cudaHostRegister, ~340 GB/s, no placement control — what the UVA offloader already uses) or via its own page table (cuMemCreate HOST_NUMA, managed PreferredLocation=CPU: ~90 GB/s). Managed memory migrates whole ranges on fault and settles at 155 GB/s once oversubscribed. CORRECTED 2026-09-17: a single-pointer / single-VA split cannot beat off60 (O1-b dead at ~91 GB/s). The two-tensor split-invoke route (v15 F4 hook) is in this recipe and is not capped at +20% single-stream: same-window C1 +71%, C16 ~2x. The 2026-09-12 close still holds for a single-VA placement knob."
  - "Placement adaptation CLOSED 2026-09-17 (pin-hot-experts E4/E4b/E5). ON-LINE: the hot/cold row-swap path is bit-exact (dry run, 5 ordered swaps 100% identical; mis-ordered flip diverges) but every in-graph router counter costs more than the 1% C1 bar: scatter_add count −3.7%, index_copy_ ring −9.6%, fixed-slice snapshot −1.68% (C8 −1.26%, C16 −0.94%); topk_indices_buffer is Indexer scratch, not MoE ids. Needs an engine-side near-free topk_ids read (vllm-project/vllm#38256). OFF-LINE: re-profiling on mixed traffic (50% agent / 21% EN prose+math / 29% JP+DE+FR+ES; 53,971 tok; 24.5/89 cold ids changed per layer; own-cold 2.1% vs v1 11.7% on that mix) and hash-hit rebooting the same 295/89 geometry gave held-out JP/DE 88.9→145.6 (+64%) and math +10% but knee C1 153.1→137.8 (−10%), C8 −16%, C16 −17%, tool_json −7%; parity 18/18, accept identical. The 89-slot budget is zero-sum across domains: build one map per traffic class from that lane's real traffic and swap by reboot; do not blend. v15 (agent map) remains the reference; E5 kept as -C1-10PCT-FAIL. Receipts: results/2026-09-17-e4-e4b-e5-placement-adaptation/ (e4/, e4b/, e5/, hook/)."
  - "Speculation depth CLOSED at k=5 (2026-09-12, results/…/ksweep): k=1 110.8/312.6/422.2 vs k=5 90.1/244.9/316.9 on prose knees, but agent classes -30% at k=1. enable_adaptive_verification (VLLM_USE_V2_MODEL_RUNNER=1) boots only at --cpu-offload-gb 66 because model_runner forces FULL_AND_PIECEWISE capture (7.07 GiB vs ~1.1 on V1) and overrides a user cudagraph_mode silently; at off66 it measures 101.8 C1 / prose 104.1 / shell 145.3 — between the static points, below both. Upstream: vllm-project/vllm#56626. Do not spend boots on this until that lands."
  - "Every new verify shape (k, runner, adaptive, graph mode) is a new FlashInfer autotune hash = 74-min boot. Only offload GiB and gpu-memory-utilization keep the hash. The v13 schedule [[1,2,5],[3,16,1]] happens to share v12's hash 9ac7b387, and so do [[1,2,5],[3,4,3],[5,16,1]] and the v14 schedule [[1,4,5],[5,16,1]]; [[1,3,5],[4,16,1]] does NOT (new hash cbf5ea8f, 189 configs). The key's dependence on the breakpoints is not simply 'includes them' — we have not read the key derivation; test each new schedule with a bind-time watch before assuming either way. Budget ~85 min per experimental boot on this lane."
  - "CORRECTED 2026-09-15: the former exact offload-floor-60 / context-cannot-help claim is withdrawn. At util 0.97, OFFGB=55 failed the 1M minimum-KV check: 2.2 GiB needed, 0.65 GiB available; OFFGB=60 works with about 4.87 GiB KV. Intermediate settings remain untested. Shorter context may permit a lower-offload bind but does not automatically move experts; verify actual placement and stability. Full terminal cause: results/2026-09-15-round6-instrument-v2/campaign-round6-2026-09-15.log."
  - "CORRECTED 2026-09-15: the former 35%-understatement / session-replay-is-capacity claim is withdrawn. Round 6 proxies differ in tool mix (150 vs 277 recorded tool-call turns), context cap, and ordering. Only v14 ran ordered sessions. Their throughput/cache-counter difference is descriptive, not an isolated cache effect or proof of invariant configuration ranking. Neither proxy executes tools or feeds generated outputs forward; the repeated warm pass is not newly continuing sessions. Per-request bootstrap intervals must not be attached to wall-clock aggregate throughput."
  - "v13 is tuned on the PROSE knee. On real Hermes agent transcripts at 4 concurrent workers it measures −12% vs v12 (207 vs 236 tok/s): agent text accepts ~85% of drafts, so k=1 (0.87 accepted/step) leaves tokens on the table that k=5 (2.70/step) collects even at C4. Single-stream and C1–C2 are unaffected. Round 5 second pass confirms (v13 188 vs v12 207 mean of two). v14 [[1,4,5],[5,16,1]] is the agent-lane answer: recovers v12 on replay (207), keeps v13 at C6+, gives back the C3/C4 prose gain. Pick by traffic: agents at 3–4 streams → v14; prose/batch throughput → v13. Round 4: results/2026-09-14-round4-v13-validation/; Round 5: results/2026-09-15-round5-v14-agent-schedule/."
  - "CORRECTED 2026-09-17: confirmed on a second pair (e2c); CORRECTED 2026-09-17: held-out math +41%; held-out JP/DE −1.5% (wash) — static profile has least to offer on non-English long-form; adaptive remap is the planned phase 2; profile is static (rowmap-static-v1 from 34.4M decode selections on agent+prose+replay fixtures)."
  - "k-schedule lever CLOSED on the v18 lane (2026-09-19, results/2026-09-19-overnight-ksched-nightly-adaptive/T1T2): a k=3 mid band ([[1,4,5],[5,12,3],[13,24,1]] and [[1,8,5],[9,24,3]]) is a verify-compute tax at C8 (−6.2% / −12.9%) and does nothing for the agent replay (−3.8% / −2.7%) because four replay workers never leave the k=5 band; accepted/step is 2.6–2.7 on every schedule including v18. Two windows each, two controls, hash hit. Do not re-spend boots on k schedules unless the traffic shape changes."
  - "On-line adaptive placement CLOSED for this hook (2026-09-19, results/2026-09-19-overnight-ksched-nightly-adaptive/T4): E4b D1 counter unfrozen on v18 costs C1 −3.0% / C8 −2.9% (bar −1.5%) and applied 11–12 swaps, all in the first drain after GO, zero during held-out JP/DE — the EWMA never moves a row on lane traffic. Held-out earn-back was NOT measured (runner called e2c_heldout.py without its tag argv → IndexError; recorded, not re-run because the placement never changed). The E4/E4b/E5 conclusion stands: one map per traffic class, swapped by hash-hit reboot."
  - "The hook's MIN_HOST_AVAIL=10 GiB guard is marginal by design: every v15/v18 boot on the 0909 image clears it by only 1–2 GiB at rehome layer 9 (11.36 → 12.02 GiB). The nightly landed at 9.68 and aborted (PIN_HOT abort layer 9). Fix without touching the shared hook: --cpu-offload-gb 54 (9 positional UVA layers instead of 10; post-rehome residency identical, HBM_expert 206.61 / pinned_expert 62.33; ~6 GiB more host at the tail). Offload GiB does not enter the FlashInfer kernel-shape hash. launch-t3-nightly.sh takes OFFGB."
  - "Nightly image vllm/vllm-openai:nightly-dee37d89115db4c94a820a79a78a7828e141c910 (vLLM v0.29.1rc1.dev347, FlashInfer 0.6.18.post1, cu134) binds on driver 595.84/595.91 with every v18 flag; TrtLlmMxfp4ExpertsModular._invoke_kernel signature is byte-identical to 0909 so the v15 hook mounts unchanged. Hook OFF it is C1 97.1 (+9.5% over v14 positional 88.7) but ≈½ of v18 at C8/C16 — not a lane by itself. It is NOT token-identical to 0909 (greedy 2/18 text prompts match): a cross-image 18/18 parity bar is meaningless; gate parity per image. It accepts fewer shell/tool_json drafts (83/80% vs 91/88%). KV reports 4.53M tokens with the hook (v18 2.50M) — an accounting change, uninvestigated. Results/2026-09-19-overnight-ksched-nightly-adaptive/T3 and T3b."
  - "RESOLVED 2026-09-19 22:00 (T3b5, same bundle): OPEN 2026-09-19 (results/2026-09-19-overnight-ksched-nightly-adaptive/T3b): nightly dee37d89 + v15 hook at off54 measures C1 183.6–195.7 vs v18 172.1 (+6.9% / +13.7%), C8 +8–10%, C16 +21% paired, replay n=4 +14% — but ONLY on boots where FlashInfer autotunes live in-process. Any boot that LOADS a saved autotune cache (docker start, or fresh run with the cache present) lands at exactly v18's 172 with C4 −15% / C12 −17%. Two live tunes on 0.6.18.post1 choose different configs (27/42 MoE + 58/147 GEMM entries) and different greedy tokens; a live tune vs its own loaded cache is token-identical on 16/16 text prompts yet ~7% slower. Nothing promoted; v18 remains the reference. CORRECTED 2026-09-19 by T3b5: booting with the 196-tok/s set pinned as the cache (two fresh boots, both hash-hit Loaded 189) gives C1 187.8/188.2/188.0 and 187.8/187.9 vs a same-window v18 171.5 (+9.6%, two boots within 0.2), C4 423–425 (+2.4%, the −15% hole is gone), C8 +1.5–3.0%, C16 paired +3.2%, replay wash (312/460 vs 331/437), parity 17/18 vs the tune that made the set (16/16 text). So BOTH mechanisms are real: config selection is worth slow→fast 172→188 with both loaded, and a residual ~4% exists only in the live tune (188 loaded vs 195.7 live). Not promoted: the nightly accepts fewer drafts on every boot (prose 0.288 vs 0.349, tool_json 0.81 vs 0.88) so the agent fixture reads prose −10.5% / tool_json −10% / structured −8% (code +3.6%) — on a tool-heavy lane the prose-knee win does not pay. A pinned autotune file is a valid recipe mechanism on FlashInfer 0.6.18.post1 (record its sha256; slow set 17abc02e…, fast set 5440f02d…). Upstream: live-vs-loaded ~4% and the 9% between two saved sets is a FlashInfer autotuner finding to file with both JSONs."
  - "Every window receipt before 2026-09-19 lacks GPU power draw / cap / SM clock / throttle reason. The Station shares a fixed 1600 W budget between the GB300 and the RTX add-in card under vsloshd (docs.nvidia.com DGX Station Development Guide, Dynamic Power Sloshing); on this box vsloshd is inactive, GB300 cap 1300 W, RTX PRO 4000 cap 70 W (≤75 W class → GB300 gets the full budget). A drifting cap would look exactly like the ~3%/day reference drift this recipe reports. Runners from T3b5 onward log nvidia-smi power/clock/throttle before and after every window."
  - "The nightly image (vLLM main ≥ 2026-09-10, #56935) silently defaults DeepSeek-V4.1-Flash's KV cache to nvfp4_ds_mla on SM100/SM103 where the 0909 image used fp8_ds_mla (log line `Using DeepSeek's … KV cache format`). Effects measured 2026-09-19/20 (results/2026-09-19-overnight-ksched-nightly-adaptive/T3b5 vs T3b6): KV pool 2.50M → 4.53M tokens (half the bytes per token), and DSpark draft acceptance drops on every class (prose 0.349 → 0.288, tool_json 0.878 → 0.810, structured 0.525 → 0.442) — the 4-bit NoPE latent moves the target logits the drafter is verified against. Passing --kv-cache-dtype fp8_ds_mla restores most of it (0.336 / 0.838 / 0.492; KV 3.18M) and the nightly is FASTER with fp8 KV (C1 193.7 live-tune / 183.3 cache-loaded vs v18 172.1). The residual 1–4 acceptance points are the nightly's own kernel numerics (greedy parity vs 0909 2/18). If you move this recipe to a nightly, pass the KV dtype explicitly and re-measure acceptance per class; do not read the larger KV pool as free."
  - "--kv-cache-dtype changes the FlashInfer kernel-shape hash (new autotune dir, full ~15-min tune on this stack). A saved autotune set is per (image, KV dtype, engine config); the T3b6 set is ddf01704… sha256 24a96383… (results/2026-09-19-overnight-ksched-nightly-adaptive/T3b6/receipts/)."
  - "v19 CANDIDATE, not promoted (2026-09-20): nightly dee37d89 + v15 hook + --cpu-offload-gb 54 + --kv-cache-dtype fp8_ds_mla + pinned autotune set ddf01704…. Same-window vs v18: C1 +6.5% on a cache-loaded boot (+12.6% live-tune), C16 +2%, replay wash-to-+12%, KV 3.18M; fixture tool_json −6% (bar −3%), prose/structured −4 to −6% on the loaded boot. Live-vs-loaded tax −5.4% with identical tokens — third observation (−4 / −6 / −5%), FlashInfer 0.6.18.post1, filed upstream. Promotion needs a second loaded-config pair, the fund harness at C16/C24, and a ruling on tool_json on a tool-heavy lane."
  - "KERNEL BISECT 2026-09-21 (results/2026-09-21-kernel-bisect): hook on, off54, fp8_ds_mla on three nightlies between 0909 and the reverted v19. Agent-doc top-1 flips vs no-hook: v18 0.56 -> 2671fedf (09-13, model support only) 1.77 -> af1c0149 (09-16, +#56464 DeepSelect top-k, #56962 Mega-mHC, #56512 Engram prefetch) 11.73 -> 0bfc7a15 (09-17, +#56935 mega-attn/NVFP4 KV, MegaMoE) 10.99 -> dee37d89 (v19) 11.45. The drift enters with the af1c0149 PR set; which of the three is not separated. 2671fedf keeps v18 acceptance on every class (tool_json 0.860 / shell 0.908 / prose 0.349), BFCL 561/600 = 93.5, C1 180 loaded / 189 live, C8 685, C16 958: it passes the promotion rule and is the v20 CANDIDATE. Not promoted - needs a same-window v18 pair, fund harness, pinned autotune sha256. 0bfc7a15 and dee37d89 share the ddf01704 autotune hash (Mega-Gate does not change MoE shapes)."
  - "v19 REVERTED 2026-09-20 21:42 CDT (results/2026-09-21-toolcall-gate-49435): the promotion rule became BFCL exact-match >= v18 - 1 pt AND DSpark tool_json/shell acceptance within 2 pt of v18 (James, 19:45). Same-window: BFCL v4 simple_python+multiple (600, T=0, our AST grader) v18 560/600 = 93.3 vs v19 559/600 = 93.2 with identical failure kinds (value/name/no-call; zero JSON-parse or extra-arg failures) - PASS; acceptance tool_json 0.878 -> 0.838 (-4.0), shell 0.908 -> 0.829 (-7.9) - FAIL. Isolation boot on nightly d05da62e (vLLM v0.29.1rc1.dev422, carries #49435 fp8_ds_mla scale fix) at the v19 flags: agent-doc top-1 flips 11.45% (v19 11.45, v18 0.56) - the drift is the nightly image kernels between 0909 and dee37d89, not the KV writer. That boot read C1 193 / C8 711 / C16 1037, BFCL 94.0, tool_json accept 0.806, selected FLASHMLA_MEGA_ATTN_DSV41 (the backend #56625 calls broken upstream for this checkpoint), and live-tuned in 16 min (not 74) on 0.6.18.post1. :30006 is v18 Many Seat; v19 and v20cand containers stopped-and-kept. Equal-budget GPQA-Diamond at 64k: v18 86.9 (172/198) vs v19 87.4 (173/198), wash. Next lever if wanted: bisect the kernel PR set (#56935 mega-attn/NVFP4 KV, #56464, #56568/#57204) one image per boot."
  - "UPSTREAM 2026-09-20 (research/upstream-watch-2026-09-20.md): vLLM #49435 'Fix SM100 fp8_ds_mla cache scales' merged 2026-09-20 00:15Z, AFTER the pinned nightly dee37d89. The generic concat_and_cache_ds_mla writer stored arbitrary fp32 tile scales that the SM100 reader converts to E8M0, so writer and reader could quantize with different scales; the fix forces power-of-two scales. v19 is the first lane on this model with --kv-cache-dtype fp8_ds_mla. DSV4.1's own compressed-cache Triton writer (fused_compress_quant_cache.py) already used power-of-two scales, so whether any v19 KV group went through the affected kernel on SM103 is UNVERIFIED. This is the cheapest candidate cause for the OPEN-FINDINGS tool-shaped logit drift (9.6% top-1 flips on agent docs): one isolation boot on nightly-d05da62e (contains the fix; new autotune hash, ~75-min live tune) with the per-class tf_logprob split decides it."
  - "UPSTREAM 2026-09-20: vLLM #56227 (encoder-side SWA-bounded replay, merged 2026-09-18 22:01Z, after the pin) makes output after a prefix-cache hit not bit-identical to a cold run BY DESIGN on any image >= 2026-09-19. On rebased images the greedy-parity and replay gates must compare cold-vs-cold (flush prefix cache or unique prefixes per sample), never cold-vs-hit; expect a different KV-tokens line since the SWA group leaves prefix caching. #57604 (MegaMoE staging, prefill only) and #56625 (ViT CUDA graphs, PR notes FLASHMLA_MEGA_ATTN_DSV41 broken upstream for this checkpoint) are also post-pin: name the attention backend from the boot log on every rebase. #43310 adds --per-request-spec-decode-metrics (opt-in): use it on gate boots for the per-request tool_json/shell acceptance bar, off in serving until costed. #37190 (LFRU expert cache) still open, enforce-eager, BF16/FP8 only: not our path, the hook stays. FlashInfer autotune v2 (#3861) ships only in FI 0.7.0; no vLLM image we run has it, so the pinned autotune set by sha256 remains the workaround for the live-vs-loaded tax. HF model main moved to dba1be0a (encoding-only: tool namespaces); weights and config unchanged, revision pin df42c109 stands."

