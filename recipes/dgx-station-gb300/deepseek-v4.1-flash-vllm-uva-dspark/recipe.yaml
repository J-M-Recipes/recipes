    aggregation: "completion tokens / measured wall time. Prefix-cache token hit 71.3%, TTFT median 0.45 s / p90 0.77 s; identical-request second pass 275.2 tok/s, hit 94.3%, TTFT 0.32/0.47 s. No actual tool execution or generated-output feedback. The original per-request bootstrap targets a different busy-worker estimator, not wall-clock uncertainty. Twenty context sequences share nineteen truncated IDs. CORRECTED 2026-09-15: production-capacity and cache-causal-speedup claims withdrawn; only v14 was tested on this workload."
    provenance: { run_id: 2026-09-15-round6-instrument-v2, method: "replay_sessions.py (historical instrument; see corrected bundle README)", raw: replays-R6-sess-v14-a-n4.json }
