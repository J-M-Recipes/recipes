schema: jm-recipe/v1
id: dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark
title: DeepSeek-V4.1-Flash at 1M context on one DGX Station GB300 (vLLM UVA expert offload + DSpark)
summary: >
  The 510 GB DeepSeek-V4.1-Flash checkpoint (MXFP4 experts, FP8 Engram) does not fit 250 GiB of HBM.
  This recipe serves it from one GB300 by offloading 60 GiB of routed-expert weights to Grace memory over
  NVLink-C2C with vLLM's UVA backend, keeps the full 1,048,576-token context, and runs the in-checkpoint
  DSpark drafter on the v14 batch-size schedule (k=5 at 1-4 streams, k=1 at 5-16). ~90 tok/s single-stream prose,
  140-160 tok/s on agent/code/tool text, 429 agg at C16, a 972K-token prompt prefills in 85 s, and Hermes
  tool-calling passes 10/10 under the real agent harness. Serving lane on :30006 since 2026-10-18 10:21 CDT is v23 "Pin Exact" = v22 + PYTORCH_CUDA_ALLOC_CONF=pinned_max_cached_size_mb:1024 (torch stops rounding the two 94.4 GiB Engram pinned allocations up to 128 GiB: pinned host 327.96 -> 252.79 GiB, boot-guard host margin 12 -> 198 GiB; decode, KV, autotune hash and greedy non-tool output unchanged, 16/16 vs both controls; real-text C1 188.2 tok/s, BFCL held-out 77.65). PRIOR v22 (2026-10-17, k=5 band to 8 sequences) is the rollback. Candidate NOT promoted (pending James): vLLM nightly-39983a5e + hook with SWA bounded replay off (config C) passed all 7 pre-registered gates on 2026-10-18 (+2..+13% per-class decode, TTFT 8K 0.43 vs 0.645 s, KV +55%) with GSM8K-200 exactly at its -1.5 pt bar and +48% completion tokens. Earlier: v21 "Fused Split" (2026-09-27; v18 launch on the 0909 image + hook v21: the six torch ops of split_ids() per MoE layer fused into one Triton kernel; same-window CTL→CAND→CTL: C1 prose 182.8 vs 171.8/172.5 (+6.2%), C2–C16 +4.0–4.9%, non-tool greedy 16/16 identical vs both controls; held-out BFCL on v21 pending). Measured against v18 because the box had been serving v18 since v20 was stopped on 2026-09-21 20:57 CDT (no ledger entry); v20 + hook v21 is unmeasured. Documented release is v20 "Clean Nightly" (2026-09-21: vLLM nightly 2671fedf, the last nightly before the mHC-fold drift, + v15 hook + off54 + fp8_ds_mla; 181 tok/s C1 prose, +5% over v18, held-out BFCL 78.8 vs 78.9, every gate same-window). v18 "Many Seat" (2026-09-18) is the rollback. v19 "Nightly" (dee37d89 + fp8_ds_mla + off54) was promoted 2026-09-20 12:11 CDT and REVERTED 21:42 the same day: BFCL tool-call exact-match was a wash (93.2 vs 93.3) but DSpark acceptance on tool-JSON/shell text fell 4/8 pts and teacher-forced top-1 flips on tool-shaped text were 11.45% vs 0.56% — the nightly kernels, not the KV path (unchanged with vLLM #49435). Nightly speed (+6.6% C1) is real and not adopted pinned. Same-window vs v18 over six runs: C1 prose 183 vs 172 (+6.6%), fund C24 agg 306-310 vs 285 (+8%), C24 warm p50 0.55 s, C16 warm p95 1.68/2.56/1.72/1.72 s (v18 1.78/1.76/4.60), tools 64/64, replay tool turns +4%/+10%, 18/18 greedy parity boot-to-boot. Fidelity measured (see verification.quality) — OPEN: v19 logit drift concentrates on tool-shaped text (9.6% argmax flips vs 0.9% for v18 on the agent docs; DSpark tool_json/shell acceptance −4/−8 pts every nightly boot); tool-call correctness at real n not yet measured; see results/2026-09-20-fidelity/OPEN-FINDINGS.md before treating v19 as clean. v18 kept stopped as rollback. v18 "Many Seat" (2026-09-18): v15 hook + --max-num-seqs 24, k-schedule [[1,4,5],[5,24,1]], and token-sized --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128. Same-window on a 35-seat fund harness: C24 warm agent-turn p50 27 s -> 0.55 s, cold 120K under 16 streams p95 19 -> 9.2 s, tools 64/64; knee prose C1 172 (v15 153, +12%), C8 655 (v15 698, -6%), C16 945 (flat); KV 2,502,950 tokens (2.4x at 1M; v17 with default graphs 1.79M). The fund-harness latency on v15 was a slot queue at 16 seqs (KV peaked at 16%), not prefill: idle cold prefill is 22-23K tok/s at 26K-207K on every profile. Release "Pin Hot Experts" v15 (2026-09-17): v14 launch + a bind-mounted hook that re-homes each MoE layer's experts by measured usage (295 hot rows in HBM, 89 cold rows pinned in Grace) and runs the MoE as two do_finalize=False routed-kernel calls plus one fp32-FMA finalize — bit-identical to v14 (8/8 greedy prompts; acceptance rates identical). Confirmed on two same-window pairs (2026-09-17): C1 88.7→153.3 (+72.7%, four runs within 0.4), C8 305→705, C16 386–417→~955 (six of seven reps; one 667), prose fixture 91→153, KV 4.75 GiB, pinned 62.3 GiB, 21 new autotune profiles (12 min). Release "Sixty-K Agent" v14 (2026-09-15): the v13 schedule with k=5 held to C4 for agent lanes, [[1,4,5],[5,16,1]]; same hash, agent replay at C4 recovered to v12 (207 vs v13 188), C6+ knee identical to v13. Release "Sixty-K" v13 (2026-09-14): one config line over
  "Sixty" (v12), +26-35% at 4-16 streams on the prose knee, C1 unchanged, same weights/verifier, two same-window
  pairs. Earlier rounds closed the residency axis (no faster GPU→Grace path on GB300) and static k (no single k
  fits); a decode-vs-depth map shows decode flat to 425K tokens, so attention is not the lever on this box either.
status: verified
owners: [jmeadlock, milo]
updated: "2026-10-18"
tags: [deepseek-v4.1-flash, mxfp4, vllm, uva-offload, dspark, speculative-decoding, 1m-context, single-gpu, agent]

model:
  name: DeepSeek-V4.1-Flash-1017   # weights-only update promoted 2026-10-17 (Card E); df42c109 launch checkpoint retired, results below it are on df42c109 unless marked 1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram   # model card; 284B was V4-Flash, corrected 2026-09-20
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170   # previous: deepseek-ai/DeepSeek-V4.1-Flash@df42c109f1defefcbfcedbe7d905718a12266e40 (config.json, index, tokenizer byte-identical; weights only)
  quantization: as shipped — routed experts MXFP4 (I8 + E8M0 block scales), Engram and attention FP8. Nothing re-quantized.
  draft:
    repo: in-checkpoint (mtp.{0,1,2}.* tensors, 97 params)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170   # retrained drafter: fixture acceptance prose 34.9->25.2, shell 90.8->80.0, tool_json 87.8->77.3, code 66.1->69.6 (Card A, same window). Schedule re-validated, unchanged (Card C).
    method: DSpark, num_speculative_tokens=5 with num_speculative_tokens_per_batch_size=[[1,8,5],[9,24,1]] (v22, reference since 2026-10-17 16:55; v21 [[1,4,5],[5,24,1]] retired; v13 [[1,2,5],[3,16,1]] for prose throughput)

hardware:
  profile: hardware/dgx-station-gb300.yaml
  nominal: { gpu_memory_gb: 288, host_memory_gb: 496 }
  observed:
    gpu: NVIDIA GB300
    driver: "595.84"
    cuda: "13.0 (container runtime)"
    gpu_memory_visible_gib: 250.7
    host_memory_gib: 494.5
    os: Ubuntu 24.04.4 LTS
    kernel: 6.17.0-1032-nvidia-64k
    snapshot: results/2026-09-10-v11-1M-k5-lpt6144/system.json
  required_settings:
    - "Checkpoint on LOCAL NVMe. From a CIFS/SMB share, weight load is 1,246 s and the DSpark draft pass ~600 s, degrading with each back-to-back boot; from local RAID0 NVMe it is 133 s + 20 s. Boot 92 min → 8 min."
    - "Mount a persistent /root/.cache/vllm so the FlashInfer autotune cache survives. Every distinct engine config (seqs/spec/ctx) hashes to a NEW empty dir and re-runs a 74-minute MoE autotune unless you pre-seed it (see README)."
    - "Do NOT set CUDA_VISIBLE_DEVICES; DGX OS's docker config already hides the display GPU."

runtime:
  engine: vLLM
  engine_version: 0.1.dev20904+g179dd0fa9 (DeepSeek-V4.1 day-0 image; serving v21 2026-09-27 -> v22 -> v23 2026-10-18. PRIOR documented release v20 = nightly 0.29.1rc1.dev9+g2671fedfc; v19 was dev347+gdee37d891)
  engine_commit: 179dd0fa9
  container:
    image: vllm/vllm-openai:deepseekv41-flash-0909
    digest: sha256:00d577a6a63281e15336029d5bcee4e9a2cf182214a4f20ba6111b1c8e79893d
    base_image: "vllm/vllm-openai (upstream day-0 build, created 2026-09-10T06:39Z; digest re-read with docker image inspect 2026-10-18). PRIOR documented release v20 (2026-09-21) = vllm/vllm-openai:nightly-2671fedfc7ae604761990603fc736c0c4f21de57 sha256:91c875065792e9b79dfec5019e5017f96b1511eed292e7ec15182444b23efe66, flashinfer 0.6.18.post1. Nightly-39983a5e (sha256:a3bc7f09...) is a measured candidate, not this runtime: see limits and results/2026-10-18-p2-nightly-39983a5e-gate."
  key_libraries:
    torch: 2.13.0+cu130
    transformers: 5.17.0
    flashinfer: "0.6.18"
    triton: 3.7.1
  patches:
    - path: results/2026-09-27-v21-fused-split/hook/pin_hot_experts_hook.py
      sha256: b5e4f4f852b9dd3b510b7acda191f30255f105aa0cfda41fa222f48bc37729f4
      purpose: Hook v21 (serving on :30006 since 2026-09-27; v21, v22 and v23 all mount it, sha256 re-read inside the v23 container 2026-10-18) = v15 hook with split_ids() as one Triton kernel instead of six torch ops per MoE layer (integer remap only; PIN_SPLIT_FUSED=0 restores the torch path). sha256 taken inside the running container. Bit-exact vs the torch path at T=1..8192 (v19_test_split.py).
    - path: results/2026-09-17-e2b-pin-hot-experts-v15/hook/pin_hot_experts_hook.py
      sha256: 723066ddef1bb9b6c1a18e5b42f5d471be8269cac7bbf49172e725fcd150f07a
      purpose: Bind-mounted hook (sitecustomize.py loads it). Monkeypatch of TrtLlmMxfp4ExpertsModular._invoke_kernel; no vLLM/FlashInfer source change; kernels/cubins unchanged. 295 hot HBM / 89 cold Grace rows; F4 two do_finalize=False calls + fp32-FMA finalize.

launch:
  script: results/2026-10-18-v23-pinexact-host/scripts/launch_v23.sh
  command: "bash results/2026-10-18-v23-pinexact-host/scripts/launch_v23.sh [CONTAINER_NAME]  (v23 Pin Exact, reference since 2026-10-18 10:21 CDT: docker run of vllm/vllm-openai:deepseekv41-flash-0909 with the 1017 checkpoint at /model, persistent /root/.cache/vllm, hook v21 bind-mounts (sitecustomize.py + hook dir at /w), env PIN_MODE=split PIN_HOOK=/w/pin_hot_experts_hook.py PIN_ROWMAP=/w/rowmap-static-v1.json PYTORCH_CUDA_ALLOC_CONF=pinned_max_cached_size_mb:1024, serve flags --offload-backend uva --cpu-offload-gb 60 --cpu-offload-params routed_experts.w13_weight routed_experts.w2_weight --engram-config cpu_offload --max-model-len 1048576 --max-num-seqs 24 --max-num-batched-tokens 8192 --gpu-memory-utilization 0.97 --long-prefill-token-threshold 6144, DSpark k=5 with num_speculative_tokens_per_batch_size [[1,8,5],[9,24,1]], --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128, deepseek_v41 tool/reasoning parsers, port 30006. PRIOR v22 = the same command without the PYTORCH_CUDA_ALLOC_CONF env (results/2026-10-18-v23-pinexact-host/launch_v23-vs-v22.diff). PRIOR documented v20 command is VARIANT v20 in notable_flags.)"
  health: "curl -fs http://localhost:30006/v1/models ; v23: log must show 'Engram table offloaded to pinned host memory: … 94.42 GiB per rank' twice, 'PIN_HOT rehome done layers=40 HBM_expert=206.61GiB pinned_expert=62.33GiB … host_avail=197.69GiB' (v22 read ~12 GiB here against the hook's 10 GiB floor), 'GPU KV cache size: 2,504,891 tokens' and 'Loaded 189 configs' from hash 62426808… (hash-hit restart ~5 min). Host check: sum of Size over the EngineCore /dev/zero (deleted) maps in /proc/<pid>/smaps = 252.79 GiB (v22 327.96). Older lanes: v20 (same checks as v19, KV pool 2,550,264 tokens, autotune set a34f9ad4… 189 configs, hash-hit restart ~5 min): log must show \"Using DeepSeek's fp8_ds_mla KV cache format\", 'GPU KV cache size: 3,179,961 tokens', hook 'HBM_expert=206.61GiB pinned_expert=62.33GiB', and 'Loaded 189 configs' from the pinned ddf01704 set (hash-hit restart ~5 min; a live tune is ~75 min and yields a DIFFERENT set that runs ~5% faster at C1 but is not the pinned release). v18: log must show 'GPU KV cache size: 2,502,950 tokens', 'Graph capturing finished in … took 1.30 GiB' then '1.10 GiB', hook lines 'PIN_HOT rowmap layer … hot=295 cold=89' and 'HBM_expert=206.61GiB pinned_expert=62.33GiB', and 'Loaded 189 configs' (v18 hash; seqs change = new hash, ~16 min tune on first boot). v14/v15: log must show 'Total CPU offloaded parameters: 61.17', 'Available KV cache memory: 4.87 GiB' (4.89 on v12) and 'Loaded 210 configs' (hash 9ac7b387 — this schedule shares v12's hash; changing the breakpoints, e.g. [[1,3,5],…], makes a new hash and a ~80-min retune) (not 'Autotuning process starts' followed by silence — that is the 74-min retune)"
  warmup: "scripts/smoke_vllm.sh (arith, count, prose, tool call, thinking) then scripts/knee.sh once; first hit of each prompt-length class pays a few seconds of shape JIT. After any boot the first cold ~53K-token request is ~1 s slow and replay r1 runs ~25% low on every arm (Card S0b): drop the first cold probe and compare replay r2 only. v23 promotion window (Card S0c) = knee6 x2, knee.sh x2, kbench RT C1 x3, gauntlet; prose-knee C8 is bimodal (fast ~620-632 / slow ~556-583 reps), so gate C8 on >= 4 reps."
  notable_flags:
    - "VARIANT v23 (reference 2026-10-18 10:21 CDT, Pin Exact): VARIANT v22 plus -e PYTORCH_CUDA_ALLOC_CONF=pinned_max_cached_size_mb:1024. torch 2.13 CachingHostAllocator rounds pinned allocations to a power of two; above the cap they are pinned at exact size. Engram maps 2 x 128 GiB + 2 x 4 GiB -> 2 x 91.55 + 2 x 2.86 GiB; hook cold-expert maps (<= 1 GiB) unchanged. Pinned host 327.96 -> 252.79 GiB, MemAvailable steady ~124 -> ~196 GiB, hook guard host_avail at layer 9 12.1 -> 197.7 GiB. Same image, kernels, autotune hash (62426808, Loaded 189), KV 2,504,891. Card S0 (CTL1 -> S0 -> CTL2): RT C1 +0.1%, C4 -0.7%, C16 -1.5%, replay r2 -0.2%, gauntlet 12/12, greedy non-tool parity 16/16 vs both controls. Card S0c confirm: knee6 r2 C8 +1.3%, C6 -1.2%, RT C1 +0.2% (188.2 vs 187.8). Launcher results/2026-10-18-v23-pinexact-host/scripts/launch_v23.sh. Rollback: docker stop dsv41-vllm-1017-v23-pinexact-BOUND-REF && docker start dsv41-vllm-1017-v22-ksched1to8-RETIRED-REF."
    - "VARIANT v20 (documented release 2026-09-21, PRIOR command): MODEL=/models/DeepSeek-V4.1-Flash-df42c109f1defefcbfcedbe7d905718a12266e40 IMAGE=vllm/vllm-openai:nightly-2671fedfc7ae604761990603fc736c0c4f21de57 TAG=v20-nightly OFFGB=54 UTIL=0.97 SEQS=24 SPEC=dspark:5 KVDT=fp8_ds_mla KSCHED='[[1,4,5],[5,24,1]]' CTX=1048576 EXTRA='--long-prefill-token-threshold 6144 --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128' bash scripts/launch-dsv41-vllm.sh  (plus the v15 hook bind-mounts and PIN_* env from VARIANT v15, --kv-cache-dtype fp8_ds_mla, and the FlashInfer autotune set for config hash ddf01704 present in the mounted vLLM cache at flashinfer_autotune_cache/0.6.18.post1/103a/ddf01704…/autotune_configs.json (copy in results/2026-09-20-v19-pair-async/autotune-ddf01704/; seed it before first boot — a live tune produces a different, unpinned set); results/2026-09-18-many-seat-v16-v17-v18/launch-many-seat.sh with EXTRA/KVDT is the exact launcher used, v19c/v19d runners in results/2026-09-20-v19-pair-async/v19c-v19d/)"
    - "VARIANT v21 (serving 2026-09-27): VARIANT v18 with the hook dir replaced by results/2026-09-27-v21-fused-split/hook (same mounts, same PIN_* env). Python-only change: same FlashInfer autotune hash, ~8-min boot on a cache hit. Profile of the v18 step that motivated it: 14.6 ms C1 prose step, 101% GPU-busy; ~1,300 small kernel launches = 2.7 ms, of which ~400 were split_ids ops. Same-window +6.2% C1 / +4-5% C2-C16, replay wash, acceptance unchanged."
    - "VARIANT v22 (reference 2026-10-17 16:55 to 2026-10-18 10:21, now PRIOR/rollback): v21 launch with num_speculative_tokens_per_batch_size [[1,8,5],[9,24,1]] — k=5 through 8 live sequences, k=1 above. Same num_speculative_tokens=5 → same FlashInfer autotune hash as v21, 8-minute boot. Launch file: ~/dsv41/1017/launch_v22.sh on the Station. Evidence: Card T (Sero grid 512/2k/8k × C1/4/6/8: C6 +50–58%, C8 +55–59%, C1/C4 flat; prose knee C8 −6.9% (621 vs 667), C16 −0.4%) and Card U (bracketed real-transcript replay CTL1→CAND→CTL2 at N=4/6/8 ×2: N=6 461/479 vs 415/443 and 402/411; N=8 473/484 vs 456/467 and 461/453; N=4 flat). Trade stated plainly: +2…+17% on agent traffic at 6–8 live sequences and +50% on long high-acceptance output, −7% on 8 concurrent prose streams. Rollback: docker stop the v22 REF, docker start dsv41-vllm-1017-v21cfg-RETIRED-REF."
    - "VARIANT M3G (measured 2026-10-18, NOT adopted; Grace-only MegaMoE via original-el8 M3 hook, Apache-2.0): image vllm/vllm-openai@sha256:3af6a45b060d681aa6254200f87859d1bb3c1f962afb3d15540b4b31d4a41063 (= nightly-af7f9488, tag rotated off Docker Hub - pull by digest) + el8 hook @87af662 (MEGA_HOOK=/w/mega_peer_hook.py MEGA_PEER=0 MEGA_COLD_TRT=1 MEGA_FUSED_SEND=0 MEGA_MHC_OVERLAP=1 MEGA_LL_GEMM=1, MEGA_ROWMAP=rowmap-static-v1.json 295/89 or rowmap-mix-v1.json 285/99) + vllm#58132 decoder-replay overlay (5 files bind-mounted; the PR is not in af7f9488 or v0.31.0) + --moe-backend deep_gemm_mega_moe --enable-expert-parallel --max-num-seqs 32 --gpu-memory-utilization 0.97 --kv-cache-dtype fp8_ds_mla --enable-prefix-caching --speculative-config dspark k=5 [[1,4,5],[5,8,3],[9,32,3]] draft_sample_method probabilistic, graphs 1..128, numactl --membind=0 entrypoint; NO --cpu-offload-gb. Mechanism: MegaMoE is constructed with num_experts=n_hot so DeepGEMM holds only the hot rows; cold rows run on the FlashInfer TRT-LLM MXFP4 kernel from pinned Grace via UVA (this recipe cold path). Same-window vs v22 on 1017, real-text harness (8.2K in / 1024 forced / 0% prefix): with OUR map C1 176 vs 188 (-6%), C4 341 vs 333, C16 654 vs 538 (+22%), C32 output 739 vs 511 (24-seq control queues 8), TTFT 0.29 vs 0.65 s, knee 180/672/934 vs 192/619/938, replay n=4 405 vs 415, gauntlet 12/12; with el8 public mix map C1 147 / C4 268 / C16 459 (-13..-28%). Verdict: fails the C1 bar, passes C16/TTFT; a prefill-TTFT and C16+ lever, not a C1 lever; the MAP (285->295 hot) was worth +20% C1 / +42% C16 on the same kernel. Kept stopped as dsv41-vllm-M3G-ours-EXP = the RTX PRO 6000 sidecar base (MEGA_PEER=2). Receipts results/2026-10-18-cardM3G-grace-only-megamoe/."
    - "VARIANT V22S32 (measured 2026-10-18, NOT adopted): v22 launch with --max-num-seqs 32 and [[1,8,5],[9,32,1]] (new autotune hash, live tune 23.5 min). First boot read knee C1 +10% / RT C1 +3%; bracketed confirm CTL->CAND->CTL: RT C1 185.8 vs 190.4 (-2.4%), C4 321.7 vs 331.8 (-3.0%), C16 542 vs 539, C32 output 640 vs 516 (+24%), C16 TTFT 2.12 vs 1.47-1.63 s, replay 418 vs 425. Passes the pre-registered bar only at the edge; the +10% was autotune luck. Not promoted: lane traffic is C1-C8 and the seat count moves with the sidecar. Kept stopped as dsv41-vllm-1017-v22-seqs32-EXP (cached hash, 5-min boot). Receipts results/2026-10-18-cardM3G-grace-only-megamoe/cardS32/."
    - "VARIANT v18 (reference 2026-09-18): VARIANT v15 plus --max-num-seqs 24, num_speculative_tokens_per_batch_size [[1,4,5],[5,24,1]], --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128. Capture sizes are TOKEN counts, not sequence counts: with DSpark k=1 a step is 2x seqs tokens, so a list that tops out at 24 (v17b) leaves every batch above 12 seqs uncaptured (decode ~10 tok/s per stream at C16). This list covers k=5 at 1-4 seqs (6/12/18/24 exact) and k=1 at 5-24 seqs (10-48, pad <= 8). Default 24-seq graphs cost 2.33+1.78 GiB and KV 1.79M (v17); this list 1.30+1.10 GiB and KV 2,502,950. Knee C1/C8/C16 172/655/945 vs v17 165/650/914 same-window idle."
    - "VARIANT v15: v14 serve command plus bind-mount sitecustomize.py to /usr/lib/python3.12/sitecustomize.py and hook dir to /w; env PIN_MODE=split PIN_HOOK=/w/pin_hot_experts_hook.py PIN_ROWMAP=/w/rowmap-static-v1.json. Hook re-homes 295 hot / 89 cold expert rows and runs F4 split (two do_finalize=False routed-kernel calls + one fp32-FMA finalize). Monkeypatch of TrtLlmMxfp4ExpertsModular._invoke_kernel; no vLLM/FlashInfer source change; kernels/cubins unchanged."
    - "--offload-backend uva --cpu-offload-gb 60 --cpu-offload-params routed_experts.w13_weight routed_experts.w2_weight  (v12: 60 fits at 1M+DSpark once util is 0.97 — KV 4.89 GiB, 2.22x at 1M; 12.7 GiB fewer expert bytes over C2C = +12% C1. v11 used 70 at util 0.94; 40 does not fit even at 131K)"
    - "--engram-config '{\"cpu_offload\": true}'  (189 GiB Engram table lives in Grace memory)"
    - "--max-model-len 1048576  (full native context; costs 5.5 GiB of KV pool vs 131K and zero decode speed)"
    - "--speculative-config '{\"method\":\"dspark\",\"num_speculative_tokens\":5,\"num_speculative_tokens_per_batch_size\":[[1,2,5],[3,16,1]]}'  (v13: k=5 while 1-2 sequences run, k=1 at 3-16; entries are (range_start,range_end,k) inclusive. Two same-window pairs 2026-09-14: C1/C2 ±0%, C4 +27%, C8 +26%, C12 +27%, C16 +35% on the prose knee; C1 fixture identical. CAVEAT (Round 4, real Hermes transcripts at 4 concurrent workers): v13 −12% vs v12 (207 vs 236 tok/s) because k=1 caps accepted tokens at 1/step where agent text accepts 85%; v14 (Round 5, 2026-09-15) holds k=5 to C4: [[1,4,5],[5,16,1]] — agent replay at 4 workers 207 mean (two runs 184/229) vs v13 188 (171/206) vs v12 207 (188/225); C6–C16 knee identical to v13 (272/318/379/434); C3/C4 prose knee back at v12 level (155/176 vs v13 195/225). v14 shares hash 9ac7b387 (454 s boot); [[1,3,5],[4,16,1]] retunes. Why k=5 for agent lanes at low batch: Same-window 2026-09-12: k=1 gives +23% C1 / +33% C16 on prose and loses shell/code/tool-json by ~30%; k=5 the reverse. No static k fits both; the drafter's window multiplies unique experts fetched per step 3.7x at k=5. Adaptive verification (V2 runner) lands between with no losing category but misses both static peaks — see limits)"
    - "--long-prefill-token-threshold 6144  (REQUIRED for mixed traffic: without it a 480K prefill starves a short request to 18 s TTFT; with it ~1 s, long prompt +16%)"
    - "--tool-call-parser deepseek_v41 --reasoning-parser deepseek_v41 --enable-auto-tool-choice  (REQUIRED for agent use)"
    - "--gpu-memory-utilization 0.97 --max-num-seqs 24 --max-num-batched-tokens 8192  (v18: 24 seqs. At 16 the lane queued on a 35-seat harness — C24 warm agent-turn p50 27 s, chat p95 28 s — while KV usage peaked at 16%; 24 seqs took C24 warm p50 to 0.55 s and cold 120K under 16 streams from 19 to 9.2 s. 32 seqs (v16) also worked for the queue but default 32-seq graphs took KV to 1.39M. Do NOT lower --long-prefill-token-threshold to fix this: 2048 cost idle prefill -47% and prose p10 -29% (v16); the V1 scheduler serves running FCFS with that value as the per-request chunk cap, and max_num_partial_prefills does not exist in this build. util alone moves nothing: at 70 it only grew KV 10→17.5 GiB with identical tok/s. util is the headroom that lets OFFGB drop; OFFGB is the lever)"

