schema: jm-recipe/v1
id: dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark
title: DeepSeek-V4.1-Flash at 1M context on one DGX Station GB300 (vLLM UVA expert offload + DSpark)
summary: >
  The 510 GB DeepSeek-V4.1-Flash checkpoint (MXFP4 experts, FP8 Engram) does not fit 250 GiB of HBM.
  This recipe serves it from one GB300 by offloading 60 GiB of routed-expert weights to Grace memory over
  NVLink-C2C with vLLM's UVA backend, keeps the full 1,048,576-token context, and runs the in-checkpoint
  DSpark drafter on the v14 batch-size schedule (k=5 at 1-4 streams, k=1 at 5-16). ~90 tok/s single-stream prose,
  140-160 tok/s on agent/code/tool text, 429 agg at C16, a 972K-token prompt prefills in 85 s, and Hermes
  tool-calling passes 10/10 under the real agent harness. Release is v18 "Many Seat" (2026-09-18). v19 "Nightly" (dee37d89 + fp8_ds_mla + off54) was promoted 2026-09-20 12:11 CDT and REVERTED 21:42 the same day: BFCL tool-call exact-match was a wash (93.2 vs 93.3) but DSpark acceptance on tool-JSON/shell text fell 4/8 pts and teacher-forced top-1 flips on tool-shaped text were 11.45% vs 0.56% — the nightly kernels, not the KV path (unchanged with vLLM #49435). Nightly speed (+6.6% C1) is real and not adopted pinned. Same-window vs v18 over six runs: C1 prose 183 vs 172 (+6.6%), fund C24 agg 306-310 vs 285 (+8%), C24 warm p50 0.55 s, C16 warm p95 1.68/2.56/1.72/1.72 s (v18 1.78/1.76/4.60), tools 64/64, replay tool turns +4%/+10%, 18/18 greedy parity boot-to-boot. Fidelity measured (see verification.quality) — OPEN: v19 logit drift concentrates on tool-shaped text (9.6% argmax flips vs 0.9% for v18 on the agent docs; DSpark tool_json/shell acceptance −4/−8 pts every nightly boot); tool-call correctness at real n not yet measured; see results/2026-09-20-fidelity/OPEN-FINDINGS.md before treating v19 as clean. v18 kept stopped as rollback. v18 "Many Seat" (2026-09-18): v15 hook + --max-num-seqs 24, k-schedule [[1,4,5],[5,24,1]], and token-sized --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128. Same-window on a 35-seat fund harness: C24 warm agent-turn p50 27 s -> 0.55 s, cold 120K under 16 streams p95 19 -> 9.2 s, tools 64/64; knee prose C1 172 (v15 153, +12%), C8 655 (v15 698, -6%), C16 945 (flat); KV 2,502,950 tokens (2.4x at 1M; v17 with default graphs 1.79M). The fund-harness latency on v15 was a slot queue at 16 seqs (KV peaked at 16%), not prefill: idle cold prefill is 22-23K tok/s at 26K-207K on every profile. Release "Pin Hot Experts" v15 (2026-09-17): v14 launch + a bind-mounted hook that re-homes each MoE layer's experts by measured usage (295 hot rows in HBM, 89 cold rows pinned in Grace) and runs the MoE as two do_finalize=False routed-kernel calls plus one fp32-FMA finalize — bit-identical to v14 (8/8 greedy prompts; acceptance rates identical). Confirmed on two same-window pairs (2026-09-17): C1 88.7→153.3 (+72.7%, four runs within 0.4), C8 305→705, C16 386–417→~955 (six of seven reps; one 667), prose fixture 91→153, KV 4.75 GiB, pinned 62.3 GiB, 21 new autotune profiles (12 min). Release "Sixty-K Agent" v14 (2026-09-15): the v13 schedule with k=5 held to C4 for agent lanes, [[1,4,5],[5,16,1]]; same hash, agent replay at C4 recovered to v12 (207 vs v13 188), C6+ knee identical to v13. Release "Sixty-K" v13 (2026-09-14): one config line over
  "Sixty" (v12), +26-35% at 4-16 streams on the prose knee, C1 unchanged, same weights/verifier, two same-window
  pairs. Earlier rounds closed the residency axis (no faster GPU→Grace path on GB300) and static k (no single k
  fits); a decode-vs-depth map shows decode flat to 425K tokens, so attention is not the lever on this box either.
status: verified
owners: [jmeadlock, milo]
updated: "2026-09-20"
tags: [deepseek-v4.1-flash, mxfp4, vllm, uva-offload, dspark, speculative-decoding, 1m-context, single-gpu, agent]

model:
  name: DeepSeek-V4.1-Flash
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram   # model card; 284B was V4-Flash, corrected 2026-09-20
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash
  revision: df42c109f1defefcbfcedbe7d905718a12266e40
  quantization: as shipped — routed experts MXFP4 (I8 + E8M0 block scales), Engram and attention FP8. Nothing re-quantized.
  draft:
    repo: in-checkpoint (mtp.{0,1,2}.* tensors, 97 params)
    revision: df42c109f1defefcbfcedbe7d905718a12266e40
    method: DSpark, num_speculative_tokens=5 with num_speculative_tokens_per_batch_size=[[1,4,5],[5,16,1]] (v14, agent lane; v13 [[1,2,5],[3,16,1]] for prose throughput)

hardware:
  profile: hardware/dgx-station-gb300.yaml
  nominal: { gpu_memory_gb: 288, host_memory_gb: 496 }
  observed:
    gpu: NVIDIA GB300
    driver: "595.84"
    cuda: "13.0 (container runtime)"
    gpu_memory_visible_gib: 250.7
    host_memory_gib: 494.5
    os: Ubuntu 24.04.4 LTS
    kernel: 6.17.0-1032-nvidia-64k
    snapshot: results/2026-09-10-v11-1M-k5-lpt6144/system.json
  required_settings:
    - "Checkpoint on LOCAL NVMe. From a CIFS/SMB share, weight load is 1,246 s and the DSpark draft pass ~600 s, degrading with each back-to-back boot; from local RAID0 NVMe it is 133 s + 20 s. Boot 92 min → 8 min."
    - "Mount a persistent /root/.cache/vllm so the FlashInfer autotune cache survives. Every distinct engine config (seqs/spec/ctx) hashes to a NEW empty dir and re-runs a 74-minute MoE autotune unless you pre-seed it (see README)."
    - "Do NOT set CUDA_VISIBLE_DEVICES; DGX OS's docker config already hides the display GPU."

runtime:
  engine: vLLM
  engine_version: 0.29.1rc1.dev347+gdee37d891 (vLLM nightly, v19 release)
  engine_commit: dee37d89115db4c94a820a79a78a7828e141c910
  container:
    image: vllm/vllm-openai:nightly-dee37d89115db4c94a820a79a78a7828e141c910
    digest: sha256:dea7fa047caa114167efccdeb42321b12d2c11da1add8728aa2662cb8d6b8cd5
    base_image: vllm/vllm-openai (upstream nightly, pinned by digest; v18 and earlier used vllm/vllm-openai:deepseekv41-flash-0909 sha256:00d577a6a63281e15336029d5bcee4e9a2cf182214a4f20ba6111b1c8e79893d, engine 0.1.dev20904+g179dd0fa9)
  key_libraries:
    torch: 2.13.0+cu130
    transformers: 5.17.0
    flashinfer: 0.6.18.post1
    triton: 3.7.1
  patches:
    - path: results/2026-09-17-e2b-pin-hot-experts-v15/hook/pin_hot_experts_hook.py
      sha256: 723066ddef1bb9b6c1a18e5b42f5d471be8269cac7bbf49172e725fcd150f07a
      purpose: Bind-mounted hook (sitecustomize.py loads it). Monkeypatch of TrtLlmMxfp4ExpertsModular._invoke_kernel; no vLLM/FlashInfer source change; kernels/cubins unchanged. 295 hot HBM / 89 cold Grace rows; F4 two do_finalize=False calls + fp32-FMA finalize.

launch:
  script: scripts/launch-dsv41-vllm.sh
  command: "MODEL=/models/DeepSeek-V4.1-Flash-df42c109f1defefcbfcedbe7d905718a12266e40 IMAGE=vllm/vllm-openai:nightly-dee37d89115db4c94a820a79a78a7828e141c910 TAG=v19-nightly OFFGB=54 UTIL=0.97 SEQS=24 SPEC=dspark:5 KVDT=fp8_ds_mla KSCHED='[[1,4,5],[5,24,1]]' CTX=1048576 EXTRA='--long-prefill-token-threshold 6144 --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128' bash scripts/launch-dsv41-vllm.sh  (plus the v15 hook bind-mounts and PIN_* env from VARIANT v15, --kv-cache-dtype fp8_ds_mla, and the FlashInfer autotune set for config hash ddf01704 present in the mounted vLLM cache at flashinfer_autotune_cache/0.6.18.post1/103a/ddf01704…/autotune_configs.json (copy in results/2026-09-20-v19-pair-async/autotune-ddf01704/; seed it before first boot — a live tune produces a different, unpinned set); results/2026-09-18-many-seat-v16-v17-v18/launch-many-seat.sh with EXTRA/KVDT is the exact launcher used, v19c/v19d runners in results/2026-09-20-v19-pair-async/v19c-v19d/)"
  health: "curl -fs http://localhost:30006/v1/models ; v19: log must show \"Using DeepSeek's fp8_ds_mla KV cache format\", 'GPU KV cache size: 3,179,961 tokens', hook 'HBM_expert=206.61GiB pinned_expert=62.33GiB', and 'Loaded 189 configs' from the pinned ddf01704 set (hash-hit restart ~5 min; a live tune is ~75 min and yields a DIFFERENT set that runs ~5% faster at C1 but is not the pinned release). v18: log must show 'GPU KV cache size: 2,502,950 tokens', 'Graph capturing finished in … took 1.30 GiB' then '1.10 GiB', hook lines 'PIN_HOT rowmap layer … hot=295 cold=89' and 'HBM_expert=206.61GiB pinned_expert=62.33GiB', and 'Loaded 189 configs' (v18 hash; seqs change = new hash, ~16 min tune on first boot). v14/v15: log must show 'Total CPU offloaded parameters: 61.17', 'Available KV cache memory: 4.87 GiB' (4.89 on v12) and 'Loaded 210 configs' (hash 9ac7b387 — this schedule shares v12's hash; changing the breakpoints, e.g. [[1,3,5],…], makes a new hash and a ~80-min retune) (not 'Autotuning process starts' followed by silence — that is the 74-min retune)"
  warmup: "scripts/smoke_vllm.sh (arith, count, prose, tool call, thinking) then scripts/knee.sh once; first hit of each prompt-length class pays a few seconds of shape JIT"
  notable_flags:
    - "VARIANT v18 (reference 2026-09-18): VARIANT v15 plus --max-num-seqs 24, num_speculative_tokens_per_batch_size [[1,4,5],[5,24,1]], --cudagraph-capture-sizes 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128. Capture sizes are TOKEN counts, not sequence counts: with DSpark k=1 a step is 2x seqs tokens, so a list that tops out at 24 (v17b) leaves every batch above 12 seqs uncaptured (decode ~10 tok/s per stream at C16). This list covers k=5 at 1-4 seqs (6/12/18/24 exact) and k=1 at 5-24 seqs (10-48, pad <= 8). Default 24-seq graphs cost 2.33+1.78 GiB and KV 1.79M (v17); this list 1.30+1.10 GiB and KV 2,502,950. Knee C1/C8/C16 172/655/945 vs v17 165/650/914 same-window idle."
    - "VARIANT v15: v14 serve command plus bind-mount sitecustomize.py to /usr/lib/python3.12/sitecustomize.py and hook dir to /w; env PIN_MODE=split PIN_HOOK=/w/pin_hot_experts_hook.py PIN_ROWMAP=/w/rowmap-static-v1.json. Hook re-homes 295 hot / 89 cold expert rows and runs F4 split (two do_finalize=False routed-kernel calls + one fp32-FMA finalize). Monkeypatch of TrtLlmMxfp4ExpertsModular._invoke_kernel; no vLLM/FlashInfer source change; kernels/cubins unchanged."
    - "--offload-backend uva --cpu-offload-gb 60 --cpu-offload-params routed_experts.w13_weight routed_experts.w2_weight  (v12: 60 fits at 1M+DSpark once util is 0.97 — KV 4.89 GiB, 2.22x at 1M; 12.7 GiB fewer expert bytes over C2C = +12% C1. v11 used 70 at util 0.94; 40 does not fit even at 131K)"
    - "--engram-config '{\"cpu_offload\": true}'  (189 GiB Engram table lives in Grace memory)"
    - "--max-model-len 1048576  (full native context; costs 5.5 GiB of KV pool vs 131K and zero decode speed)"
    - "--speculative-config '{\"method\":\"dspark\",\"num_speculative_tokens\":5,\"num_speculative_tokens_per_batch_size\":[[1,2,5],[3,16,1]]}'  (v13: k=5 while 1-2 sequences run, k=1 at 3-16; entries are (range_start,range_end,k) inclusive. Two same-window pairs 2026-09-14: C1/C2 ±0%, C4 +27%, C8 +26%, C12 +27%, C16 +35% on the prose knee; C1 fixture identical. CAVEAT (Round 4, real Hermes transcripts at 4 concurrent workers): v13 −12% vs v12 (207 vs 236 tok/s) because k=1 caps accepted tokens at 1/step where agent text accepts 85%; v14 (Round 5, 2026-09-15) holds k=5 to C4: [[1,4,5],[5,16,1]] — agent replay at 4 workers 207 mean (two runs 184/229) vs v13 188 (171/206) vs v12 207 (188/225); C6–C16 knee identical to v13 (272/318/379/434); C3/C4 prose knee back at v12 level (155/176 vs v13 195/225). v14 shares hash 9ac7b387 (454 s boot); [[1,3,5],[4,16,1]] retunes. Why k=5 for agent lanes at low batch: Same-window 2026-09-12: k=1 gives +23% C1 / +33% C16 on prose and loses shell/code/tool-json by ~30%; k=5 the reverse. No static k fits both; the drafter's window multiplies unique experts fetched per step 3.7x at k=5. Adaptive verification (V2 runner) lands between with no losing category but misses both static peaks — see limits)"
    - "--long-prefill-token-threshold 6144  (REQUIRED for mixed traffic: without it a 480K prefill starves a short request to 18 s TTFT; with it ~1 s, long prompt +16%)"
    - "--tool-call-parser deepseek_v41 --reasoning-parser deepseek_v41 --enable-auto-tool-choice  (REQUIRED for agent use)"
    - "--gpu-memory-utilization 0.97 --max-num-seqs 24 --max-num-batched-tokens 8192  (v18: 24 seqs. At 16 the lane queued on a 35-seat harness — C24 warm agent-turn p50 27 s, chat p95 28 s — while KV usage peaked at 16%; 24 seqs took C24 warm p50 to 0.55 s and cold 120K under 16 streams from 19 to 9.2 s. 32 seqs (v16) also worked for the queue but default 32-seq graphs took KV to 1.39M. Do NOT lower --long-prefill-token-threshold to fix this: 2048 cost idle prefill -47% and prose p10 -29% (v16); the V1 scheduler serves running FCFS with that value as the per-request chunk cap, and max_num_partial_prefills does not exist in this build. util alone moves nothing: at 70 it only grew KV 10→17.5 GiB with identical tok/s. util is the headroom that lets OFFGB drop; OFFGB is the lever)"

