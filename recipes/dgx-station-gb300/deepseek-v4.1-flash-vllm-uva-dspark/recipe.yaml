  - "2026-10-18 Card M3G lesson: upstream MegaMoE (deep_gemm_mega_moe) still allocates all 384 experts in HBM (#60096 moved the transform to construction; no partial residency merged), but original-el8 hook sidesteps it by constructing MegaMoE over the hot rows only. On this box MegaMoE loses to the FlashInfer TRT-LLM MXFP4 hot kernel at M~6 (C1) and wins at large T (prefill 2.3x TTFT) and at C16+ with a k=3 band + probabilistic drafts; 10 hot experts per layer (285 vs 295) moved C1 by 20% - more than any kernel choice. Correction to older notes: vllm#55095 is a full-decode-graph fallback fix, NOT adaptive verification (that is #47808 + #52228); #61509 (adaptive-verification cudagraph memory) is still OPEN. UVA offloader code is unchanged since af7f9488. Nightly >= 2026-10-15 (#61371) changes the V4.1 KV layout (-9.5% KV tokens for MegaAttention, +4% for fp8_ds_mla) - rebase candidates must re-measure KV capacity. SGLang re-checked 2026-10-17: no in-place pinned-host expert read on main; stays parked."
