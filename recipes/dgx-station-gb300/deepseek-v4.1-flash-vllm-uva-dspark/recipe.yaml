  - "CORRECTED 2026-10-18 (v23): the boot margin below was mostly torch power-of-two rounding of the two Engram pinned allocations, not real demand; with PYTORCH_CUDA_ALLOC_CONF=pinned_max_cached_size_mb:1024 the layer-9 reading is 197.7 GiB (results/2026-10-18-v23-pinexact-host). Boot margin at the PIN_HOT host floor is ~0.3 GiB (2026-10-06). The hook aborts when MemAvailable < 10 GiB after re-homing layer 9. Six 2026-09-27 boots passed at 10.96-12.03 GiB; three 2026-10-05/06 boots aborted at 9.38-9.68 GiB; the 2026-10-06 boot passed at 10.29 GiB only after killing ~1.2 GB of stray host processes and drop_caches + compact_memory. ~1 GiB of drift since 09-27 is unexplained (same kernel, driver, hook, uptime). Before booting: stop other host workloads, drop caches. If it still aborts, OFFGB 54 is the known-good fallback variant (label results accordingly); do not lower the floor."
  - "Many-seat latency on this lane was a SCHEDULER problem, not prefill (2026-09-18). At --max-num-seqs 16 the 35-seat fund harness read warm agent-turn p95 8.5 s at C16 and p50 27 s at C24 while KV usage peaked at 16%; idle cold prefill is 22-23K tok/s from 26K to 207K tokens on v15/v17/v18 alike. Fix = --max-num-seqs 24 (v17/v18). The V1 scheduler in this build serves running requests FCFS with --long-prefill-token-threshold as a per-request per-step chunk cap; lowering it to 2048 (v16) let more prefills share a step but cost idle prefill -47% and C16 prose p10 -29% — do not. max_num_partial_prefills / max_long_partial_prefills do not exist in this build."
  - "--cudagraph-capture-sizes takes TOKEN counts. With DSpark k=1 at >=5 seqs a decode step is 2x seqs tokens; v17b's list 1 2 4 8 12 16 24 left every batch above 12 seqs uncaptured (C16 prose 9.6 tok/s per stream vs 21.8 captured) while looking healthy on TTFT. Default graphs for 24 seqs cost 2.33+1.78 GiB (KV 1.79M, v17); the v18 list 1 2 4 6 8 12 16 18 24 32 40 48 64 96 128 costs 1.30+1.10 GiB (KV 2.50M) with knee within noise of default. Cost of the 24-slot profiles vs v15 (16 slots): knee C8 -6% (698 -> 655, two same-afternoon controls; unexplained, new autotune hash suspected), C16 flat, C1 +12%. RESOLVED 2026-09-21 PM (Card G, results/2026-09-21-v20-promotion/receipts/cardG): it is the capture-size list, not the autotune. Same v20 image + hook, --cudagraph-capture-sizes omitted (engine default) vs the 15-size list, same window: C1 173 vs 180 (-4%), C4 443 vs 400 (+11%), C8 720 vs 657 (+9.6%), C16 1007 vs 969 (+4%); fund C16 warm agent p95 1.73 vs 1.68 s (flat) but fund C24 warm agent p95 9.5 vs 2.4 s (mean 2.7 vs 0.98 s) and C24 aggregate 249 vs 283 - because default graphs cost 0.7M KV tokens (pool 1.86M vs 2.55M) and at 24 seats the slot queue comes back. The list is a stated trade: -10% on the 4-8 stream knee for +4% C1, +0.7M KV and a 24-seat lane that stays warm. Kept. A 4-8 stream deployment that never runs 24 seats should drop the flag. Per-seat prose p10 at 16 streams is ~16 tok/s on every profile: a long-context and tool lane, not a 16-seat decode lane."
  - "Decode is C2C-bandwidth + kernel bound, not HBM bound. CORRECTED 2026-09-12: the v11 claim that offload 60 does not fit at 1M was measured at util 0.94; at util 0.97 it fits (KV 4.89 GiB) and gives +12% C1 in a same-window comparison. Measured fetch tax: k=0 step 11.1 ms vs 7.1 ms all-HBM (catid 2×Station PP2, rev dba1be0a) ≈ 4 ms ≈ 36% of the step. Slope ≈ 0.76 tok/s per GiB of experts moved Grace→HBM."
