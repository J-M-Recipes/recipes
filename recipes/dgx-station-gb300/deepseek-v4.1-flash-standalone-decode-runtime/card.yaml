# card.yaml - at-a-glance card sidecar. Rendered by scripts/render_card.py; never hand-edit card.html.
# Every number traces to recipe.yaml metrics or results/2026-11-08-v1-recipe/raw. Unknown = pending (renders amber).
title: "DeepSeek-V4.1-Flash · standalone decode runtime · 1× DGX Station GB300"
subtitle: "No vLLM, one sequence, greedy — DeepSeek's reference prefill plus an own CUDA-graph decode step, 301 hot experts per layer in HBM and the rest read from Grace over NVLink-C2C, in-checkpoint DSpark k=5. A research runtime, not a server"
version: "v1 · 2026-11-08 · repo ed6582e"
run_id: "2026-11-08-v1-recipe (headline cold/steady: main-ss · wall columns: main-ov2 · grouped prefill: m4p2 + prefill-bench · 1-row: fl-s3-beside)"
handles: "github.com/J-M-Recipes/recipes · github.com/jmeadlock/gb300-dsv41-decode · al-engr.com/gb300-dsv41-decode.html · @jmeadlock"

model:
  type: MoE
  type_detail: "384 routed + 1 shared expert, 6 active, plus Engram · 301 hot experts per layer in HBM, 83 cold in pinned Grace"
  total_params: 552B              # backbone, model card as carried in the sibling recipe card; + 196B Engram
  active_params: "8B prefill / 16B decode"   # model card (sibling recipe card); not re-derived from the checkpoint here
  checkpoint_gb: 510.3            # sibling card: 510,311,114,235 B stat sum of the 1017 revision; decode inventory 475.24 GiB / 96,085 tensors
  weights_short: "as shipped · MXFP4 experts / FP8 attn+Engram · nothing re-quantized"
  engine_extra: "gb300-dsv41-decode @ ed6582e · vllm-openai v0.31.0 as a library image only (vLLM never imported) · torch 2.13.0+cu130 · DeepGEMM / FlashMLA / TileLang / Triton"
  memory: "207.6 GiB read into HBM (hot experts + dense) + 259.4 GiB pinned in Grace (cold experts + Engram) · 2.72 GiB HBM free after build · 1 sequence"

hero:
  c1:      { value: 156, unit: tok/s, class: "mixed 8-prompt fixture, greedy, GPU time", label: "Decode · C1 headline (cold column)", note: "6.41 ms/token · 18.62 ms per 6-row step · steady state 162 tok/s (6.17 ms) · wall clock incl. end-of-sequence overrun 6.17 ms/token · per prompt 2.1–5.0 tok/step · Pg61 production (2 GPUs, wall clock, same prompts) 2.55 ms/token = 392 tok/s — different basis, not a ratio" }
  c16:     { value: "n/a", unit: "", label: "Concurrency", note: "single sequence by design — no batching, scheduler or C2+ measurement" }
  prefill: { value: 0.95, unit: s, label: "Prefill · TTFT, 31–54-token prompts", note: "grouped prefill, 4 streams, bit-equal to the reference prefill (was 3.9 s) · 820 ms in-run at the shipped tree, 943 ms under the profiler, 787 ms inside the headline run · longer prompts not measured · Pg61 first chunk 20–34 ms" }

guesser:
  name: DSpark
  source: "in-checkpoint MTP head (mtp.0–2), 3 stages, 7.5 GiB in HBM"
  schedule: "k = 5 drafts → 6-row verify, greedy exact match (first mismatch stops), confidence head off, one sequence"
  accept: { "fixture mean (window ≥ 32 steps)": "2.90 tok/step", "prose / story": "2.49 / 2.11", "code / math": "4.19 / 4.40", "shell / long": "3.67 / 2.63", "json / tool (4 steps each)": "4.50 / 5.00" }

