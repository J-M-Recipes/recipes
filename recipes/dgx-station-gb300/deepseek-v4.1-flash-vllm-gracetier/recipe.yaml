    value: 8.204
    unit: ms/step
    workload: "one 512-token prompt repeated (2 warm + 3 reps x 5 cells), hysteresis 1.5; same-boot static control 10.50, map fitted to other traffic then frozen 9.60, after restoring the boot map 10.41; Pg61 same cell 7.75"
    aggregation: "median of 3 reps of the fifth cell; decode wall / (engine steps - 1) from the spec-decode counters"
    acceptance_len: 2.753
    label: "a repeated prompt is the best case for an adaptive map; quote the general-prompt rows for real traffic"
    provenance: { run_id: 2026-11-09-gt-a5, method: "w0_drive.py step via card-gt1.sh GT1_RES=1 (card GT3)", raw: raw/gt3/gt1-res-summary-20261109-185832.json }

verification:
  gates:
    schema:      { how: "scripts/check_recipe.py on this recipe.yaml passes (repo venv)", last_pass_utc: "2026-11-10T05:10:34Z", run_id: 2026-11-09-gt-a5 }
    digest:      { how: "Image id == repo digest sha256:c1c9f6fd... re-read on the box 2026-11-09. Component and tree hashes - raw/a5/gt1-build-20261109-221120.log ('128 files hashed; component 543d89204e4e087b; rowmap-allres 51da2571cc98aeac'). NOT RUN - checkpoint byte-verify against the Hub listing for this write-up." }
    health:      { how: "Boot gate G1 passed in all five evening boots and the two afternoon ones (gracetier ACTIVE, 23 components, host budget fits, 0 fatal lines); the server was alive after every cell including C32; Pg61 Pg61 restore rc=0 after every window (seven card windows and the v28-prob arm). Not stamped - there is no standing-service launch, watchdog or soak." }
    quality:     { how: "Evidence on file, not a full gate. (1) Swap byte audit - digests of every moved expert plus 64 random per layer against boot digests, 0 mismatches in 8 audits across 5 boots. (2) Greedy fixture with the adapted map identical 8/8 to itself and 8/8 to the boot-map capture. (3) Against Pg61 on the same 8 prompts - 0 top-1 flips before divergence, 2/8 streams identical, max abs dlogp 0.376 (Pg61 against itself 7/8 and 0.121). (4) Tool gauntlet 12/12, Pg61 same night 12/12. NOT RUN - teacher-forced bracket, GSM8K, BFCL, needle, temperature > 0 calibration." }
    performance: { how: "NOT STAMPED. Pre-registered bar (docs/REPLAN-20261109.md in the repo) - at least 1.25x v28-prob at C1 and nothing worse at C8/C32. Measured 1.155 / 1.166 / 1.107 at C1, 1.08 at C8, 1.05 at C32 - the C1 bar is missed." }

limits:
  - "Missed its own speed bar. We pre-registered 'at least 1.25x the October single-GPU recipe at one stream' as the release bar and measured 1.11-1.17x (1.155, 1.166 and 1.107 on the three passes). It is published because the comparison is the result, not because it passed."
  - "Not a standing service. scripts/card-gt1.sh stops Pg61, boots gracetier, runs cells, stops gracetier and restores Pg61; it has done that seven times. No launcher that leaves gracetier serving has been written or run, there is no health cron and no soak; each boot served only its card's cells, a few minutes of traffic."
  - "Requires the sibling sidecar recipe's Pg61 tree to be built first (the gracetier tree is a patched copy of it). A build from a clean checkout on a box that never had the sidecar lane was not attempted."
  - "The reference box has an RTX PRO 6000 installed. The recipe does not pass it to the container, but a Station without that card was not tested."
  - "General prompts are slower than the lab fixture. The static 255-hot map runs 10.5 ms/step on our lab step prompt and 13.0-13.2 on general prompts; adaptive residency brings those to 8.2 (one prompt repeated) and 11.3-12.0. The row map was fitted to lab traffic."
  - "The residency policy keeps swapping on mixed traffic - about 1,600 swaps per 20-second pass at hysteresis 1.5 with the count of displaced experts flat near 1,700; hysteresis 3.0 halved that (about 760) with equal or 1-3 % better step time in one pass each. 3.0 is a direction, not a tuned value."
  - "Concurrency is the weak axis against the two-GPU lane - 0.54x at 8 streams and 0.41x at 32. Wide batches touch more cold experts per step."
  - "Quality gates not run on this arm - teacher-forced bracket against a control, GSM8K, BFCL, needle, a 1M-token prompt, temperature > 0 sampler calibration. Greedy streams differ from Pg61's on 6 of 8 lab prompts (0 top-1 flips before the first divergence); Pg61 differs from itself on 1 of 8."
  - "Time to first token was measured to 61K prompt tokens only; the 1M claim is the engine's KV accounting line, not a served 1M prompt."
  - "Fail-open check not done. Garner's peer tier fails open on a sidecar timeout; gracetier has no sidecar and its stage kernel has no timeout path that we know of, but the wait sites were not audited for this write-up."
  - "Single run per cell, one evening. No repeat brackets, no run-to-run spread for the C8/C32 cells. The three C1 passes per arm are the only repeats."
  - "The 275-hot variant was measured at one stream only."

rollback:
  script: scripts/card-gt1.sh
  summary: "The card's own exit path is the rollback and it is the only launch path - on any exit after Pg61 is stopped it stops the gracetier containers and restores Pg61 (launch-pg61.sh up, watchdog ENFORCE); restore rc=0 in all seven card windows of 2026-11-09. Nothing else on the box is changed."

