# card-kv.yaml — variant card (EXPERIMENTAL) for the sidecar recipe: 48 GiB Grace host prefix-KV tier.
#   scripts/render_card.py recipes/dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark-sidecar --card kv
# Numbers trace to results/2026-10-24-kv3-host-prefix-tier/ (VERDICT.txt, raw/K1/evict.json, mem.tsv, throughput.csv).
title: "DeepSeek-V4.1-Flash · 1× DGX Station GB300 + RTX PRO 6000 · Grace prefix-KV tier (kv-host-tier)"
subtitle: "The sidecar lane plus two vLLM flags: prefix blocks the GPU evicts go to a 48 GiB tier in Grace memory and come back on a hit instead of being recomputed. GPU KV pool unchanged; no measurable speed cost."
version: "kv-host-tier = v25m sidecar lane + --kv-offloading-size 48 --kv-offloading-backend native · Card KV3 2026-10-24 · 10/10 gates"
status: experimental
run_id: 2026-10-24-kv3-host-prefix-tier
handles: "github.com/J-M-Recipes/recipes · al-engr.com · sidecar recipe: RonanLabsAI (dgx-station-frontier) · hook: original-el8 · tier: vLLM OffloadingConnector"

model:
  type: MoE
  type_detail: "384 routed experts + Engram; 295 hot in HBM, 89 computed on the RTX 6000 (v25m mixed map)"
  total_params: 552B
  active_params: "8B prefill / 16B decode"
  checkpoint_gb: 510.3
  weights_short: "as shipped · MXFP4 experts / FP8 attn+Engram · nothing re-quantized"
  engine_extra: "nightly-af7f9488 (sha256:3af6a45b) on BOTH GPUs · el8 hook @87af662 · b12x @2cc7f66a · vllm#58132 bounded replay · OffloadingConnector (CPUOffloadingSpec, native backend)"
  memory: "GPU KV declared 8.5 GiB = 4,400,013 tok (unchanged on all arms) + Grace prefix tier 48 GiB (51.54 GB /dev/shm mmap) ≈ 31M tok at 1,656 B/token · host MemAvailable min 129.8 GiB with the tier"

hero:
  c1:      { value: 219.9, unit: tok/s, class: "mixed JP/DE + agent, held-out prompts", label: "Decode · C1 aggregate, with the tier", note: "+0.19% vs no-tier controls 219.76 / 219.20 (pooled spread 1.36%, drift 0.26%) · 6 × 120 s per arm, bracketed K0 → K1 → K0R · cold-64K TTFT 1.424 vs 1.404 s (+1.5%)" }
  c16:     { value: "~31M", unit: tokens, label: "Prefix tokens held in Grace · 48 GiB tier", note: "1,656 B per hit token measured in the evict-replay probes (12.93 MB / 7,808 tok; 52.36 MB / 31,616 tok) · on top of 4.40M GPU tokens · this lane's fp8_ds_mla KV only, not portable" }
  prefill: { value: "×1.54–×3.2", unit: "", label: "Replay after GPU eviction · 7.9K / 31.6K-token prompt", note: "0.264 → 0.171 s and 0.711 → 0.222 s once /reset_prefix_cache dropped the GPU copy · single probe each · 950K-class needle recalled on every arm (~33 s)" }

guesser:
  name: DSpark
  source: "in-checkpoint MTP (mtp.0–2), 1017 revision"
  schedule: "k = 5 at 1–4 seqs, 3 at 5–8 and 9–32 (unchanged)"
  notes: "DSpark stays on with the tier. vllm#47890 (spec decode zeroing CPU-tier hits) did not reproduce: hits and loads at 7,929 and 31,629 tokens (not multiples of 256). Acceptance not re-measured on this card."

secondary:
  - label: "What changed and what it costs"
    items:
      "flags": "--kv-offloading-size 48 --kv-offloading-backend native, appended to EXTRA after --kv-cache-memory 9126805504"
      "dev mode": "VLLM_SERVER_DEV_MODE=1 was set on the card for /reset_prefix_cache only — production runs without it"
      "host memory": "MemAvailable min 129.8 GiB with the tier vs 177.7 / 178.9 GiB without (floor 60) · 0 OOM kills"
      "warm replay r2": "177.5 vs 183.7 (−3.4%, bar −5%) — the controls themselves span 183.7–195.5"
  - label: "Guard — same as the sidecar lane"
    items:
      "watchdog": "fail-closed, enforce mode on every arm · 0 timeouts · 0 trips"
      "errors": "0 server / 0 harness / 0 sidecar error lines on all three arms"
      "not tested": "C>1 with the tier, hit rates under real multi-user eviction pressure, TF/GSM8K/BFCL on the tier arm"

fidelity:
  - { status: pass, text: "Weights unchanged: 1017 checkpoint as shipped; the tier stores and reloads KV blocks, it does not touch weights or the GPU KV pool size (4,400,013 on all arms)" }
  - { status: pass, text: "Evict-replay outputs byte-identical to the first pass after the GPU prefix cache was dropped and the blocks came back from Grace (7,929 and 31,629 tok), and identical to the no-tier controls — short code-recall outputs, not a teacher-forced run" }
  - { status: pass, text: "Gauntlet 12/12 on the tier arm · 954,028-token needle recalled on all arms" }
  - { status: pass, text: "0 cudaHostRegister / pin warnings at boot · connector present on the tier arm only · 0 watchdog timeouts or trips" }
  - { status: pending, text: "Teacher-forced flips, GSM8K-1319 and BFCL not run with the tier on" }
