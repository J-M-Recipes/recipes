limits:
  - "PG61 IS STILL BEING TESTED (2026-10-29). Serving since 2026-10-29 10:14pm CDT; the 48 h soak runs to Saturday 2026-10-31 10:14pm CDT and any restore or card restarts it. The recipe stays experimental until it completes with scripts/pg61_lane_check.sh silent."
  - "PEER TIER v3 TIMEOUT SEMANTICS (Pg61). On a v3 wait timeout the three v3 wait sites (peer3 finish_kernel, the boundary fold, the MegaMoE fork's W6 fold) SKIP the call's cold-expert adds and keep streaming tokens - wrong output, counted only in GB300 device memory (his default PEER3_SPINS is 20,000,000 polls). Pg61 requires PEER3_SPINS=1000000000000 as plain digits (fastpath_peer3 parses it with int(); 1e12 would crash the boot) so a dead or late RTX hangs the GB300, and scripts/sidecar_watchdog_p3.py turns the hang into a fail-stop (~3 s in Card G3b). The watchdog refuses to arm (exit 3) without it. Peer tier v2 already traps on a timeout."
  - "CLIENTS KILLED BY A WATCHDOG TRIP SEE NO finish_reason (Card G3b) - the server is killed mid-stream, so streams end without a finish_reason and without an HTTP error. Treat a missing finish_reason as a failure. The post-G3b watchdog file (log the server kill first, unpause, then stop the sidecar) passes 13/13 unit tests and ran armed through G4, G5 and the cutover with 0 trips, but has not itself been fault-injected on a GPU."
