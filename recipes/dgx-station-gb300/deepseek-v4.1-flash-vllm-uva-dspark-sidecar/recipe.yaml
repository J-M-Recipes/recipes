schema: jm-recipe/v1
id: dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark-sidecar
title: DeepSeek-V4.1-Flash at 1M context on a DGX Station GB300 with an RTX PRO 6000 expert sidecar
summary: >
  Since 2026-10-29 10:14pm CDT :30006 on the reference box serves Pg61 - Garner McCloud's DS4.1 engine
  (garnermccloud/dgx-station-recipes @ 8043a681, vllm/vllm-openai:v0.31.0) under our policy, five small patches,
  the vLLM #61161/#60945 overlay and a fail-closed peer-tier-v3 watchdog - at 1.31x h2-REF per-class C1
  (temperature 1.0, mean of 3 seeds) with all six pre-registered T3 bars passed; it is still being tested (48 h
  soak to 2026-10-31 10:14pm CDT, recipe experimental) and h2-REF is the one-command rollback.
  The 510 GB DeepSeek-V4.1-Flash-1017 checkpoint does not fit one GB300's 250 GiB of HBM, and the
  obvious fallback — streaming cold experts from pinned Grace over NVLink-C2C — puts a serial ~350 GB/s
  read on the critical path of every decode step. This recipe keeps the hot experts in HBM (295 per layer,
  DeepGEMM MegaMoE via original-el8's hook) and moves the other 89 to the RTX PRO 6000 Max-Q in the same
  chassis, where they are *computed* rather than read: only activations cross PCIe, through one /dev/shm
  buffer with a device-side sequence counter (original-el8's peer tier-2 protocol, b12x kernels). The full
  1,048,576-token context is kept. Measured same-window against the Grace-offload incumbent on the same box:
  C1 real-text decode 279.5 vs 187.5 tok/s (+49%), C16 1,577 vs 524 (3.0x), C32 2,400 vs 926 (2.6x), TTFT
  at 8.2K 0.19 vs 0.66 s, 1M-token prompt first token 33.2 vs 81.4 s, and 0 sidecar timeouts across every
  window. Quality is unchanged within the measured floors (TF margin-weighted flips inside a same-map
  control, GSM8K-1319 96.97 = incumbent, needle 500/500, gauntlet 12/12, BFCL dev 92.67 vs 92.33) and the
  per-class decode gate passes 20/20 cells. A sidecar timeout would silently drop a layer's cold-expert add,
  so the lane runs an effectively-infinite spin limit plus a fail-closed watchdog (trip = kill), and the
  bring-up gate is a per-layer cosine check against the GB300's own cold path (min 0.99906, 40/40 layers).
  Cost of the win, stated plainly: the RTX card drives the display and is hidden from containers by DGX OS
  until a CDI spec is installed, the chassis' shared power budget throttles prefill (89% of 1-second
  samples at the module cap during 64K prefill — the incumbent throttles too), and one more process
  (sidecar) must be alive for the lane to be correct. The KV pool is declared, not inferred:
  --kv-cache-memory 8.5 GiB gives 4,400,013 tokens (4.20x one 1M request, +73% over util 0.97), stress-tested
  with four ~1M contexts resident at once (KV peak 75%, 0 preemptions, 0 timeouts) and no decode cost.
  From 2026-10-28 17:22 to 2026-10-29 22:07 CDT :30006 served h2-REF (now the rollback lane) - v27 (v25m mixed map, 48 GiB Grace
  prefix-KV tier, block verification) plus h1 (L2 key-sharing, vLLM #61161), the vLLM #60945 rejection-sampler
  guard (a latent out-of-bounds read that killed five card runs) and split-KV decode attention at 4 splits,
  quarantined to one request: BRRR 2K codegen C1 484.5 vs 467.5 tok/s (1.036x, -0.43 ms/step), crash-free on all
  four Card AP2 arms; rollback pair dsv41-vllm-1017-h1-REF (guard, no split).
status: experimental     # measured and gated; 48 h soak RESTARTED with the KV change 2026-10-22 18:52, CUT 2026-10-23 20:14 CDT (lane given to the AR campaign after ~25 h; that partial window was not evaluated). Soak now running on the v25m variant 2026-10-24 07:12 -> 10-26 07:12 CDT (restarted after Card GV2). Verified only on a clean 48 h soak. 2026-10-24 - the AR campaign ended, the v25m soak was cancelled by James, and lane :30006 was handed to the v26 GB300-only config (sibling recipe); this recipe documents the sidecar lane plus the kv-host-tier variant (Card KV3, results/2026-10-24-kv3-host-prefix-tier/). CORRECTED 2026-10-26 - since 2026-10-24 23:16 CDT :30006 serves THIS recipe's v25m + kv-host-tier lane (dsv41-vllm-1017-v25m-kvtier + -rtx, fail-stop watchdog enforce); the v26 GB300-only config served only ~21:30-23:16 that evening. 2026-10-25 Card BR1 (results/2026-10-26-br1-block-verification/) - block verification (rejection_sample_method block) PASS re-scored (pre-registered FAIL BR1FAIL-G0-G2b on two instrument defects, both kept), temp-1.0 C1 0.996-1.054x per class, +2.0% tokens/step, TF flips at the control floor; PROMOTED as v27 2026-10-26 04:08 CDT (CORRECTED 2026-10-26 - this comment said promotion candidate, NOT promoted). Card BR2 (results/2026-10-26-br2-k-ladder-peerbench/) - k=9 + block reads 0.79-0.92x production at C1 (k=5 stays; per-position acceptance falls past position 6), k=9 booted as an autotune hash hit; BRRR peer harness on this lane 2K/C1 466 tok/s at 5.13 tok/step, 64K prefill 46,246 tok/s. 2026-10-26 pm - the GB300-only sibling retired block verification for cause (BR3 null with a greedy drafter; BR4 PB, BR5, BR6 parity trips on top of probabilistic drafting); v27 here is unchanged and was restored and re-verified after each sibling card (last 16:36 CDT). 2026-10-26 evening - T2 + T1 + held-out BFCL on the live v27 lane PASS (results/2026-10-26-v27-t2-heldout/; quality + performance gates stamped) and the cosine R2 re-judge PASS for the v25m map (results/2026-10-26-gs-cosine-r2/). Still experimental - the 48 h soak runs to 2026-10-28 16:36 CDT, T3 not run, no temperature>0 quality instrument on v27. 2026-10-28 - h1-REF (v27 + hook-h1 L2 key-sharing + vLLM #61161 overlay) served from 2026-10-27 16:46 CDT; the vLLM #60945 guard went into it 2026-10-28 14:42; Card AP2 (results/2026-10-28-h2-splitkv-ap2/) S4 = PROMOTE-READY, S8 = NO; h2-REF PROMOTED 2026-10-28 17:22:58 CDT (James). Still experimental - no 48 h soak on any sidecar config (the 10-26 clock was broken by the H1/E1/AP/W-card dark windows), no T2/BFCL re-run on h1 or h2. 2026-10-29 - Pg61 (Garner McCloud's engine garnermccloud/dgx-station-recipes @ 8043a6811a5feda70fdfb6e827eebb2ec25c65d1 on vllm/vllm-openai:v0.31.0 + patches/garner-8043a681/ + the #61161/#60945 overlay + scripts/sidecar_watchdog_p3.py with PEER3_SPINS=1e12; results/2026-10-29-pg61-garner-engine/) PROMOTED 2026-10-29 10:14pm CDT (James); h2-REF stopped-and-kept as the rollback. Cards G0-G5 - T3 all six bars PASS (G4), headline 1.31x h2-REF per-class C1 at T=1 (G5). h2-REF gate stamps moved to notes; Pg61 stamped from the promotion log, the live check and Cards G4/G5. Still experimental - 48 h soak running to 2026-10-31 10:14pm CDT (Saturday), no temperature>0 quality instrument, prefill -8 to -17% vs h2-REF.
