      - "Compare two separately FlashInfer-tuned boots and call the difference a config effect."

limits:
  - "BLOCK VERIFICATION (Card BR1, 2026-10-25, results/2026-10-26-br1-block-verification/) acts only at temperature > 0 - vLLM af7f9488 applies it only when not is_greedy, so a temperature-0 bench cannot measure it (BR1's temp-0 window read B within noise of A on every class). The C1 gain (0.996-1.054x per class, +2.0% tokens/step) was measured at temperature 1.0 / top_p 1.0 seeded on 40 private transcript prompts per class. PROMOTED as v27 2026-10-26 04:08 CDT (CORRECTED 2026-10-26 - this limit said promotion candidate, NOT promoted). The pre-registered verdict FAILED (BR1FAIL-G0-G2b) on two instrument defects (order-sensitive env compare; a temp-0 no-op bar tighter than the controls' own r1/r2 spread) and the re-score PASSED (BR1PASS); both are kept."
  - "BLOCK VERIFICATION IS LANE-SPECIFIC - it needs probabilistic drafting and it was not clean on the Grace-only sibling (BR3 null at 0.999x tokens/step with a greedy drafter; on top of probabilistic drafting BR4 PB, BR5 and BR6 each tripped a temperature-0 parity gate, and the sibling retired it for cause). Do not copy this key to another lane without its own bracket. Sibling bundles - ../deepseek-v4.1-flash-vllm-uva-dspark/results/2026-10-26-br3-block-verification-null/, ../deepseek-v4.1-flash-vllm-uva-dspark/results/2026-10-26-br4-probabilistic-drafting/, ../deepseek-v4.1-flash-vllm-uva-dspark/results/2026-10-26-br5-block-rebracket/, ../deepseek-v4.1-flash-vllm-uva-dspark/results/2026-10-26-br6-block-g6-redesign/."
  - "v27 SERVES ON THE v25m MAP, which missed the pre-registered bring-up cosine gate (Card GV, min cos 0.99811 vs 0.999, 1 of 1,439 checks, layer 39) and passed the other 9 gates. The R2 re-judge registered in results/2026-10-26-gs-cosine-r2/ has not run (Card GS was cancelled with the soak). The 0.99906 cosine pass is the v25 static map."
  - "k > 5 LOSES on real traffic with this drafter (Card BR2, results/2026-10-26-br2-k-ladder-peerbench/) - k=9 with block verification reads 0.81-0.92x at C1 per class and 0.79x on mixed C1. Per-position acceptance shows why - marginal acceptance 0.61-0.82 through position 5 falls to 0.51-0.67 from position 7 (the checkpoint's dspark_block_size is 5), and position-1 acceptance drops too (prose .72 -> .61). k=9 only paid on padded single-stream codegen (peer harness 64K/C1 489 vs 453). BR2's controls ran sequential verification, so k is not isolated from block verification. num_speculative_tokens is NOT in the autotune hash on af7f9488 (K9 booted as a hash hit, 529 s)."
  - "KV-HOST-TIER VARIANT (Card KV3, 2026-10-24, results/2026-10-24-kv3-host-prefix-tier/) - what it does not cover. (1) The card's launcher set VLLM_SERVER_DEV_MODE=1 to reach /reset_prefix_cache for the evict-replay probe; production is the two flags without dev mode, and that exact no-dev-mode boot was not separately measured. (2) Measured on the v25m mixed map (ROWMAP=rowmap-mixed-ar-v1.json), not the static 295/89 map. (3) ~31M prefix tokens is 48 GiB / 1,656 B per hit token measured on this lane's fp8_ds_mla KV, not a portable figure. (4) Speed-neutral on the gated cells (C1 +0.19%, cold-64K TTFT +1.47%, warm-replay r2 -3.4% inside the controls' own 183.7-195.5 spread); real multi-user prefix traffic, hit rates under eviction pressure and C>1 with the tier were not measured. (5) Fidelity evidence is identical short outputs on two evict-replay probes, 12/12 gauntlet, the 954K needle and 0 errors / 0 watchdog events - no teacher-forced, GSM8K or BFCL run on the tier arm. (6) Host cost: MemAvailable min 129.8 GiB with the tier vs ~178 GiB without; the connector is a 51.54 GB /dev/shm mmap and vLLM marks KVConnectorBase_V1 experimental. (7) Upstream vllm#47890 (speculative decoding can zero CPU-tier hits) did not reproduce here - hits and loads at 7,929 and 31,629 tokens with DSpark on - but only two lengths were probed. (8) LMCache was not used: it needs the hybrid KV manager off, which this lane does not do."
  - "EXPERIMENTAL VARIANT 2026-10-23 (v25m, mixed-traffic static map; measured, not promoted on its own gates - CORRECTED 2026-10-26 - it served :30006 as v25m-kvtier 2026-10-24 23:16 -> 10-26 03:58 CDT and is the base map of v27): rowmap-mixed-ar-v1.json = top-295 per layer from cumulative decode counts of ~100k JP/DE + ~105k agent/tool tokens (GB300-only adaptive campaign), 42.5 experts moved per layer. Held-out prompts, post-60 s: mixed C1 208.9 -> 221.1 tok/s (+5.8%; JP/DE 179.5 -> 206.7 = +15%, agent 250.8 -> 246.4), mixed C4 560.4 -> 558.5 (no change). Shift protocol (in-sample prompts): JP/DE 186 -> 206.9, agent 244.3 -> 247.9. GB300 stall on the RTX during JP/DE 11.8% -> 0.5% of wall. KV unchanged (4,400,013). Greedy parity is not a usable gate on this lane: two captures of the SAME map agree 14/50 (probabilistic draft sampling + sidecar), v25 static vs v25m 15/50 = at that floor. Gates re-run 2026-10-24 (Card GV, results/2026-10-24-gv-v25m-gates/): 9/10 PASS - TF flips PASS vs v23 and vs v25, GSM8K-1319 96.82 vs 96.97, BFCL dev/held-out identical (556/600, 1018/1311), gauntlet 12/12, needle 500/500, 0 timeouts - but the bring-up cosine gate FAILS (min cos 0.99811 vs 0.999; 1 of 1,439 gated checks, layer 39; p1 0.99968 vs v25 0.99970); bar not moved, stays experimental. Same-instrument real-text C1 -2%, knee C8 -5%, C16 flat. Card GV2 (results/2026-10-24-gv2-l39-static/): layer 39 restored to the static split still fails (min 0.99831; worst check again L39 at ~0 cold share = noise); this does NOT clear v25m (its failing check had cold share 0.079) - corrected 2026-10-24 08:15. Cosine gate R2 (error / layer output, bar from 3 v25-static boots) registered before re-judging: results/2026-10-26-gs-cosine-r2/; CORRECTED 2026-10-26 - not run, Card GS was cancelled with the soak. The 48 h soak on v25m (2026-10-24 07:12 -> 10-26 07:12 CDT) was cancelled by James on 2026-10-24. results/2026-10-23-ar5-mixed-map/."
  - "Live adaptive residency on this lane is feasible but not built (2026-10-23): both expert layouts are per-expert separable (DeepGEMM MegaMoE transform of one expert == its slice of the bank; b12x prepares in place), so a hot<->cold swap needs a cross-process mailbox in the peer shm plus raw-expert reads. Ceiling measured from the GB300's stall on the RTX: ~ +13% off-domain C1, ~0 in-domain; a refit static map already took most of it."
  - "POWER: the chassis' 1,600 W budget is split between the GB300 module and the RTX card, and the module cap binds in prefill — sw_power_cap active in 89.47% of 1 s samples during a 64K prefill (incumbent 65.00%) and 85.71% in C32 8K prefill, with SM clock p50 1,980 MHz vs 2,062. Module p99 1,353 W in 64K prefill, 1,263 W in C32 decode. The pre-registered SC6 bars (<1% swcap, module <=1,190 W) are FAILED — and failed by the incumbent too, so they were mis-set for this chassis. All speed numbers here were measured under that throttling; a 240 V / uncapped-power retest is the obvious follow-up."
  - "A sidecar timeout (or a spin-limit expiry) silently drops that layer's cold-expert contribution. Production runs VLLM_EXP_PEER_SPINS=2e9 plus a fail-closed watchdog; the lane is killed rather than degraded. Anyone running this without the watchdog should use --mode report only to observe, never to serve."
  - "The rowmap must be uniform (same cold count in every layer) unless you port el8's per-layer-plan change. Our 285/99 nested map failed the pre-registered cosine bar (min 0.99885 vs 0.999, two layer-39 T=128 checks) and is not adopted — the bar sits inside that check class's tail noise, but it was pre-registered, so 295/89 serves. 285/99 also buys ~6.09M KV tokens vs 2.54M; its SPEED with the sidecar is unmeasured."
  - "Reasoning-effort mapping differs between this image and the GB300-only lane's 0909 image: af7f9488 maps low 50 / high 75 / xhigh 75 / max 100 and defaults to high; the 0909 image maps low 25 / high 50 / xhigh 75 / max 100. A client that sends 'low' gets twice the thinking budget after a move to this lane, and default-effort GSM8K answers get longer. Pin an integer effort in chat_template_kwargs if you need the old behaviour."
  - "One temp-0 GSM8K item (1304) ran to the 131,072-token cap on this arm (incumbent: stopped at 2,245 and was correct); SC5's repeat probe read 0/32 runaways at a 32K cap and 0/8 at pinned efforts. Treated as the image's effort-75 tail rather than a sidecar effect, but a client-side max_tokens remains the only real guard."
  - "Per-class speculative acceptance is NOT reported here (only the blended 2.96 tokens/step on the real-text C1 cell). The per-class numbers in this recipe are decode wall-clock, not acceptance. CORRECTED 2026-10-26 - measured at temperature 1.0 in Card BR2 (C1 tokens/step prose 2.85, structured 3.03, code 3.83, shell 3.98, tool-JSON 3.63 on arm A; per-position curves in results/2026-10-26-br2-k-ladder-peerbench/raw/per-position-curves.json)."
  - "FlashInfer tactics are live-tuned (MEGA_FI_TUNE_FILE empty): C1 varies a few percent boot to boot, and the autotuner warns that some mxfp8_gemm shapes fall back to tactic=-1. Bracket every comparison; pin a tune file if you need reproducibility more than speed."
  - "The RTX card is also the display GPU. It is hidden from containers by DGX OS without a CDI spec, the launcher refuses to start above 2,048 MiB of foreign use, and a GUI app can cost you the sidecar's headroom."
  - "vLLM v0.31.0 as the server image was measured in SC5 and NOT adopted: quality identical (TF, GSM8K 1279/1319, needle 500/500) but knee C8 read -3.8% against a -3% bar and the runaway cell (C31) tripped. It stays a candidate, not this recipe."
  - "Replay trade: agent replay r2 612.1 tok/s with replay OFF vs 480.3 ON (+27%, one rep — r1 was a wash), while TTFT at 8.2K is 0.29 s OFF vs 0.19 s ON. The serving lane runs replay ON. Do not quote the +27% as a law until it is repeated."
  - "KV is declared with --kv-cache-memory 8.5 GiB (4,400,013 tokens). That skips vLLM's memory profiling: nothing re-checks activation headroom at boot, and the measured margin is 1,395 MiB free on the GB300 at the stressed peak (1M + 131K + C16, then four co-resident 1M contexts). Vision requests and C32 prefill bursts were not in that stress. 9.5 GiB (+0.5M tokens) was declined because it would leave ~370 MiB."
  - "The launcher's EXTRA defaults to empty. A scripted relaunch that forgets EXTRA=\"--kv-cache-memory 9126805504\" serves 2,537,081 tokens with no error; check the boot's KV line."
  - "A cold ~1M-token prefill holds up the queue: a concurrent 131K prompt waited 34 s for its first token and C16 aggregate fell 1,576 -> 718 tok/s while it ran (--long-prefill-token-threshold 6144, FCFS chunked prefill). Keep 1M batch jobs off the interactive lane or accept that stall."
  - "KV-capacity routes NOT taken, by rule: KV quantization (nvfp4_ds_mla) changes numerics; moving more cold experts to the RTX card (89 -> 99/109 per layer, +3.6M/+7.3M tokens) is modeled at -5 to -11% C1. HiSparse (host-resident sparse-MLA KV) exists in this image but is not wired for DeepSeek-V4.1 or the MegaAttn backend."
  - "Boot is 527 s warm (sidecar 46-50 s of that), and the GB300-only lane is ~30 min cold if the JIT caches are missing. The image's Docker Hub tag is gone; pull by digest."

rollback:
  script: scripts/rollback-v27.sh
  summary: "bash scripts/rollback-v27.sh [--dry-run] [--from <server>] [--to <server>], run on the Station. Default pair - FROM dsv41-vllm-1017-v27-block-BOUND-REF + -rtx (v27, serving) -> TO dsv41-vllm-1017-v25m-kvtier-RETIRED-REF + -rtx (v25m-kvtier = v27 without the block key, stopped and kept). It refuses while a card runner is live; kills the fail-stop watchdog (pid file, fallback pgrep) and confirms it gone; stops FROM server (-t 60) then sidecar (-t 30) and renames both to FROM-ROLLED-BACK-<ts> (kept); starts TO-rtx and waits <= 3 min for 'serving'/'prepared 40 layers'; starts TO and waits <= 45 min for /v1/models (~8 min hash-hit); prints the KV line (expect 4,400,013); one chat smoke (reasoning_effort low) and one tool-call smoke; re-arms the watchdog from the argv captured at promotion (~/dsv41/m3/logs/promote-v27-wd-argv.txt) with --server TO and --log sidecar_watchdog.rollback.log, setsid nohup, PPID 1 checked; appends LANE-OWNER and ledger lines. Idempotent; exits 4 with NEEDS HANDS on any failure. Older fallbacks (by hand, sidecar first) - the util-0.97 pair dsv41-vllm-1017-v25-sidecar-kv4.9-KEPT (+ -rtx) undoes the KV change; dsv41-vllm-1017-v23-pinexact-RETIRED-REF is the Grace-offload v23 lane (~260 s); with no previous lane, the GB300-only sibling recipe. Watchdog fail-stop means a trip leaves the lane DOWN by design - nobody auto-starts the incumbent behind a wrong-token trip; run the script by hand after reading the watchdog log."
