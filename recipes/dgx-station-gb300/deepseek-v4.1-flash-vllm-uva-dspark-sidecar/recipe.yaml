verification:
  gates:
    schema:
      how: "python3 scripts/check_recipe.py on this recipe.yaml (jsonschema + README headings + every metric's raw file + patch sha256)"
      last_pass_utc: "2026-10-23T00:28:00Z"
      run_id: 2026-10-22-kv85
    digest:
      how: "image @sha256:3af6a45b… on BOTH GPUs; every mounted file's sha256 recorded in raw/hook-lock.txt from inside the running containers; checkpoint revision + total bytes in raw/weights-1017-receipt.txt"
      last_pass_utc: "2026-10-22T13:48:36Z"
      run_id: 2026-10-22-v25-sidecar
    health:
      how: "two-container boot: sidecar logs 'serving' before the server starts; server log shows peer mode 2 / 295-89 rowmap / fp8_ds_mla / KV line / bounded-replay line; watchdog status has trip=null and words[2]=0; scripts/soak_check.sh returns OK"
      last_pass_utc: "2026-10-22T13:55:25Z"
      run_id: 2026-10-22-v25-sidecar
      notes: "soak window RESTARTED with the KV change: 2026-10-22 18:52 -> 2026-10-24 18:52 CDT (the 06:02 window was cut by two reboots and a launch-line change); this row refers to the serving boot plus the live counter read, not the completed soak"
    quality:
      how: "SC2's 12 pre-registered gates: teacher-forced margin-weighted flips inside the same-map control floor, BFCL dev + held-out, GSM8K-1319, 500-needle, gauntlet, reasoning-effort vocabulary, image request, per-class decode wall-clock, tool emission, 20-min soak, 0 sidecar timeouts. Plus the SC0 cosine bring-up gate (min cos 0.99906, 40/40 layers)."
      last_pass_utc: "2026-10-22T05:11:00Z"
      run_id: 2026-10-22-v25-sidecar
      notes: "SC2 PASS 12/12 on arm C (295/89, replay ON). The 285/99 placement map FAILED its own cosine bar and is not used."
    performance:
      how: "bracketed same-window ladders (CTL1 incumbent -> CAND1 -> CAND2 -> CTL2 incumbent) on the 8.2K/1,024 real-text harness plus the agent-text knee, with acceptance and TTFT recorded per cell"
      last_pass_utc: "2026-10-22T05:11:00Z"
      run_id: 2026-10-22-v25-sidecar
      notes: "every pre-registered speed bar passed (knee C1 >= 198, knee C16 >= 974, sidecar C16 >= M3G +3%, 0 timeouts). Power bars were FAILED by the incumbent too — see limits."
  quality_gate:
    reference_build: "the same lane with the sidecar path replaced by the GB300's own TRT-LLM cold path (MEGA_PEER_CHECK=100000 MEGA_COLD_TRT=1) for bring-up, and the v23 Grace-offload incumbent for output quality"
    method: "teacher-forced, margin-weighted top-1 flips against a same-map floor plus a same-window incumbent arm; per-class decode wall-clock as the drafter-side gate; greedy parity and tool-call suites as pass/fail rows"
    positions: 20000
    thresholds: { cosine_min: 0.999, tf_flip_weight_max: 3.014, bfcl_delta_pt_min: -1.0, gsm8k_delta_pt_min: -1.0, per_class_decode_delta_min: -3.0 }
    never:
      - "Treat a sidecar timeout as a performance event. It is a correctness bug: the cold-expert add is skipped and the tokens are wrong."
      - "Promote on throughput without the cosine gate and the 0-timeout soak."
      - "Compare two separately FlashInfer-tuned boots and call the difference a config effect."

limits:
  - "EXPERIMENTAL VARIANT 2026-10-23 (v25m, mixed-traffic static map; measured, not promoted): rowmap-mixed-ar-v1.json = top-295 per layer from cumulative decode counts of ~100k JP/DE + ~105k agent/tool tokens (GB300-only adaptive campaign), 42.5 experts moved per layer. Held-out prompts, post-60 s: mixed C1 208.9 -> 221.1 tok/s (+5.8%; JP/DE 179.5 -> 206.7 = +15%, agent 250.8 -> 246.4), mixed C4 560.4 -> 558.5 (no change). Shift protocol (in-sample prompts): JP/DE 186 -> 206.9, agent 244.3 -> 247.9. GB300 stall on the RTX during JP/DE 11.8% -> 0.5% of wall. KV unchanged (4,400,013). Greedy parity is not a usable gate on this lane: two captures of the SAME map agree 14/50 (probabilistic draft sampling + sidecar), v25 static vs v25m 15/50 = at that floor. Gates re-run 2026-10-24 (Card GV, results/2026-10-24-gv-v25m-gates/): 9/10 PASS - TF flips PASS vs v23 and vs v25, GSM8K-1319 96.82 vs 96.97, BFCL dev/held-out identical (556/600, 1018/1311), gauntlet 12/12, needle 500/500, 0 timeouts - but the bring-up cosine gate FAILS (min cos 0.99811 vs 0.999; 1 of 1,439 gated checks, layer 39; p1 0.99968 vs v25 0.99970); bar not moved, stays experimental. Same-instrument real-text C1 -2%, knee C8 -5%, C16 flat. Card GV2 (results/2026-10-24-gv2-l39-static/): layer 39 restored to the static split still fails (min 0.99831; worst check again L39 at ~0 cold share = noise); this does NOT clear v25m (its failing check had cold share 0.079) - corrected 2026-10-24 08:15. Cosine gate R2 (error / layer output, bar from 3 v25-static boots) registered before re-judging: results/2026-10-26-gs-cosine-r2/, runs 2026-10-26 after the soak. 48 h soak on v25m restarted 2026-10-24 07:12 -> 10-26 07:12 CDT. results/2026-10-23-ar5-mixed-map/."
  - "Live adaptive residency on this lane is feasible but not built (2026-10-23): both expert layouts are per-expert separable (DeepGEMM MegaMoE transform of one expert == its slice of the bank; b12x prepares in place), so a hot<->cold swap needs a cross-process mailbox in the peer shm plus raw-expert reads. Ceiling measured from the GB300's stall on the RTX: ~ +13% off-domain C1, ~0 in-domain; a refit static map already took most of it."
  - "POWER: the chassis' 1,600 W budget is split between the GB300 module and the RTX card, and the module cap binds in prefill — sw_power_cap active in 89.47% of 1 s samples during a 64K prefill (incumbent 65.00%) and 85.71% in C32 8K prefill, with SM clock p50 1,980 MHz vs 2,062. Module p99 1,353 W in 64K prefill, 1,263 W in C32 decode. The pre-registered SC6 bars (<1% swcap, module <=1,190 W) are FAILED — and failed by the incumbent too, so they were mis-set for this chassis. All speed numbers here were measured under that throttling; a 240 V / uncapped-power retest is the obvious follow-up."
  - "A sidecar timeout (or a spin-limit expiry) silently drops that layer's cold-expert contribution. Production runs VLLM_EXP_PEER_SPINS=2e9 plus a fail-closed watchdog; the lane is killed rather than degraded. Anyone running this without the watchdog should use --mode report only to observe, never to serve."
  - "The rowmap must be uniform (same cold count in every layer) unless you port el8's per-layer-plan change. Our 285/99 nested map failed the pre-registered cosine bar (min 0.99885 vs 0.999, two layer-39 T=128 checks) and is not adopted — the bar sits inside that check class's tail noise, but it was pre-registered, so 295/89 serves. 285/99 also buys ~6.09M KV tokens vs 2.54M; its SPEED with the sidecar is unmeasured."
  - "Reasoning-effort mapping differs between this image and the GB300-only lane's 0909 image: af7f9488 maps low 50 / high 75 / xhigh 75 / max 100 and defaults to high; the 0909 image maps low 25 / high 50 / xhigh 75 / max 100. A client that sends 'low' gets twice the thinking budget after a move to this lane, and default-effort GSM8K answers get longer. Pin an integer effort in chat_template_kwargs if you need the old behaviour."
  - "One temp-0 GSM8K item (1304) ran to the 131,072-token cap on this arm (incumbent: stopped at 2,245 and was correct); SC5's repeat probe read 0/32 runaways at a 32K cap and 0/8 at pinned efforts. Treated as the image's effort-75 tail rather than a sidecar effect, but a client-side max_tokens remains the only real guard."
  - "Per-class speculative acceptance is NOT reported here (only the blended 2.96 tokens/step on the real-text C1 cell). The per-class numbers in this recipe are decode wall-clock, not acceptance."
  - "FlashInfer tactics are live-tuned (MEGA_FI_TUNE_FILE empty): C1 varies a few percent boot to boot, and the autotuner warns that some mxfp8_gemm shapes fall back to tactic=-1. Bracket every comparison; pin a tune file if you need reproducibility more than speed."
  - "The RTX card is also the display GPU. It is hidden from containers by DGX OS without a CDI spec, the launcher refuses to start above 2,048 MiB of foreign use, and a GUI app can cost you the sidecar's headroom."
  - "vLLM v0.31.0 as the server image was measured in SC5 and NOT adopted: quality identical (TF, GSM8K 1279/1319, needle 500/500) but knee C8 read -3.8% against a -3% bar and the runaway cell (C31) tripped. It stays a candidate, not this recipe."
  - "Replay trade: agent replay r2 612.1 tok/s with replay OFF vs 480.3 ON (+27%, one rep — r1 was a wash), while TTFT at 8.2K is 0.29 s OFF vs 0.19 s ON. The serving lane runs replay ON. Do not quote the +27% as a law until it is repeated."
  - "KV is declared with --kv-cache-memory 8.5 GiB (4,400,013 tokens). That skips vLLM's memory profiling: nothing re-checks activation headroom at boot, and the measured margin is 1,395 MiB free on the GB300 at the stressed peak (1M + 131K + C16, then four co-resident 1M contexts). Vision requests and C32 prefill bursts were not in that stress. 9.5 GiB (+0.5M tokens) was declined because it would leave ~370 MiB."
  - "The launcher's EXTRA defaults to empty. A scripted relaunch that forgets EXTRA=\"--kv-cache-memory 9126805504\" serves 2,537,081 tokens with no error; check the boot's KV line."
  - "A cold ~1M-token prefill holds up the queue: a concurrent 131K prompt waited 34 s for its first token and C16 aggregate fell 1,576 -> 718 tok/s while it ran (--long-prefill-token-threshold 6144, FCFS chunked prefill). Keep 1M batch jobs off the interactive lane or accept that stall."
  - "KV-capacity routes NOT taken, by rule: KV quantization (nvfp4_ds_mla) changes numerics; moving more cold experts to the RTX card (89 -> 99/109 per layer, +3.6M/+7.3M tokens) is modeled at -5 to -11% C1. HiSparse (host-resident sparse-MLA KV) exists in this image but is not wired for DeepSeek-V4.1 or the MegaAttn backend."
  - "Boot is 527 s warm (sidecar 46-50 s of that), and the GB300-only lane is ~30 min cold if the JIT caches are missing. The image's Docker Hub tag is gone; pull by digest."

rollback:
  script: scripts/launch-sidecar.sh
  summary: "The lane is two containers plus a watchdog. Stop order matters: kill the watchdog, `bash scripts/launch-sidecar.sh stop` (server first, sidecar second), then `docker start` the previous lane container — on the reference box that is dsv41-vllm-1017-v23-pinexact-RETIRED-REF, which binds in ~260 s. To undo only the KV change, start the kept util-0.97 pair (dsv41-vllm-1017-v25-sidecar-kv4.9-KEPT + -rtx, sidecar first); it bound in ~7 min. If you have no previous lane, the GB300-only recipe in this repo is the fallback (same checkpoint, Grace offload, no RTX card). Watchdog fail-stop means a trip leaves the lane DOWN by design: nobody auto-starts the incumbent behind a wrong-token trip."

