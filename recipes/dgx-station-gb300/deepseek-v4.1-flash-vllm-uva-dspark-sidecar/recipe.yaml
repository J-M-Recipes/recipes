  - "LATENT OUT-OF-BOUNDS READ IN v27 AND EARLIER (fixed in h1-REF 2026-10-28 14:42 and in h2-REF). vLLM af7f9488's _compute_local_residual_mass_kernel (spec_decode/rejection_sampler_utils.py, block verification) reads draft_sampled[logit_idx + 1]; its guard compares against the CONFIGURED speculative steps (5), but this lane's k-schedule runs k=3 at 5-32 requests, so on a full 32-request decode step (32 x 4 = 128 logits) the last program reads one int32 past the 512-byte draft_sampled tensor. Usually silent (that row is never used). When the tensor ends exactly at a torch segment end in front of an unmapped hole, it is FAULT_PDE VIRT_READ -> Xid 31 -> CUDA illegal memory access -> EngineCore death. It killed five card runs (AP S8, AP S4, W5 S0, W6 S2, W7 S3) and was first blamed on the split-KV build; Card W11 reproduced it with split OFF and its owner trace placed the fault 0 B past the end of a 2 MiB segment. Fix - vLLM #60945 (merged 2026-10-12, 830 commits after af7f9488), 3 lines, bit-identical (Card W12 - 100/100 kernel A/B, sanitizer 20 -> 0 invalid reads). The rollback pair v27-block-BOUND-REF and older v27 launches do NOT have it; anyone running v27 with this k-schedule and block verification should apply patches/vllm-60945-rejection-sampler-guard.patch (on the #61161 file) or the equivalent 3 lines on the stock file."
