schema: jm-recipe/v1
id: dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark-sidecar
title: DeepSeek-V4.1-Flash at 1M context on a DGX Station GB300 with an RTX PRO 6000 expert sidecar
summary: >
  The 510 GB DeepSeek-V4.1-Flash-1017 checkpoint does not fit one GB300's 250 GiB of HBM, and the
  obvious fallback — streaming cold experts from pinned Grace over NVLink-C2C — puts a serial ~350 GB/s
  read on the critical path of every decode step. This recipe keeps the hot experts in HBM (295 per layer,
  DeepGEMM MegaMoE via original-el8's hook) and moves the other 89 to the RTX PRO 6000 Max-Q in the same
  chassis, where they are *computed* rather than read: only activations cross PCIe, through one /dev/shm
  buffer with a device-side sequence counter (original-el8's peer tier-2 protocol, b12x kernels). The full
  1,048,576-token context is kept. Measured same-window against the Grace-offload incumbent on the same box:
  C1 real-text decode 279.5 vs 187.5 tok/s (+49%), C16 1,577 vs 524 (3.0x), C32 2,400 vs 926 (2.6x), TTFT
  at 8.2K 0.19 vs 0.66 s, 1M-token prompt first token 33.2 vs 81.4 s, and 0 sidecar timeouts across every
  window. Quality is unchanged within the measured floors (TF margin-weighted flips inside a same-map
  control, GSM8K-1319 96.97 = incumbent, needle 500/500, gauntlet 12/12, BFCL dev 92.67 vs 92.33) and the
  per-class decode gate passes 20/20 cells. A sidecar timeout would silently drop a layer's cold-expert add,
  so the lane runs an effectively-infinite spin limit plus a fail-closed watchdog (trip = kill), and the
  bring-up gate is a per-layer cosine check against the GB300's own cold path (min 0.99906, 40/40 layers).
  Cost of the win, stated plainly: the RTX card drives the display and is hidden from containers by DGX OS
  until a CDI spec is installed, the chassis' shared power budget throttles prefill (89% of 1-second
  samples at the module cap during 64K prefill — the incumbent throttles too), and one more process
  (sidecar) must be alive for the lane to be correct. The KV pool is declared, not inferred:
  --kv-cache-memory 8.5 GiB gives 4,400,013 tokens (4.20x one 1M request, +73% over util 0.97), stress-tested
  with four ~1M contexts resident at once (KV peak 75%, 0 preemptions, 0 timeouts) and no decode cost.
status: experimental     # measured and gated; 48 h soak RESTARTED with the KV change 2026-10-22 18:52, CUT 2026-10-23 20:14 CDT (lane given to the AR campaign after ~25 h; that partial window was not evaluated). Soak now running on the v25m variant 2026-10-24 07:12 -> 10-26 07:12 CDT (restarted after Card GV2). Verified only on a clean 48 h soak.
owners: [jmeadlock, milo]
updated: "2026-10-24"
tags: [deepseek-v4.1-flash, mxfp4, vllm, expert-sidecar, rtx-pro-6000, pcie, dspark, speculative-decoding, 1m-context, agent]

model:
  name: DeepSeek-V4.1-Flash-1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  quantization: as shipped — routed experts MXFP4 (I8 + E8M0 block scales), attention and Engram FP8. Nothing re-quantized; the sidecar reads expert tensors straight out of the shards.
  draft:
    repo: in-checkpoint (mtp.{0,1,2}.* tensors, 97 params)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
    method: DSpark, num_speculative_tokens=5, num_speculative_tokens_per_batch_size=[[1,4,5],[5,8,3],[9,32,3]], draft_sample_method=probabilistic (launcher default; SC4 would re-tune the k schedule with the sidecar and was deliberately not run this round)

hardware:
  profile: hardware/dgx-station-gb300-rtx6000.yaml
  nominal: { gpu_memory_gb: 288, sidecar_gpu_memory_gb: 96, host_memory_gb: 496 }
  observed:
    gpu: NVIDIA GB300 (compute) + NVIDIA RTX PRO 6000 Blackwell Max-Q (expert sidecar)
    driver: "595.91.07"
    cuda: "13.2 (host driver; container runtime 13.0.2)"
    gpu_memory_visible_gib: 250.7
    sidecar_gpu_memory_visible_gib: 95.6
    host_memory_gib: 494.5
    os: Ubuntu 24.04.5 LTS
    kernel: 7.0.0-1019-nvidia-64k
    snapshot: results/2026-10-22-v25-sidecar/system.json
  required_settings:
    - "A CDI spec must expose the RTX PRO 6000 to containers (nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml; enable the cdi feature in daemon.json only if your Docker needs it). DGX OS's /usr/libexec/dgx-desktop-docker-gpus.sh deliberately hides the VGA-class card from --gpus; without CDI the sidecar container starts blind."
    - "The RTX card also drives the display/JetKVM; the launcher refuses to start if it already holds >=2,048 MiB. No GUI GPU apps while the lane runs."
    - "Checkpoint on local NVMe. The sidecar maps expert tensors per layer at boot; from a network share the sidecar's 45 s prep turns into minutes."
    - "Persistent JIT caches (/root/.cache/vllm, /root/.cache/flashinfer, /root/.dj, /root/.tilelang, /root/.triton, plus b12x's own cache) or every boot re-tunes: warm boot is 527 s, cold autotune is much longer."
    - "Do NOT set CUDA_VISIBLE_DEVICES; both GPUs are pinned by UUID."

runtime:
  engine: vLLM
  engine_version: 0.30.1rc1.dev245+gaf7f9488c
  engine_commit: af7f9488c
  container:
    image: vllm/vllm-openai:nightly-af7f9488c2210d67e1033ecdc845b087ee7fe92b
    digest: sha256:3af6a45b060d681aa6254200f87859d1bb3c1f962afb3d15540b4b31d4a41063
    base_image: "vllm/vllm-openai nightly af7f9488 (upstream, created 2026-10; the Docker Hub tag has since been rotated off — pull by digest or keep a docker save copy). SAME image on both GPUs: the GB300 runs vllm serve, the RTX runs original-el8's peer server."
  key_libraries:
    torch: 2.13.0+cu130
    flashinfer: "0.7.0"
    triton: 3.7.1
  patches:
    - path: patches/peer-server2-local.patch
      sha256: 7460a5cf55f0fad0c0ebdaad63e272bfb42bd53798b1ffee948d475a870eded5
      purpose: "original-el8 peer_server2.py @87af662 -> the sidecar container's /sc/peer_server2_local.py. Four hunks are path-only (hook, model, b12x, log dirs); the fifth makes the sidecar acknowledge the completed-sequence counter BEFORE its stats bookkeeping, instead of writing a stats file between the result and the ack."

launch:
  script: scripts/launch-sidecar.sh
  command: "GB300_UUID=$(nvidia-smi -L | awk -F'[( )]' '/GB300/{print $2}') RTX_UUID=$(nvidia-smi -L | awk -F'[( )]' '/RTX PRO 6000/{print $2}') bash scripts/launch-sidecar.sh sidecar && GB300_UUID=... RTX_UUID=... EXTRA=\"--kv-cache-memory 9126805504\" bash scripts/launch-sidecar.sh server   (two steps, in this order: the GB300 server refuses to start unless the sidecar log says 'serving'; see README for the full env list and the bring-up gate)"
  health: "curl -fs http://localhost:30006/v1/models ; the server log must contain 'MEGA_PEER patched ... (peer mode 2, check 0)', 'MEGA_PEER layer 0 ... 295 hot experts in MegaMoE, 89 cold on the host; peer mode 2', 'Using DeepSeek's fp8_ds_mla KV cache format', 'reserved 8.5 GiB memory for KV Cache as specified by kv_cache_memory_bytes config', 'GPU KV cache size: 4,400,013 tokens ... 4.20x' (2,537,081 / 2.42x means EXTRA was dropped and util 0.97 sized the pool), and 'Decoder SWA bounded replay'; the sidecar log must say 'prepared 40 layers', 'captured 560 graphs', 'serving'; RTX memory.used settles near 66,213 MiB."
  warmup: "scripts/soak_check.sh <ssh-host> <server-container> gives one health reading (watchdog status, timeouts, sidecar container, /v1/models). First request of each shape pays a few seconds of JIT. The 64K cold-prefill figure must be measured cold — with prefix caching on, a second identical prompt is a cache hit."
  notable_flags:
    - "VARIANT v25m mixed-traffic map (EXPERIMENTAL, 2026-10-23) - identical launch with ROWMAP=rowmap-mixed-ar-v1.json for BOTH steps (sidecar --rowmap and server MEGA_ROWMAP); the map file and its fitter are in results/2026-10-23-ar5-mixed-map/. No code change."
    - "TWO CONTAINERS: <name> on the GB300 (vllm serve) and <name>-rtx on the RTX card (peer server). Both must be up; the watchdog treats a dead sidecar as fatal, not degraded."
    - "MEGA_PEER=2 selects original-el8's peer tier 2 (b12x); MEGA_FUSED_SEND=2 and VLLM_EXP_PEER2_SMALL=64 must match on both sides. MEGA_COLD_TRT=0 and MEGA_PEER_CHECK=0 in production — cold weights are NOT resident on the GB300, so any MoE call that falls back to the Grace path raises instead of computing."
    - "VLLM_EXP_PEER_SPINS=2000000000 (el8 default 2e7). On spin expiry the hook SKIPS the cold-expert add and keeps emitting tokens: wrong output, not an error. Keep it effectively infinite and let the watchdog kill the lane."
    - "The rowmap is uniform (295 hot / 89 cold on every one of the 40 MoE layers). The stock peer server builds ONE weight plan, one tune and one scratch set from layer 0, so a non-uniform map is not supported without the per-layer-plan change that el8's MiMo port shows."
    - "Overlay: vllm#58132 decoder bounded replay, five files bind-mounted over dist-packages (REPLAY_OVERLAY=1). REPLAY_OVERLAY=0 disables half of it — stock af7f9488 still runs the KV-side replay, so the fully-off arm is the overlay plus --no-swa-bounded-replay (the 'C-off' arm in the receipts)."
    - "KV pool DECLARED: EXTRA=\"--kv-cache-memory 9126805504\" (8.5 GiB) -> 4,400,013 tokens, 4.20x at 1M. It skips vLLM's memory profiling, so --gpu-memory-utilization no longer sizes anything. The launcher's EXTRA defaults to empty: a relaunch without it silently serves 2,537,081 tokens. docker start of the existing container keeps it. 9.5 GiB was declined: 1,395 MiB free on the GB300 at the stressed peak would become ~370 MiB."
    - "32 sequences, util 0.97 (inert once --kv-cache-memory is set), 1M context, fp8_ds_mla KV; DSpark k=5 at 1-4 streams, k=3 at 5-8 and 9-32. Capture sizes are TOKEN counts: the 128-entry list covers every k-segment up to 32 sequences."
    - "MEGA_FI_TUNE_FILE is intentionally empty: FlashInfer live-tunes at boot, so boot-to-boot C1 moves a few percent. Never compare two separately tuned boots; bracket with a control on each side (the receipts do)."

