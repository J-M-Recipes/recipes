model:
  name: DeepSeek-V4.1-Flash-1017
  params: 552B backbone (MoE, 384 routed + 1 shared expert, 6 active; 8B activated per token in prefill / 16B in decode) + 196B Engram
  repo: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
  quantization: as shipped — routed experts MXFP4 (I8 + E8M0 block scales), attention and Engram FP8. Nothing re-quantized; the sidecar reads expert tensors straight out of the shards.
  draft:
    repo: in-checkpoint (mtp.{0,1,2}.* tensors, 97 params)
    revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
    method: DSpark, num_speculative_tokens=5, num_speculative_tokens_per_batch_size=[[1,4,5],[5,8,3],[9,32,3]], draft_sample_method=probabilistic (launcher default; SC4 would re-tune the k schedule with the sidecar and was deliberately not run this round; 2026-10-25 Card BR2 measured k=9 with block verification at 0.79-0.92x on real traffic, so k=5 stays; v27 adds rejection_sample_method=block; h1/h2 keep the same drafter and k-schedule - the k=3 bands at 5-32 requests are what exposed the #60945 out-of-bounds read; Pg61 (2026-10-29) keeps the same spec config and adds Garner's copy/suffix drafting and fused drafter tails, with the vLLM #61161 seed mix ported into them)

hardware:
  profile: hardware/dgx-station-gb300-rtx6000.yaml
  nominal: { gpu_memory_gb: 288, sidecar_gpu_memory_gb: 96, host_memory_gb: 496 }
  observed:
    gpu: NVIDIA GB300 (compute) + NVIDIA RTX PRO 6000 Blackwell Max-Q (expert sidecar)
    driver: "595.91.07"
    cuda: "13.2 (host driver; container runtime 13.0.2)"
    gpu_memory_visible_gib: 250.7
    sidecar_gpu_memory_visible_gib: 95.6
    host_memory_gib: 494.5
    os: Ubuntu 24.04.5 LTS
    kernel: 7.0.0-1019-nvidia-64k
    snapshot: results/2026-10-22-v25-sidecar/system.json
  required_settings:
    - "A CDI spec must expose the RTX PRO 6000 to containers (nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml; enable the cdi feature in daemon.json only if your Docker needs it). DGX OS's /usr/libexec/dgx-desktop-docker-gpus.sh deliberately hides the VGA-class card from --gpus; without CDI the sidecar container starts blind."
    - "The RTX card also drives the display/JetKVM; the launcher refuses to start if it already holds >=2,048 MiB. No GUI GPU apps while the lane runs."
    - "Checkpoint on local NVMe. The sidecar maps expert tensors per layer at boot; from a network share the sidecar's 45 s prep turns into minutes."
    - "Persistent JIT caches (/root/.cache/vllm, /root/.cache/flashinfer, /root/.dj, /root/.tilelang, /root/.triton, plus b12x's own cache) or every boot re-tunes: warm boot is 527 s, cold autotune is much longer."
    - "Do NOT set CUDA_VISIBLE_DEVICES; both GPUs are pinned by UUID."

runtime:
  engine: vLLM
  engine_version: 0.31.0
  engine_commit: db9527a46873454610df6dbedf79a36d6bf1a7f6
  container:
    image: vllm/vllm-openai:v0.31.0
    digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    base_image: "Pg61 (serving since 2026-10-29) - stock pullable release vllm/vllm-openai:v0.31.0 (VLLM_BUILD_COMMIT db9527a4, release-v2 build 7746); repo digest == image id on the reference box; SAME image on both GPUs (ds41 = vllm serve on the GB300, ds41-sidecar = Garner's peer server on the RTX); no image is built - Garner's tree, our patches and the overlay are bind-mounted by his serve.sh. h2-REF ROLLBACK LANE and every release before it - vllm/vllm-openai nightly af7f9488 (upstream, created 2026-10; the Docker Hub tag has since been rotated off — pull by digest or keep a docker save copy). SAME image on both GPUs: the GB300 runs vllm serve, the RTX runs original-el8's peer server."
  key_libraries:
    garner_engine: "garnermccloud/dgx-station-recipes 8043a6811a5feda70fdfb6e827eebb2ec25c65d1, deepseek-v4.1-flash/ (MIT) - the Pg61 engine (serve.sh, 29-component DS41_FASTPATH of which 24 run, peer tier v3, MegaMoE fork, rowmap-mix-v1-h255); not vendored, launch-pg61.sh build refuses any other HEAD"
    vllm: "0.31.0 (VLLM_BUILD_COMMIT db9527a46873454610df6dbedf79a36d6bf1a7f6) for Pg61; torch/FlashInfer/triton of this image were not recorded in this round"
    libw6mk: "sha256 b54168223847560bd58974c5586ec3eba183136b18bf198a3842e5df53e617b6 - Garner's w6mk.cu + patches/garner-8043a681/05, rebuilt by launch-pg61.sh build (nvcc sm_103a in the image); in-container at the cutover"
    pg61_overlay: "gumbel.py sha1 6eac3e13 (sha256 ee5072d2) + spec_decode/rejection_sampler_utils.py sha1 edc8f8f4 (sha256 2d43d513) = the files h2-REF mounts, rebuilt from patches/vllm-61161 + vllm-60945 on v0.31.0 stock (results/2026-10-29-pg61-garner-engine/overlay-desk-check.txt)"
    torch_h2ref_rollback: 2.13.0+cu130 (af7f9488 image)
    flashinfer_h2ref_rollback: "0.7.0 (af7f9488 image)"
    triton_h2ref_rollback: 3.7.1 (af7f9488 image)
    flashmla_splitkv_side: "h2-REF rollback lane only - _flashmla_splitkv_C.abi3.so sha256 744a9de89060730eecbb7c4c249dedc36f3dbfb3854de17299780b66cb90e983 (FlashMLA 0eee43b + PR #25 + 3 patches; h2 only; the image _flashmla_C df2cdd1c stays)"
  patches:
    - path: patches/peer-server2-local.patch
      sha256: 7460a5cf55f0fad0c0ebdaad63e272bfb42bd53798b1ffee948d475a870eded5
      purpose: "original-el8 peer_server2.py @87af662 -> the sidecar container's /sc/peer_server2_local.py. Four hunks are path-only (hook, model, b12x, log dirs); the fifth makes the sidecar acknowledge the completed-sequence counter BEFORE its stats bookkeeping, instead of writing a stats file between the result and the ack."
    - path: patches/hook-h1-l2-key-sharing.patch
      sha256: 8b0edd5b6fcf1fc0abbdfb7b733b8232befedbb623737c7c0f7fbbda7f5d9ba0
      purpose: "h1/h2. el8 hook @87af662 mega_peer_hook.py (sha256 be50bdc1, as in hook-lock.txt) -> e181c58c, plus new attn_share.py (fd44715c): L2 attention/indexer key-sharing (MEGA_SHARE_TOPK=2, MEGA_POS_I32_ONCE=1; MEGA_L2_VERIFY=1 re-checks every shared table with torch.equal). Card H1 - bit-identical, -0.117 ms/step vs control mean (SUBBAR vs its -0.10 bar on min(ctrl)); promoted as h1-REF 2026-10-27."
    - path: patches/vllm-61161-block-verification-fresh-draws.patch
      sha256: 16897c2a603405246eb16a4926ff5419048a9e5f7cf47a8862d8f6227cbd56f6
      purpose: "h1/h2. Backport of vLLM #61161 onto af7f9488 (gumbel.py, spec_decode/rejection_sampler_utils.py, dflash2/speculator.py), bind-mounted: block verification draws fresh randoms per speculative step instead of reusing one (removes a temp>0 bias; inert at T=0). Result shas ee5072d2 / 42c5e8a0 / 4aad3ed1. Pg61 (2026-10-29) - the same patch on v0.31.0's stock files (sha1-identical to af7f9488's) builds its gumbel.py overlay file."
    - path: patches/vllm-60945-rejection-sampler-guard.patch
      sha256: 66effb5195a27bd3637328b087886e95fc939a9f416647cc4dfeb09c51cfa2ab
      purpose: "h2 (and h1 since 2026-10-28 14:42 CDT). vLLM #60945 (merged 2026-10-12, absent from af7f9488) applied on top of the #61161 file - 3 lines at the top of _compute_local_residual_mass_kernel: return when logit_idx + 1 >= num_programs. Without it the kernel reads draft_sampled[num_logits] (4 B past a 512 B tensor at 32 requests x k=3); CUDA illegal address when that tensor ends a torch segment. rejection_sampler_utils.py 42c5e8a0 -> 2d43d513; bit-identical (Card W12: 100/100 kernel A/B, compute-sanitizer 20 -> 0 invalid reads). Pg61 (2026-10-29) - mounted again (sha256 2d43d513 = sha1 edc8f8f4) over v0.31.0, where the unguarded read killed both Card G1 arms and four bisect arms at C32; the guard alone fixed it (Card G1f V1)."
    - path: patches/vllm-57711-splitkv-overlay-on-af7f9488.patch
      sha256: 4682f46573f05fbe60e1541aab9bffd95fdc5873af3bc7ef00ccd0334c5da173
      purpose: "h2. Split-KV MegaAttn decode, derived from vLLM #57711 (closed, unmerged), against af7f9488's flash_mla_mega_attn.py (a8be566e -> 9946e6ee) plus new mega_splitkv_combine.py (97c67176): calls the SIDE op _flashmla_splitkv_C only on pure-decode steps with num_decodes <= MAX_REQS, s_q in the SQ allow-list and s_q <= MAX_TOKENS; compress_ratio != 0 gate (SWA layers stay unsplit); STRICT fails closed; TRACE logs one line per distinct gate decision. Everything else runs the image's own _flashmla_C."
    - path: patches/flashmla-splitkv/00-flashmla-pr25-on-0eee43b.patch
      sha256: 893a42cf2cfad231549a72568171659655642c28abe41bf460eaf171dbf6d233
      purpose: "h2 side extension, step 0. vllm-project/FlashMLA PR #25 (split-KV mega decode, mega_num_splits + partial accumulators) on FlashMLA 0eee43b12f034b657133cf2afca6a72ebb6efccf (CUTLASS 147f5673). Unmerged upstream."
    - path: patches/flashmla-splitkv/01-splitkv-namespace.patch
      sha256: 63863cef2505d9d02a71115bc769a11cf75fb40dcfecec8f9997a71fbda70a20
      purpose: "h2 side extension, step 1. Torch library namespace _flashmla_C -> _flashmla_splitkv_C and PyInit__flashmla_splitkv_C, so the side .so loads next to the image's _flashmla_C (same-namespace loading segfaults)."
    - path: patches/flashmla-splitkv/02-pr25-shape-guards.patch
      sha256: 696232a04e07d13cc11aa21731600de2c9c5596d7dc001ccc993a1f28597cb2f
      purpose: "h2 side extension, step 2. Guards PR #25 omits: partials fp32, on q's device, exactly [splits,s_q,h_q,d_v] / [splits,s_q,h_q], contiguous per split, non-overlapping stride(0) within uint32, splits >= 1."
    - path: patches/flashmla-splitkv/03-nan-safe-partial-store.patch
      sha256: 6371761826ceec84ed193fdd837e8f63e269c9efe0479f413cc29fa40d0c6e7a
      purpose: "h2 side extension, step 3. An empty split stores 0 instead of 0*NaN. Built in the image toolchain (cmake, compute_100f/sm_100f, hidden visibility, -Wl,-Bsymbolic) -> _flashmla_splitkv_C.abi3.so sha256 744a9de8 on the reference box; build settings in results/2026-10-28-h2-splitkv-ap2/side-extension/."
    - path: patches/garner-8043a681/01-policy-hooks-serve.patch
      sha256: c130dcb2889dee9daa69a1299ee27a354708847f7c9eec86b1648f2794d84991
      purpose: "Pg61. Garner 8043a681 serve/serve.sh - five no-op-unless-set policy hooks - DS41_NO_KEY=1 (no API key file), DS41_ATTN_CFG (unset = no --attention-config, i.e. no MXFP4 indexer K / sparse logits), DS41_GEN_OVERRIDE (unset = no forced temperature 1.0 / top_p 0.95), DS41_EFFORT_DEFAULT=0 (no reasoning_effort default), DS41_PEER3_SPINS (forwards PEER3_SPINS into the server container). Result sha1 212d2a03 == the serving build tree."
    - path: patches/garner-8043a681/02-policy-hooks-recipe-env.patch
      sha256: 4e0f88b8c5384aa9a38af358a1c9ccac6137ccbba4f594df4ad92d8550cf5885
      purpose: "Pg61. Garner 8043a681 config/recipe.env - DS41_FASTPATH_COMPONENTS_OVERRIDE; Pg61 runs 24 of 29 components (drops ds41_sampling, ds41_stop = sampling policy; w8oproj, lowb_aux, tail_drafthead_mxfp8 = numerics-changing by design). Result sha1 71d39119."
    - path: patches/garner-8043a681/03-61161-w5-markov.patch
      sha256: 5ed4abaf6451a9c5b4081cb905fe9116a87038a95f4b72acbe9e4a5c0825bc83
      purpose: "Pg61. vLLM #61161 spec_step_seed (seed ^ (step << 32)) in Garner's fused Triton draft sampler fastpath/w5_markov.py; without it block verification + probabilistic drafting reuse a rejected draw at temperature > 0 (biased marginal). Card G3 - equal to production's eager draw at every step (120/120 per step), stock only at step 0; T=0 identical. Result sha1 62357c0b."
    - path: patches/garner-8043a681/04-61161-w5-markov-gemv.patch
      sha256: fc4a26e001a75824c6a74145dd61769001b7c5da2213d405f5f31eb942557f62
      purpose: "Pg61. The same #61161 seed mix in fastpath/w5_markov_gemv.py. Result sha1 ede5fd52."
    - path: patches/garner-8043a681/05-61161-w6mk.patch
      sha256: 379024a52da444f83aad974d3a68ee066226ed3f212c5dd58618ed6138035a42
      purpose: "Pg61. The same #61161 seed mix in kernels/w6-moe/markov/w6mk.cu, rebuilt to fastpath/libw6mk.so by launch-pg61.sh build (sha256 b5416822 in the serving container). Card G3 (hand build b072ee09) - 30/30 per step vs stock 30/0/0/0/0. Result sha1 a17b2ba2."

launch:
  script: scripts/launch-pg61.sh
