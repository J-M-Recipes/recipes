verification:
  quality_gate:
    reference_build: V1 eager baseline comparators v1e/v1g
    method: 'Current evidence is diagnostic: sc11 and sc13 report zero teacher-forced prefill/logprob deltas and sc13g greedy
      output matches 20/20 prompts, but the original tf_decode metric is not a formal noninferiority gate because common-prefix
      censoring, missing-piece handling, null logprob handling, category coverage, and statistical floor are incomplete.'
    positions: 51299
    floor_run_id: 2026-09-06-round4-decode
    never:
    - Do not promote to verified from tf_decode.py metric_pass alone.
    - Do not use MTP greedy/logprob prefill parity as a decode gate; sc13g-MTP only matched 9/20 greedy outputs.
  gates:
    schema:
      how: 'Local schema/checker must pass: .venv/bin/python scripts/check_recipe.py recipes/dgx-station-gb300/glm-5.3-nvfp4-uva-slot-cache/recipe.yaml.'
    digest:
      how: Local Docker image ID (not registry manifest digest) sha256:61fc... imported from sanitized inspect fields; command contained no API key,
        env list was sanitized and only shows non-secret flags. Model revision is intended from HF API/prior SHA; local all-file
        identity is not verified.
      run_id: 2026-09-06-v1g-campaign-eager
      notes: Inspect provenance lives in results/*/container-inspect-sanitized.json.
    health:
      how: scripts/health-check.sh is HTTP-only and verifies /health plus served model from /v1/models; remote readiness lines
        SC13G_READY/SC13G_MTP_READY are imported evidence, not a local live test.
      run_id: 2026-09-06-imported-remote-evidence
    quality:
      how: Measured prefill parity and diagnostic greedy/decode evidence only; formal decode noninferiority is not established by the two-run repeatability comparison or its postprocessor.
      run_id: 2026-09-06-imported-remote-evidence
      notes: 'sc13g non-MTP: 20/20 greedy vs V1G and V1EAGER, zero reported prefill deltas in truncated log. sc13g-MTP: 9/20
        greedy, not a gate.'
    performance:
      how: 'bench3.sh imported remote evidence: sc13g C1 43.1 tok/s, C4 92.0 agg tok/s, C8 95.6 agg tok/s; V1 baseline recorded
        separately at 33.8 tok/s with 188 GiB/seq4 flags.'
      run_id: 2026-09-06-sc13g-slotcache-eager
limits:
- 'Experimental, not verified: formal decode noninferiority is not established. The independent postprocessor is diagnostic only.'
- sc13g-MTP is faster in raw throughput but failed greedy equivalence (9/20), so it is recorded as evidence only and must
  not be used as the decode gate.
- The imported v1g campaign comparator used campaign defaults visible in inspect (200 GiB offload, seq8); the packaged V1
  baseline script intentionally preserves the earlier 188 GiB offload, bf16 KV 8 GiB, seq4, 65k flags.
- Model repo/revision is intended and pinned from HF API plus prior short SHA; local all-file checkpoint identity was not
  verified.
- scripts/launch-slotcache-portable.sh was packaged from campaign evidence but was not live-tested from this repo path.
- Existing scripts/launch-slotcache.sh is obsolete and campaign-hardcoded; prefer scripts/launch-slotcache-portable.sh for
  this package.
- Do not modify scripts/tf_decode.py as part of this package; its existing metric_pass is known insufficient for verification.
rollback:
  script: scripts/rollback.sh
  summary: Default is --dry-run and performs no Docker actions; --execute stops (does not remove) the named candidate and prefers the preserved baseline keeper. Fresh launch requires explicit --fresh-launch if the keeper is absent. Authenticated HTTP health follows startup; this helper is locally tested, not live-qualified.
links:
