  - path: configs/slots-5792-ctx512k.json
    sha256: 73962276498626af16baaa7c8737384960aff8718d254e66ab92610570c9743c
    purpose: Per-layer HBM slot allocation map for the live-tested 512K context / 48 GiB KV daily profile (5,792 slots over
      75 layers, min 48 / max 96 per layer, derived from the slots-8400 hit curves; mean predicted hit allocation 0.6166).
launch:
  script: scripts/launch-slotcache-portable.sh
  command: MODEL_DIR=/home/exx/models/GLM-5.3-NVFP4-big CACHE_DIR=$HOME/vllm-cache API_KEY_FILE=$HOME/.glm_api_key bash scripts/launch-slotcache-portable.sh
    sc13g 112 --compilation-config '{"mode":3,"backend":"eager"}'
  health: BASE_URL=http://127.0.0.1:30001 MODEL_NAME=glm-5.3-big bash scripts/health-check.sh performs HTTP-only /health,
    /v1/models, and optional /metrics reads.
  notable_flags:
  - 'V1 baseline script: --cpu-offload-gb 188, --kv-cache-dtype bfloat16, --kv-cache-memory 8589934592, --max-model-len 65536,
    --max-num-seqs 4.'
  - 'Slot-cache measured sc13g: --cpu-offload-gb 420 to offload routed experts, SLOT_CACHE=112, SLOT_CACHE_PER_LAYER=/w/trace/r1-base/slots-8400.json,
    SLOT_CACHE_ROUTER=ffi, bypass prefill above 16 tokens.'
  - 'Live-tested 512K profile, daily 2026-09-07 to 2026-09-13 ( container glm53-big-sc13g-mtp-ctx512k): --kv-cache-memory 51539607552 (48
    GiB), --max-model-len 524288, --max-num-seqs 1, SLOT_CACHE=112, SLOT_CACHE_PER_LAYER=configs/slots-5792-ctx512k.json,
    MTP(1). Launched from the portable script via KV_CACHE_MEMORY / MAX_MODEL_LEN / MAX_NUM_SEQS / SLOT_CACHE_PER_LAYER overrides.
    See results/2026-09-07-ctx512k-live/.'
  - 'Opt-in quiescent instrumentation requires a pre-generated patched runner plus SLOT_CACHE_PATCHED_RUNNER_SHA256, SLOT_CACHE_SOURCE_SHA,
    SLOT_CACHE_IMAGE_SHA, SLOT_CACHE_RECIPE_SHA, SLOT_CACHE_RUN_ID, SLOT_CACHE_ENGINE_GENERATION, SLOT_CACHE_WINDOW_STEPS,
    SLOT_CACHE_K_MODE, SLOT_CACHE_SNAPSHOT_DIR, STATS_SEC=0, SLOT_CACHE_EXPECTED_LAYERS=75, pinned IMAGE local ID, and exactly
    one MTP speculative config. With instrumentation disabled, the portable launcher defaults to image tag vllm-glm53-uva:v0.28.0-2cf0a691
    and preserves explicit IMAGE overrides. With instrumentation enabled, no-IMAGE defaults to the pinned local image ID and explicit
    tag/digest-tag/mismatched IMAGE values are rejected. SLOT_CACHE_RECIPE_SHA is the deterministic current recipe source-artifact
    hash over sorted relative-path/byte-count/file-sha rows excluding results/capture/cache-like trees; it is not a historical result manifest.'
  - 'Portable launcher SHA-256: aa45695801cf5d58a94b2fbaa78fe66a486cddd38bea42977cf772d493bec3b1 (2026-09-14; earlier reviewed hash aebe4fab6272a8ded9d2e871d5b9c536b641634ae9b10232db9fa5c33bcac04d). Review invalidation is scoped to the launcher hash only; instrumentation adapter, staged generator, generated patched runner, slot-cache hook, pinned source, and local image identity hashes are preserved.'
  - 'Decode noninferiority vs V1 established 2026-09-14: 3,071 teacher-forced tokens over 20 prompts scored on glm53-big-v1g-keep (no slot cache, no MTP) and on the daily lane launched from this tree; max |dlogp| 0.0, byte-identical; results/2026-09-14-agent-remap-draftcorr-scalarfuse-k2/windows/F-recipe-daily/noninferiority-vs-V1.json. Model identity verified the same day: sources/GLM-5.3-NVFP4-big.local-sha256.txt matches all 89 HF LFS sha256.'
  - 'Daily profile since 2026-09-14 10:35 CDT (container glm53-big-sc13g-mtp2-ctx256k-K2fuse-DAILY-20260914, promoted by James):
    the 2026-09-13 256K daily args plus SLOT_CACHE_HOOK=patches/slot_cache_hook_v2.py SLOT_CACHE_SCALAR_FUSE=1 (one Triton launch
    replaces three index_put_ scalar-slot copies per layer-step; 20/20 greedy-identical to stock) and MTP num_speculative_tokens=2.
    C1 512-token median 54.69 tok/s vs 51.40 K1 control, +7.25% paired [95% CI +4.33, +10.44], 8/8 prompt wins; K=2 teacher-forced
    margins reproduce the 2026-09-13 fair gate (11 sites, max |dlogp| 4.50). Rollback: docker start
    glm53-big-sc13g-mtp-ctx256k-K1-daily-keep-pre-fuse-20260913. See results/2026-09-14-agent-remap-draftcorr-scalarfuse-k2/.'
  - 'Measured dead on 2026-09-14 (same results dir): agent-traffic slot remap (+0.002 hit on 96,504 captured agent steps),
    MTP-draft routing prefetch (draft->next-step main overlap 0.0316 vs chance 0.0312), --max-num-batched-tokens 16384 (+0.19%).'
  - 'Previous daily 2026-09-13 to 2026-09-14 (container glm53-big-sc13g-mtp-ctx256k-DAILY-20260913, kept as K1-daily-keep-pre-fuse): --kv-cache-memory 25769803776 (24 GiB),
    --max-model-len 262144, --max-num-seqs 1, SLOT_CACHE=112, SLOT_CACHE_PER_LAYER=configs/slots-7360-ctx256k.json, MTP(1).
    Matched-window 512-token decode median 51.29 tok/s vs 44.83 (512K) and 34.14 (1M); greedy 20/20 identical across all three.
    See results/2026-09-13-context-slot-curve/.'
  - '1M profile (measured 2026-09-13, previously aborted 2026-09-07 during startup): 96 GiB KV, 2,672 slots, live hit 0.17,
    34.14 tok/s C1 median, engine init 92 s after weights, 1,097,600-token KV. Serves correctly; kept as a swap-in long-context
    option (container glm53-big-sc13g-mtp-ctx1m-keep-measured-20260913), not the default.'
  - Do not use /home/milo/gb300-big-v1/Dockerfile for this recipe; it is an unrelated SGLang Dockerfile.
