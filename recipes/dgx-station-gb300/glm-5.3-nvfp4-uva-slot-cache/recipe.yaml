    cuda: '13.2'
    gpu_memory_visible_gib: 250.7
    host_memory_gib: 494.5
    os: Ubuntu 24.04.4 LTS
    kernel: 6.17.0-1031-nvidia-64k
    snapshot: results/2026-09-05-v1-baseline/system.json
  required_settings:
