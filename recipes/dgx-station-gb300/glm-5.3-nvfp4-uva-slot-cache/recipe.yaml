schema: jm-recipe/v1
id: dgx-station-gb300/glm-5.3-nvfp4-uva-slot-cache
title: GLM-5.3-NVFP4-One-GB300
summary: Experimental vLLM UVA offload recipe for full GLM-5.3 NVFP4 on one DGX Station GB300. V1 keeps routed experts in
  host memory with bf16 KV; the slot-cache variants keep a small per-layer HBM expert cache and preserve measured prefill
  logits, but decode equivalence remains diagnostic rather than formal.
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-09-06'
tags:
- glm-5.3
- nvfp4
- vllm
- uva
- cpu-offload
- slot-cache
- experimental
model:
  name: GLM-5.3
  params: 744B (MoE)
  repo: https://huggingface.co/incoai/GLM-5.3-NVFP4
  revision: 54e52520606f96b3d9fc84088ad22882a61648ac
  quantization: NVFP4 (ModelOpt)
hardware:
  profile: hardware/dgx-station-gb300.yaml
  nominal:
    gpu_memory_gb: 288
    host_memory_gb: 496
  observed:
    gpu: NVIDIA GB300
    driver: '595.84'
    cuda: '13.2'
    gpu_memory_visible_gib: 250.7
    host_memory_gib: 494.5
    os: Ubuntu 24.04.4 LTS
    kernel: 6.17.0-1031-nvidia-64k
    snapshot: results/2026-09-05-v1-baseline/system.json
  required_settings:
  - 'Do NOT set CUDA_VISIBLE_DEVICES: DGX OS''s docker config already hides the display GPU; setting it can make the container
    see the wrong GPU set.'
  - CDMM/UVA offload must be enabled and stable before launching; this recipe depends on host-memory expert reads over Grace-Blackwell
    coherent memory.
runtime:
  engine: vLLM
  engine_version: 0.28.0 local GLM-5.3 UVA build
  engine_commit: 2cf0a6915ce544dc493a0990f2ea38d81601128a
  container:
    image: vllm-glm53-uva:v0.28.0-2cf0a691
    digest: sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
  patches:
  - path: patches/sitecustomize-bigv1.py
    sha256: 1238cf28c4d61fde53a223799c3df43333d8095e44d9437b49c6037cbbf4ff57
    purpose: V1 route-trace and FlashInfer autotune-cache key hook; launch-bigv1.sh bind-mounts it from patches/.
  - path: patches/sitecustomize.py
    sha256: 6b9b7a76d77bde03d1b4ee2f0daed7e1cc6feba8718fad526c9fe334bbf3b2a0
    purpose: Slot-cache import hook installed as container sitecustomize.py.
  - path: patches/exact_pin.py
    sha256: 93c8ee1420be870c505330f387f3168147539d6277be9500aae866d7bbf21bf0
    purpose: Exact pinned-host tensor allocation helper for UVA expert storage.
  - path: patches/ffi_route.py
    sha256: 38a36cfec0e0cf06e00e406b1d3f015b51d9147289269d4a180d161ba1c3eec7
    purpose: FFI router path used by sc11/sc12/sc13 slot-cache variants.
  - path: patches/slot_cache_hook.py
    sha256: 889613f0dc2e371a715a8c43e6ac0858d6ad7aefda7308ac67e8a2343cd715ad
    purpose: Latest per-layer slot-cache hook; builds per-layer HBM expert slots and routes decode through cached slots.
  - path: configs/slots-8400.json
    sha256: 4ee071670e13f199658776ddb7b508c9a068657ea631a0cb4287db0a2afeeaed
    purpose: Non-code per-layer HBM slot allocation map for the packaged slot-cache launcher.
launch:
  script: scripts/launch-slotcache-portable.sh
  command: MODEL_DIR=/home/exx/models/GLM-5.3-NVFP4-big CACHE_DIR=$HOME/vllm-cache API_KEY_FILE=$HOME/.glm_api_key bash scripts/launch-slotcache-portable.sh
    sc13g 112 --compilation-config '{"mode":3,"backend":"eager"}'
  health: BASE_URL=http://127.0.0.1:30001 MODEL_NAME=glm-5.3-big bash scripts/health-check.sh performs HTTP-only /health,
    /v1/models, and optional /metrics reads.
  notable_flags:
  - 'V1 baseline script: --cpu-offload-gb 188, --kv-cache-dtype bfloat16, --kv-cache-memory 8589934592, --max-model-len 65536,
    --max-num-seqs 4.'
  - 'Slot-cache measured sc13g: --cpu-offload-gb 420 to offload routed experts, SLOT_CACHE=112, SLOT_CACHE_PER_LAYER=/w/trace/r1-base/slots-8400.json,
    SLOT_CACHE_ROUTER=ffi, bypass prefill above 16 tokens.'
  - Do not use /home/milo/gb300-big-v1/Dockerfile for this recipe; it is an unrelated SGLang Dockerfile.
