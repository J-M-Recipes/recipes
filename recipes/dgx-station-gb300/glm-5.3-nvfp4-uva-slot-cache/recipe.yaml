schema: jm-recipe/v1
id: dgx-station-gb300/glm-5.3-nvfp4-uva-slot-cache
title: Full GLM-5.3 NVFP4 on one DGX Station GB300 (vLLM UVA offload + HBM expert slot cache + MTP)
summary: >-
  Full GLM-5.3 NVFP4 (~433 GB) on one DGX Station GB300 with vLLM 0.28 UVA expert offload plus a per-layer HBM expert slot cache
  (7,360 slots), a fused slot-cache hook, and MTP(2). Daily profile: 256K context, 24 GiB bf16 KV, single user. 54.7 tok/s C1
  vs 33.8 for the offload-only V1 baseline (+62%), decode noninferiority vs V1 established by full-token teacher-forced logprobs
  (3,071 tokens, byte-identical), 18/18 needle ladder to 211K tokens, model identity verified against HF LFS sha256.
  Closed levers with receipts: DFlash2-over-UVA, demand-fill DMA, offline slot reallocation, trace prediction, agent-traffic
  slot remap, MTP-draft prefetch, 16K batched tokens. See results/2026-09-14-agent-remap-draftcorr-scalarfuse-k2/.
status: verified
