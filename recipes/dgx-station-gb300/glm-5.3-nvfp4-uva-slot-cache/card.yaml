title: "GLM-5.3 (full 744B) · 1× DGX Station GB300"
subtitle: "The whole model on one Station: all 256 routed experts per layer pinned in Grace memory over NVLink-C2C, a per-layer HBM expert slot cache (7,360 slots, LRU) in front of them, one fused Triton hook, and the in-checkpoint MTP head at k=2 — 256K context, single user"
version: "K2 + fused hook “DAILY” since 2026-09-14 (+7.25% C1 vs K1 stock hook) · K1 daily 2026-09-13 = rollback, kept · corrected 2026-09-15"
run_id: 2026-09-14-agent-remap-draftcorr-scalarfuse-k2 (hero C1, fused hook, K2 promotion, noninferiority vs V1, model identity; container glm53-big-sc13g-mtp2-ctx256k-K2fuse-DAILY-20260914) · corrections 2026-09-15 in recipe.yaml limits (LRU 0.719 was a T//8000 subsample → 0.802; MTP-draft prefetch claim false) · 2026-09-13-k2-fair-gate-needle-trace (needle ladder, prefill, K2 margins, trace) · 2026-09-13-k2-selfrepeat-quality (task ladder, acceptance) · 2026-09-13-context-slot-curve (256K/512K/1M) · 2026-09-05-v1-baseline (33.8 tok/s)
