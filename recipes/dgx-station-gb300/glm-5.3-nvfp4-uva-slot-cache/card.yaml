  total_params: 744B               # Z.ai model card (GLM-5 lineage: 744B / 40B active); config.json expert mass ≈757B (render_card check)
  active_params: "40B"             # Z.ai model card; config-derived ≈43B when embeddings + lm_head + DSA indexer are counted
  checkpoint_gb: 464.9             # 464,863,404,121 B / 97 files at 54e52520 per HF API; README's "433 GB" is GiB (432.9)
  weights_short: "as shipped · NVFP4 routed experts (incoai / ModelOpt) at rev 54e52520 · 89/89 HF LFS sha256 match on the served copy"
  engine_extra: "vLLM 0.28.0 local GLM-5.3 UVA build · image vllm-glm53-uva:v0.28.0-2cf0a691 · slot_cache_hook v2 (SLOT_CACHE_SCALAR_FUSE=1) + FFI router, mounted via sitecustomize"
