verification:
  gates:
    schema:      { how: "scripts/check_recipe.py passes" }
    digest:      { how: "engine image vllm/vllm-openai:v0.31.0 repo digest == image id sha256:c1c9f6fd...; workers nvcr.io/nvidia/pytorch:26.07-py3 sha256:3b0a5c3a...; checkpoint revision b2428a0b; banks SHA-256 equal on Station and each Spark; published k3pod.py and k3hop.c byte-identical to the files the box ran" }
    health:      { how: "9/9 workers K3HOP_LISTEN with WGRAPH boot check passed; engine 'proxy started - 9 workers'; k3pod_probe.py 3 greedy prompts coherent; fault injection - killing a worker mid-decode kills the engine (container exits, /health stops answering; the open stream is cut short and still ends with [DONE]) - results/2026-10-30-k3-four-tier/raw/fault-injection/" }
    quality:     { how: "PER-LAYER ONLY - shadow parity vs stock vLLM layers 1-12 (cos >= 0.9993 worst layer mean) and all 92 layers vs an fp32 checkpoint reference on full-model inputs (87/92 >= 0.99, outliers matched by a kernel-faithful NVFP4 emulation and by stock). No teacher-forced divergence, tool-call or task benchmark - pending; no reference engine can hold the whole model." }
    performance: { how: "18.5 tok/s C1 decode reproduced after two reboots within 1% (54.57, 54.36 ms/token)" }

limits:
  - "Prompt reading is 576 tok/s (3,364-token prompt: 5.8 s to first token) with 1,024-token chunks: one message per worker per chunk (4 x 8 MiB transport slots), one grouped B12x call on the worker, rows gathered and replies summed by the GPU straight in cudaHostRegister'ed Station buffers. At 256-token chunks it was 231 tok/s: then ~6 ms of each ~11 ms layer step was the Station's own experts, ~270 of them read from Grace over C2C at ~850 GB/s, once per chunk - larger chunks amortize that read. Chunks are capped at 1,024 (k3proto.BATCH_MAX_M, slot size); K3POD_MAX_REMOTE_M must be >= the chunk or remote experts would be skipped (the launcher ties them). The batched step runs outside the CUDA graph."
  - "The batched worker kernel is compiled per padded row count; worker.py builds every bucket at boot (~30-70 s on first boot, cached after) and must warm the dynamic kernel FIRST - warming the static buckets first builds the wrong cache keys and the first real chunk then compiles for ~3 s (seen twice during bring-up). The Station waits 5 s for a batched reply (2 s for decode)."
  - "Up to 8 concurrent requests (--max-num-seqs 8). Decode steps of 2-8 tokens run through the graph-resident proxy (C batch path); the Sparks replay a CUDA graph per (pair bucket, layer) and the RTX runs them eagerly (see next limit). 1 / 2 / 4 / 8 streams = 54.2 / 88.4 / 113.1 / 172.5 ms per step, 18.5 / 22.6 / 35.4 / 46.4 tok/s total (steady gaps; 13.4 / 20.8 / 33.2 / 45.3 with TTFT and tails). Each user slows as more join (~5.8 tok/s each at 8). Before the multi-token proxy these steps left the CUDA graph: 235 / 266 / 305 ms. The 172 ms at 8 streams is not fully explained; one measured part: the workers' B12x micro kernel costs ~80 us per distinct expert up to 8 rows and jumps at 9 rows (8 experts 640 us, 9 -> 1,013 us; raw/k3-5-bucket-sweep-spark1.txt), and a Spark typically gets 9-10 pairs at 8 streams. Splitting into groups of <= 8 was tried and not shipped (RTX check failures). --max-model-len 4096; long context is untested."
  - "The RTX's small-batch CUDA graphs fail worker.py's graph-vs-eager boot check intermittently, so run-worker-rtx.sh sets K3_SMALLB=0 (RTX multi-token decode runs eagerly; its one-token graphs are unaffected; costs ~12 ms per step at 2 streams, nothing measurable at 4-8). Tested offline 2026-10-31 (scripts/check/rtx_sb_check.py, raw/rtx-graph-check/): the graphs are CORRECT - their mean matches the eager mean within noise and they are as close to an fp32 checkpoint reference as eager (0.153 vs 0.154; the gap is NVFP4 activation quantization); 0 of 640 graph runs went wrong vs 2 of 640 eager runs. The check misfires because RTX graph replays scatter ~2.3x more than eager runs (pairwise 1.7e-2 vs 7.4e-3; scripts/check/rtx_check_bias.py) and its rule is 'within 1.5x of eager'. Both bad eager runs (1x and 49x off fp32) were the first eager call after a graph capture on the same layer, reproducible - a FlashInfer B12x eager-after-capture artifact; serving never makes that call. Shadow parity for the eager-RTX configuration: layers 1-11 cos mean 0.99979-0.99992."
  - "No model-level quality gate. Correctness evidence is per layer (shadow vs stock on layers 1-12, fp32 reference on all 92 with real inputs). There is no teacher-forced comparison against a reference engine, no tool-call gate and no task benchmark, because no machine here can run a stock copy of the whole 1.5 TB of experts."
  - "Four of 92 layers (24, 25, 36, 48) have small MoE inputs where NVFP4 activation quantization loses precision vs fp32 (cosine 0.84-0.99); both tiers match an exact emulation of that quantization at 0.992-0.997 and stock vLLM's kernel shows the same loss. Layer 12's routed MoE output is ~0.2% of its input; pod and stock agree at cosine 0.9993 there, both ~0.05 vs fp32."
  - "The workers' B12x expert kernel is not run-to-run deterministic - 0.8-2% repeat difference on GB10 and a timing-dependent heavy tail up to ~5-6% on the RTX's sm_120 build, with or without CUDA graphs. Two boots give logprobs ~0.12-0.14 apart (median) and greedy text can flip at near-ties. Upstream repro - scripts/check/rtx_tail_check.py."
  - "Every worker is on the critical path. If one dies or stalls past 2 s the proxy SIGKILLs the engine core; vLLM then exits. The in-flight stream is cut short (578 of 2,000 tokens in the test) and still closes with a normal [DONE]; whether vLLM sends an error chunk first was not recorded, so a client must check finish_reason / token count to tell a truncated answer from a complete one. Recovery is start-workers.sh plus a ~20 min engine boot. Workers accept one engine connection per start."
  - "An earlier proxy build failed with abort(), which left the engine core writing a ~480 GB core dump while /health stayed 200 and requests hung (fault injection run 1). The published build uses SIGKILL; do not change it back."
  - "Grace is full (493 of 494 GiB) - the Station cannot take more experts and nothing else large can run on it."
  - "Placement is uniform (seeded random), not heat-aware. Simulated with the measured costs, hot/cold placement saves only 1-6 ms/token - the busiest Spark's 75 us per expert sets the floor and a hotter Station reads more from Grace at ~48 us per expert."
  - "Speed numbers were printed by the bench scripts, not saved as files; they are transcribed in raw/speed-transcribed.txt (labelled). The parity, fault-injection and worker receipts are the original files."
  - "Fabric addresses and the Spark-to-plan-target map are fixed in k3pod.py and start-workers.sh for this topology; another fabric needs those two edits."

rollback:
  script: scripts/stop-pod.sh
  summary: "Stops the engine container on the Station and the nine workers; nothing is installed system-wide. The reference box's previous lane (DeepSeek-V4.1-Flash, sibling recipe dgx-station-gb300/deepseek-v4.1-flash-vllm-uva-dspark-sidecar) is restored with that recipe's own launcher after this pod is stopped - the two cannot share the GB300."

