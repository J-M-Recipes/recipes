schema: jm-recipe/v1
id: dgx-spark-1x/kimi-k3-q0-0086-1x-spark
title: "Kimi-K3 at 0.0086 bits/parameter on one DGX Spark (12 layers, 16/896 experts, Q1_0) — a joke with receipts"
summary: >-
  Deliberately useless. This recipe takes the 2.8T-parameter Kimi-K3, HTTP-range-fetches 9.4% of a published GGUF so that
  only 16 of 896 routed experts per layer are ever downloaded, throws away 81 of 93 layers, requantizes the survivors to
  Q1_0 (1.125 bpw with llama.cpp's existing quantizer), and serves 3.01 GB on one GB10 at 83.65 tok/s decode and 1,806.63
  tok/s prefill. The output is not language. That part is optional; the point is the arithmetic: bits-per-weight is
  file_bytes * 8 / advertised_parameter_count, so deleting weights does nothing to your headline number until you notice
  what it does to the denominator's coverage. Same weights, same quantizer, three depths: 93 layers 11.27 tok/s (declared
  0.0447 bpw), 24 layers 49.03 (0.0140), 12 layers 83.65 (0.0086). Every number here was measured on one box on
  2026-10-22; none of it should be deployed or cited as a quantization result.
status: experimental
owners:
- jmeadlock
- milo
updated: '2026-10-22'
tags:
- kimi-k3
- q1_0
- extreme-quantization
- moe
- expert-pruning
- depth-pruning
- bits-per-weight
- dgx-spark
- gb10
