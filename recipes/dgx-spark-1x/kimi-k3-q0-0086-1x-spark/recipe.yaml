verification:
  gates:
    schema:
      how: scripts/check_recipe.py passes on this directory
      last_pass_utc: '2026-10-22T16:20:00Z'
      run_id: 2026-10-22-k3-q01-lulz
    digest:
      how: >-
        Source pinned by repo revision (a0836360) and per-file sizes from the Hub manifest; byte spans were computed from
        each shard's own GGUF header and fetched by range, so every tensor in the output is a verbatim copy of a source
        tensor. Individual tensor sha256 was NOT recorded, and the 594 GB source was never fully downloaded (9.4% only).
      last_pass_utc: '2026-10-22T16:04:00Z'
      run_id: 2026-10-22-k3-q01-lulz
      notes: A real recipe would hash the shipped artifact; this one is a joke and hashes its arithmetic instead.
    health:
      how: >-
        /v1/models returns 200 with the model id; a chat completion honours a 48-token cap at temperature 0 and reports
        its own timings (81.30 tok/s on that request). Raw JSON and server log in raw/smoke-L12.txt.
      last_pass_utc: '2026-10-22T16:05:00Z'
      run_id: 2026-10-22-k3-q01-lulz
    quality:
      how: >-
        FAIL AS DESIGNED — there is no quality gate because there is no output to gate. Greedy 48-token sample:
        "moderate moderate … Zem Nom Nom". 99.4% of the weight volume is absent and the survivors were requantized twice
        (IQ1_S then Q1_0), so teacher-forced divergence against Kimi-K3 is not a threshold, it is a different language
        model. This row is the one thing the recipe deliberately does not have.
      run_id: 2026-10-22-k3-q01-lulz
    performance:
      how: >-
        llama-bench -p 128 -n 128 -ngl 99 -r 3 on an otherwise idle node (Sparks 1-4 were running the DSV4.1 lane; Sparks
        6-8 idle). The reported spread is the bench's own stddev across repetitions, not across boots.
      last_pass_utc: '2026-10-22T16:04:58Z'
      run_id: 2026-10-22-k3-q01-lulz
limits:
- "Output is not language. It is token-shaped noise. Any use of this artifact outside a joke is a misuse, and the joke is about accounting, not about the model."
- "The headline number is a division, not a quantization result: 0.0086 bits/param divides by 2.8T parameters of which 0.56% are present. Over the tensors actually shipped the file is 1.544 bpw."
- "Not a 1-bit model in any meaningful sense: the quantizer is stock Q1_0 (1.125 bpw) and 99.4% of the weights were deleted, not represented at 0.1 bit."
- "Q1_0 is the llama.cpp floor. Lower quant is not a speed lever here: decode is bandwidth-bound on the 15.6B weights read per token, so depth and active-expert count are the levers."
- "Single box, single user, no concurrency measurement. C16 and any multi-user number are unmeasured; do not infer them from tg128."
- "Do not publish the 3 GB GGUF as a model release: Kimi-K3 ships under the Kimi K3 license (not Modified MIT), and a derivative repack is a licensing question that the script is not."
- "The 93-layer build (0.0447 bpw) exists only as a ladder rung; it was never served under load and its 11.27 tok/s is a bench row, not a lane."
- "No KV quantization, no flash-attn, no speculation, no tuning. Speeds are untuned but not floored: a careful run would find a few percent, and it would still be a joke."
rollback:
  script: scripts/stop.sh
  summary: >-
    Nothing to roll back to: this recipe never replaced a serving lane. scripts/stop.sh kills the server by pid file and
    frees the 3 GB. The node was idle before and is idle after; Sparks 1-4 kept running the DSV4.1 lane untouched
    throughout.
