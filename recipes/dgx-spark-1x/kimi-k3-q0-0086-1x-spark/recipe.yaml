model:
  name: Kimi-K3 (2.8T MoE) — depth- and expert-pruned derivative, Q1_0
  params: 2.8T nominal / 104.78B in the 93-layer build / 15.60B in the shipped 12-layer build (llama.cpp counts the tensors present)
  repo: https://huggingface.co/moonshotai/Kimi-K3
  revision: f831ab66814297da540d832a5235f8e904f29d06
  quantization: >-
    Not a new format and not a real 1-bit model. Source tensors are byte-range-fetched from unsloth/Kimi-K3-GGUF
    UD-IQ1_S @ a0836360 (594.0 GB, 14 shards): every non-expert tensor whole plus the first 16 of 896 slabs of each
    *_exps.weight, so 56.10 GB (9.4%) is fetched in 7.7 min and 537.9 GB is never requested. That file is then cut to 12
    layers and requantized whole with stock llama-quantize --allow-requantize Q1_0, giving 3,010,804,800 B. UD-Q1_0 is
    unusable as a source: its expert tensors are ggml type 66, a patched-fork type upstream rejects.
  draft:
    repo: https://huggingface.co/moonshotai/Kimi-K3
    revision: f831ab66814297da540d832a5235f8e904f29d06
    method: none — no drafter and no speculation; the artifact is 15.6B of weights and 83.65 tok/s is its plain decode rate
hardware:
  profile: hardware/dgx-spark-1x.yaml
  nominal:
    unified_memory_gb: 128
    nodes: 1
  observed:
    gpu: NVIDIA GB10
    driver: '595.84'
    cuda: 13.0 (host toolkit 13.0.88; llama.cpp built for sm_121)
    gpu_memory_visible_gib: 121.69
    host_memory_gib: 121.7
    os: Ubuntu 24.04.5 LTS (DGX OS 7.2.3 build)
    kernel: 6.17.0-1031-nvidia
    snapshot: results/2026-10-22-k3-q01-lulz/system.json
runtime:
  engine: llama.cpp
  engine_version: 0.7.0-dev (build 1)
  engine_commit: 36cbf41
  container:
    image: none — host build, no container; digest is the sha256 of build/bin/llama-server
    digest: sha256:699c87830fae51ff4c57339e53ef82e5be8f5ac163a8032bcd8eb50f52f2d88d
  key_libraries:
    cuda: '13.0.88'
    cmake: system package
    gcc: '13.3.0'
launch:
  script: scripts/serve.sh
  command: MODEL=${MODEL:-k3-q01-L12.gguf} NGL=99 CTX=4096 PORT=8099 bash scripts/serve.sh
  health: >-
    curl -sf http://127.0.0.1:8099/v1/models returns the model id inside ~2 s of the weights finishing mmap (3.01 GB);
    a 94-token prompt returns 48 completion tokens at temperature 0 (raw/smoke-L12.txt)
  warmup: >-
    llama-bench -m MODEL -p 128 -n 128 -ngl 99 -r 3 is self-warming per repetition and the first timed repetition is not
    discarded. The serving sample was taken after one 94-token request on a fresh boot.
  notable_flags:
  - "-ngl 99 — every tensor on the GB10; 3.01 GB of unified memory, no offload involved"
  - "-c 4096 — the advertised 1,048,576 context is meaningless at 12 layers; 4096 is arbitrary and small on purpose"
  - "-t 8 — CPU threads only drive sampling and tokenization here"
  - "No flash-attn, no KV quantization, no speculation: nothing on this stack is tuned, because tuning a joke is how you end up publishing one"
