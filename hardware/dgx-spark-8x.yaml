# Hardware profile: 8x NVIDIA DGX Spark (GB10) on one MikroTik CRS804-4DDQ, 200G RoCE ("GhettoRak")
# Values under `observed` come from scripts/collect_system_snapshot.sh on each node (results bundles keep all eight).
slug: dgx-spark-8x
name: 8x NVIDIA DGX Spark (GB10), CRS804 200G RoCE fabric
vendor: NVIDIA (nodes), MikroTik (switch)
form_factor: desk cluster, one node per wire-rack deck
nominal:
  gpu: NVIDIA GB10 (Blackwell, SM121) x8
  unified_memory_gb_per_node: 128      # LPDDR5X shared by CPU and GPU
  memory_bandwidth_gbs_per_node: 273
  nic: ConnectX-7, one QSFP56 cage used per node (200G), two PCIe functions per cage
  switch: MikroTik CRS804-4DDQ, 4x QSFP56-DD 400G, each broken out 2x200G (NADDOD Q2Q56 MikroTik-coded DAC)
observed:                              # 2026-10-16
  gpu: NVIDIA GB10
  memory_total_gib_per_node: 121.69    # torch.cuda.mem_get_info total; nvidia-smi memory.total reads [N/A] on GB10
  driver: "595.84"
  cuda: "13.2"
  os: Ubuntu 24.04.4 LTS (DGX OS 7.2.3, OTA 7.4.0)
  kernel: 6.17.0-1031-nvidia           # apt-held; 7.0.0-1019 breaks NCCL/RoCE memory registration
  cx7_firmware: 28.45.4028
  routeros: 7.24.2 stable
  fabric: per node enp1s0f0np0 10.0.0.N/24 + enP2p1s0f0np0 10.0.1.N/24, MTU 9000, lossy RoCEv2 (PFC off, QoS trust off), one bridge with hardware offload on the 8 lane-master sub-ports, forced 200G-baseCR4 / FEC91 / autoneg off
  nccl_allreduce_8node_busbw_gbs: 20.13   # 1 GiB float32, NCCL 2.27.7; 23.49 @32 MiB
notes:
  - Unified memory is the whole game. Host page cache consumes CUDA-visible memory 1:1; drop caches during boot and keep vm.swappiness=10.
  - "nvidia-smi memory.total / power.limit read [N/A] on GB10; record memory from torch and power at the wall."
  - "Each QSFP cage shows up as two ~100G PCIe functions on ONE 200G wire. Put both in NCCL_IB_HCA, on separate subnets; they are not two rails."
  - Wall power at stock clocks, GLM-5.3 FP8 TP8 decode + 70K-token prefill: 169-189 W per node, ~1.5 kW for 8 nodes + switches. A single 15 A / 120 V strip (1,440 W continuous) does not carry all eight; this rack splits Sparks 1-6 and 7-8 across feeds.
  - "After any cable move or port bounce the CX-7 can sit in a low-throughput state that mlxlink does not show; a full power-off reboot (not mtk-hotplug plug-in) restores it. Bandwidth-check before benchmarking."
