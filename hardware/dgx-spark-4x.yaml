# Hardware profile: 4x NVIDIA DGX Spark (GB10) — one half of the 8-node CRS804 rack ("GhettoRak"), 200G RoCE
# Same nodes, switch and fabric settings as hardware/dgx-spark-8x.yaml; this profile is the 4-node (TP4) cut used when
# the rack is split into two independent pods (Sparks 1-4 and Sparks 5-8). Values under `observed` come from
# scripts/collect_system_snapshot.sh on each node (results bundles keep all four).
slug: dgx-spark-4x
name: 4x NVIDIA DGX Spark (GB10), CRS804 200G RoCE fabric (half-rack pod)
vendor: NVIDIA (nodes), MikroTik (switch)
form_factor: desk cluster, one node per wire-rack deck; two 4-node pods share one switch
nominal:
  gpu: NVIDIA GB10 (Blackwell, SM121) x4
  unified_memory_gb_per_node: 128      # LPDDR5X shared by CPU and GPU
  memory_bandwidth_gbs_per_node: 273
  nic: ConnectX-7, two QSFP56 cages per node, one 200G port per PCI domain cabled (rocep1s0f0 + roceP2p1s0f0)
  switch: MikroTik CRS804-4DDQ, 4x QSFP56-DD 400G, each broken out 2x200G (NADDOD Q2Q56 MikroTik-coded DAC); the other pod hangs off the same switch
observed:                              # 2026-10-19/20
  gpu: NVIDIA GB10
  memory_total_gib_per_node: 121.69    # torch.cuda.mem_get_info total; nvidia-smi memory.total reads [N/A] on GB10
  driver: "595.84"
  cuda: "13.2"
  os: Ubuntu 24.04.4 LTS on Sparks 1-4, 24.04.5 LTS on Sparks 5-8 (DGX OS 7.2.3 build; OTA levels differ by pod - see each bundle's system/ snapshots)
  kernel: 6.17.0-1031-nvidia           # apt-held; 7.0.0-1019 breaks NCCL/RoCE memory registration
  page_size_kib: 4
  cx7_firmware: 28.45.4028
  routeros: 7.24.2 stable
  fabric: per node enp1s0f0np0 10.0.0.N/24 + enP2p1s0f0np0 10.0.1.N/24, MTU 9000, lossy RoCEv2 (PFC off, QoS trust off), forced 200G-baseCR4 / FEC91 / autoneg off
  gpu_clock_cap_mhz: 2200              # nvidia-smi -lgc 0,2200 as a systemd unit on all nodes; clocks.gr under load 2190
  cross_pod_prefill_contention: none measured   # 2026-10-20: 93K cold prefill on one pod 6,219 -> 6,242 tok/s while the other pod prefilled back-to-back (vLLM pod 5,993 -> 6,009)
notes:
  - Unified memory is the whole game. Host page cache consumes CUDA-visible memory 1:1; drop caches and compact memory before every boot and gate on MemAvailable (>= 100 GiB in these campaigns). THP was left at the OS default (madvise).
  - "nvidia-smi memory.total / power.limit read [N/A] on GB10; record memory from torch and power at the wall."
  - "Each QSFP cage shows up as two ~100G PCIe functions on ONE 200G wire. Put both PCI domains' f0 ports in NCCL_IB_HCA, on separate subnets; f1 ports are uncabled here."
  - Two TP4 pods on one CRS804 do not slow each other's single-stream long prefill (A/B 2026-10-20, 93K tokens, both engines). Not tested - both pods under concurrent multi-stream needle load.
  - "After any cable move or port bounce the CX-7 can sit in a low-throughput state that mlxlink does not show; a full power-off reboot restores it. Bandwidth-check before benchmarking."
  - Clock cap 2200 MHz costs 0.7-2.2% decode and 1.5-5% prefill versus uncapped (community data); kept on because an uncapped 8-node 514K prefill tripped a 1,440 W strip.
